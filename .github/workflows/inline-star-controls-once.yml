name: Inline estrella controls once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inline-star-controls-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Incrustar música y navegación autónomas en estrella
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('estrella/index.html')
          s=p.read_text(encoding='utf-8')
          marker='id="orasStarInlineNav"'
          if marker in s:
              print('Ya estaba aplicado')
              raise SystemExit(0)
          block=r'''<style id="orasStarInlineStyle">
          #musicStart{display:inline-flex!important;align-items:center;justify-content:center;min-height:40px;pointer-events:auto!important;position:relative;z-index:60}
          #orasStarInlineNav{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2147483646;display:grid;grid-template-columns:1fr auto 1fr;width:min(560px,calc(100vw - 24px));height:48px;border:1px solid rgba(255,255,255,.18);border-radius:14px;overflow:hidden;background:rgba(8,12,20,.92);color:#f8eee4;box-shadow:0 8px 30px rgba(0,0,0,.32);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
          #orasStarInlineNav button{appearance:none;border:0;background:transparent;color:inherit;height:48px;padding:0 14px;font:500 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;pointer-events:auto!important;white-space:nowrap}
          #orasStarInlineNav button+button{border-left:1px solid rgba(255,255,255,.11)}
          #orasStarInlineNav button:hover{background:rgba(255,255,255,.07)}
          #orasStarInlineNav [data-index]{font-weight:700}
          @media(max-width:620px){#orasStarInlineNav{height:44px;bottom:max(8px,env(safe-area-inset-bottom));border-radius:12px}#orasStarInlineNav button{height:44px;font-size:11px;padding:0 8px}}
          </style>
          <nav id="orasStarInlineNav" aria-label="Navegación ORAS"><button type="button" data-prev>← Anterior</button><button type="button" data-index>Índice ORAS</button><button type="button" data-next>Siguiente →</button></nav>
          <script id="orasStarInlineCore">
          (()=>{
          'use strict';
          if(window.__orasStarInlineInstalled)return;
          window.__orasStarInlineInstalled=true;
          const BASE='/solo-la-tarjeta';
          const direct=window.parent===window;
          const start=document.getElementById('musicStart');
          const enabled=document.getElementById('musicEnabled');
          const slider=document.getElementById('musicLevel');
          const output=document.getElementById('musicValue');
          const nav=document.getElementById('orasStarInlineNav');
          const masterKey='oras.master.volume.v1';
          const stateKey='oras.ana.star.music.v1';
          const readVolume=()=>{try{const n=Number(localStorage.getItem(masterKey));return Number.isFinite(n)?Math.max(0,Math.min(100,n)):80}catch(_){return 80}};
          let audio=null;
          if(direct){
            audio=document.createElement('audio');
            audio.id='orasStarInlineAudio';
            audio.src=BASE+'/elegia-breve/ana-klaudya.m4a?v=20261017-star-inline-audio-2';
            audio.preload='auto';audio.loop=true;audio.setAttribute('playsinline','');audio.style.display='none';
            document.body.appendChild(audio);
            const level=readVolume();
            if(slider){slider.max='100';slider.value=String(level)}
            if(output)output.textContent=Math.round(level)+' %';
            if(enabled)enabled.checked=level>0;
            audio.volume=level/100;audio.muted=!(enabled?enabled.checked:level>0);
            const label=()=>{if(start){start.hidden=false;start.textContent=(!audio.paused&&!audio.muted)?'Pausar música':'Reproducir música'}};
            const sync=()=>{const pct=slider?Math.max(0,Math.min(100,Number(slider.value)||0)):level;if(output)output.textContent=Math.round(pct)+' %';try{localStorage.setItem(masterKey,String(Math.round(pct)))}catch(_){};audio.volume=pct/100;audio.muted=enabled?!enabled.checked:pct===0};
            const play=()=>{if(enabled)enabled.checked=true;sync();audio.muted=false;try{const p=audio.play();if(p&&typeof p.then==='function')p.then(label).catch(label)}catch(_){label()}};
            const pause=()=>{try{audio.pause()}catch(_){};label()};
            if(start){start.hidden=false;start.textContent='Reproducir música';start.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();if(!audio.paused&&!audio.muted)pause();else play()},{capture:true})}
            slider?.addEventListener('input',e=>{e.stopImmediatePropagation();sync();label()},{capture:true});
            enabled?.addEventListener('change',e=>{e.stopImmediatePropagation();if(enabled.checked)play();else pause()},{capture:true});
            audio.addEventListener('playing',label);audio.addEventListener('pause',label);audio.addEventListener('error',label);label();
            play();
          }
          const save=()=>{if(!audio)return;try{sessionStorage.setItem(stateKey,JSON.stringify({time:Number.isFinite(audio.currentTime)?audio.currentTime:0,volume:Number.isFinite(audio.volume)?audio.volume:readVolume()/100,playing:!audio.paused&&!audio.muted}))}catch(_){}};
          nav?.querySelector('[data-prev]')?.addEventListener('click',()=>{location.href=BASE+'/?read=solo'});
          nav?.querySelector('[data-index]')?.addEventListener('click',()=>{location.href=BASE+'/?indice=1'});
          nav?.querySelector('[data-next]')?.addEventListener('click',()=>{save();location.href=BASE+'/elegia-breve/?v=20261017-ana-inline-2&afterPrologue=1'});
          })();
          </script>'''
          if '</body>' not in s:
              raise RuntimeError('No se encontró </body>')
          s=s.replace('</body>',block+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'id="orasStarInlineNav"' estrella/index.html
          grep -Fq 'orasStarInlineAudio' estrella/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add estrella/index.html
          git commit -m 'ANA: incrusta música y navegación en estrella'
          git push
