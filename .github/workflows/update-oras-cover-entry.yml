name: Actualiza entrada portada ORAS

on:
  push:
    paths:
      - '.oras-cover-entry-update'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar portada definitiva e interacción
        run: |
          python - <<'PY'
          from pathlib import Path

          master = Path('oras-master-index-r1.js')
          s = master.read_text(encoding='utf-8')
          changes = [
              ("const VERSION='20261013-master-index-3';", "const VERSION='20261013-master-index-cover-4';"),
              (".oras-master-cover-frame{position:relative;height:min(100svh,calc(100vw * 1.5));width:min(100vw,calc(100svh * .6666667));aspect-ratio:2/3;", ".oras-master-cover-frame{position:relative;height:min(100svh,calc(100vw * 1.491624));width:min(100vw,calc(100svh * .670410));aspect-ratio:1373/2048;"),
              (".oras-master-cover-img{display:block;width:100%;height:100%;object-fit:cover}", ".oras-master-cover-img{display:block;width:100%;height:100%;object-fit:contain}"),
              (".oras-master-button{position:absolute;left:50%;top:50.4%;width:31%;", ".oras-master-button{position:absolute;left:50%;top:49.6%;width:34%;"),
              ("cover.setAttribute('aria-label','Portada de ORAS');", "cover.setAttribute('aria-label','Portada de ORAS · Lo que queda de las horas');"),
              ("${ROOT}/assets/oras-el-archivo-profundo-cover.svg?v=${VERSION}", "${ROOT}/assets/oras-portada-final.jpg?v=${VERSION}"),
              ("alt=\"ORAS · El archivo profundo\"", "alt=\"ORAS · Lo que queda de las horas\"")
          ]
          for old, new in changes:
              if old not in s:
                  raise SystemExit(f'No se encontró patrón en master: {old[:80]}')
              s = s.replace(old, new, 1)
          master.write_text(s, encoding='utf-8')

          rw = Path('oras-reading-window-r2.js')
          r = rw.read_text(encoding='utf-8')
          old = "/solo-la-tarjeta/oras-master-index-r1.js?v=20261013-master-index-2"
          new = "/solo-la-tarjeta/oras-master-index-r1.js?v=20261013-master-index-cover-4"
          if old not in r:
              raise SystemExit('No se encontró el cargador del índice maestro')
          rw.write_text(r.replace(old, new, 1), encoding='utf-8')

          root = Path('index.html')
          h = root.read_text(encoding='utf-8')
          old = '/solo-la-tarjeta/oras-reading-window-r2.js?v=20261013-ana-portrait-prev-next-1'
          new = '/solo-la-tarjeta/oras-reading-window-r2.js?v=20261013-master-index-cover-4'
          if old not in h:
              raise SystemExit('No se encontró el cargador de lectura raíz')
          root.write_text(h.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .oras-cover-entry-update .github/workflows/update-oras-cover-entry.yml
      - name: Publicar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Actualiza la portada definitiva y su botón de acceso al índice'
          git push
