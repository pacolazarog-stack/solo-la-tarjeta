name: Halve Ceniciento clarity transition
on:
  push:
    paths:
      - '.github/workflows/halve-ceniciento-clarity.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Halve transition and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ceniciento/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'const start=performance.now(),dur=20000;'
          new = 'const start=performance.now(),dur=10000;'
          if old not in s:
              raise SystemExit('Expected clarity duration not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/halve-ceniciento-clarity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ceniciento/index.html .github/workflows/halve-ceniciento-clarity.yml
          git commit -m 'Halve Ceniciento clarity transition to 10 seconds'
          git push origin HEAD:main
