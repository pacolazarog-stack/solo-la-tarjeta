name: Patch Solo direct entry and final navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-solo-direct-endnav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch direct entry, end navigation and cache key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('narrative-universe.js')
          js = js_path.read_text(encoding='utf-8')

          old_version = "const VERSION='20261010-6';"
          new_version = "const VERSION='20261010-7';"
          assert old_version in js
          js = js.replace(old_version, new_version, 1)

          css_anchor = '  .ou-return{position:fixed;z-index:80;left:50%;bottom:6.2svh;transform:translateX(-50%);appearance:none;border:0;background:none;color:#fffaf1;padding:.5em 1em;font:italic 400 clamp(1.05rem,2.4vw,1.35rem)/1 Georgia,"Times New Roman",serif;letter-spacing:.035em;opacity:0;visibility:hidden;cursor:pointer;transition:opacity 2.4s ease,visibility 2.4s ease;text-shadow:0 2px 18px rgba(0,0,0,.9)}.ou-return.ou-visible{opacity:.72;visibility:visible}.ou-return:hover,.ou-return:focus-visible{opacity:1;outline:none}\n'
          assert css_anchor in js
          css_insert = css_anchor + '  .ou-solo-endnav{position:fixed;z-index:82;left:50%;bottom:6.2svh;transform:translateX(-50%) translateY(8px);display:flex;align-items:center;justify-content:center;gap:clamp(1.1rem,3vw,2.4rem);max-width:min(92vw,760px);opacity:0;visibility:hidden;transition:opacity 2s ease,transform 2s ease,visibility 2s ease;text-align:center}.ou-solo-endnav.ou-visible{opacity:.76;visibility:visible;transform:translateX(-50%) translateY(0)}.ou-solo-endnav a{color:#fffaf1;text-decoration:none;font:italic 400 clamp(.92rem,1.8vw,1.14rem)/1.25 Georgia,"Times New Roman",serif;letter-spacing:.025em;text-shadow:0 2px 18px rgba(0,0,0,.9);opacity:.78;transition:opacity .4s ease,text-shadow .4s ease}.ou-solo-endnav a:hover,.ou-solo-endnav a:focus-visible{opacity:1;text-shadow:0 2px 22px rgba(0,0,0,1);outline:none}.ou-solo-endnav .ou-sep{color:rgba(255,250,241,.34);font-size:.8em;pointer-events:none}\n'
          js = js.replace(css_anchor, css_insert, 1)

          old_finish = "function finishSolo(){\n  if(state.soloComplete)return;\n  save({soloComplete:true});\n  state=readState();\n  ghost('Una casualidad rara vez termina donde parece.','after-solo',{where:'low',delay:2600,hold:6500});\n}\n"
          assert old_finish in js
          new_finish = "function showSoloEndNav(){\n  if(document.querySelector('.ou-solo-endnav'))return;\n  const nav=document.createElement('nav');\n  nav.className='ou-solo-endnav';\n  nav.setAttribute('aria-label','Continuar desde Solo la tarjeta');\n  const back=document.createElement('a');\n  back.href=rootPath+'elegia-breve/';\n  back.textContent='Volver a Ana Klaudya';\n  const sep=document.createElement('span');\n  sep.className='ou-sep';\n  sep.textContent='·';\n  const next=document.createElement('a');\n  next.href=rootPath+'ceniciento/';\n  next.textContent='Ir a Ceniciento';\n  nav.append(back,sep,next);\n  document.body.appendChild(nav);\n  after(900,()=>nav.classList.add('ou-visible'));\n}\n\nfunction finishSolo(){\n  if(!state.soloComplete){\n    save({soloComplete:true});\n    state=readState();\n    ghost('Una casualidad rara vez termina donde parece.','after-solo',{where:'low',delay:2600,hold:6500});\n  }\n  showSoloEndNav();\n}\n"
          js = js.replace(old_finish, new_finish, 1)

          old_setup = "function setupSolo(){\n  const params=new URLSearchParams(location.search);\n  if(params.get('auto')==='1' || params.has('origen')){\n    after(70,()=>{\n      const enter=document.getElementById('enterButton');\n      if(enter && !document.body.classList.contains('entered'))enter.click();\n    });\n  }\n  activateSoloSymbols();\n  if(state.cardFound)ghost('Hay historias que empiezan antes.','before-story',{where:'left',delay:2500,hold:6500});\n  if(state.soloComplete && state.anaComplete)ghost('Todo esto ocurrió después.','all-after',{where:'right',delay:6000,hold:6400});\n  let armed=false;\n  const checkEnd=()=>{\n    if(armed||state.soloComplete)return;\n    const d=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight);\n    if(scrollY+innerHeight>=d-180){armed=true;finishSolo();}\n  };\n  addEventListener('scroll',checkEnd,{passive:true});\n  after(1200,checkEnd);\n}\n"
          assert old_setup in js
          new_setup = "function setupSolo(){\n  after(30,()=>{\n    const enter=document.getElementById('enterButton');\n    if(enter && !document.body.classList.contains('entered'))enter.click();\n  });\n  activateSoloSymbols();\n  if(state.cardFound)ghost('Hay historias que empiezan antes.','before-story',{where:'left',delay:2500,hold:6500});\n  if(state.soloComplete && state.anaComplete)ghost('Todo esto ocurrió después.','all-after',{where:'right',delay:6000,hold:6400});\n  let armed=false;\n  const checkEnd=()=>{\n    if(armed)return;\n    const d=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight);\n    if(scrollY+innerHeight>=d-180){armed=true;finishSolo();}\n  };\n  addEventListener('scroll',checkEnd,{passive:true});\n  after(1200,checkEnd);\n}\n"
          js = js.replace(old_setup, new_setup, 1)
          js_path.write_text(js, encoding='utf-8')

          root_path = Path('index.html')
          root = root_path.read_text(encoding='utf-8')
          head_anchor = '  <title>SOLO LA TARJETA</title>\n  \n<style>'
          assert head_anchor in root
          head_insert = '  <title>SOLO LA TARJETA</title>\n  <script>document.documentElement.classList.add("ou-direct-entry");</script>\n  \n<style>'
          root = root.replace(head_anchor, head_insert, 1)

          vis_anchor = 'body:not(.entered) .dusk-passage{visibility:hidden}\n\n/* ÚNICO ESCENARIO VISUAL */'
          assert vis_anchor in root
          vis_insert = 'body:not(.entered) .dusk-passage{visibility:hidden}\nhtml.ou-direct-entry body:not(.entered){overflow:auto}\nhtml.ou-direct-entry .entry-gate{display:none!important}\nhtml.ou-direct-entry body:not(.entered) .world,\nhtml.ou-direct-entry body:not(.entered) .progress,\nhtml.ou-direct-entry body:not(.entered) header,\nhtml.ou-direct-entry body:not(.entered) main,\nhtml.ou-direct-entry body:not(.entered) .dusk-passage{visibility:visible}\n\n/* ÚNICO ESCENARIO VISUAL */'
          root = root.replace(vis_anchor, vis_insert, 1)
          root_path.write_text(root, encoding='utf-8')

          for p in Path('.').rglob('*.html'):
            text = p.read_text(encoding='utf-8')
            newer = text.replace('narrative-universe.js?v=20261010-6','narrative-universe.js?v=20261010-7')
            if newer != text:
              p.write_text(newer, encoding='utf-8')

          wf = Path('.github/workflows/patch-solo-direct-endnav.yml')
          if wf.exists():
            wf.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Open Solo directly on sky and add final navigation'
          git push
