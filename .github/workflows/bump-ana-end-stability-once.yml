name: Bump ANA end stability once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar versión del script estable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          old='oras-reading-window-r2.js?v=20261018-ana-inline-start-1'
          new='oras-reading-window-r2.js?v=20261018-ana-end-stability-2'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('No se encontró la referencia esperada al script')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/bump-ana-end-stability-once.yml
      - name: Publicar cambio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elegia-breve/index.html .github/workflows/bump-ana-end-stability-once.yml
          git commit -m "ANA: carga cierre estable sin animación duplicada"
          git push
