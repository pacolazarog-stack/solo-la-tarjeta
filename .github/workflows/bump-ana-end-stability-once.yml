name: Bump ANA end stability once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar versión del script estable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          s2,n=re.subn(r'oras-reading-window-r2\.js\?v=[^"\']+', 'oras-reading-window-r2.js?v=20261018-ana-end-stability-2', s, count=1)
          if n != 1:
              raise SystemExit('No se encontró la referencia de oras-reading-window-r2.js')
          p.write_text(s2,encoding='utf-8')
          PY
          rm -f .github/workflows/bump-ana-end-stability-once.yml
      - name: Publicar cambio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elegia-breve/index.html .github/workflows/bump-ana-end-stability-once.yml
          git commit -m "ANA: carga cierre estable sin animación duplicada"
          git push
