name: Fix mirror continue loop cache

on:
  push:
    paths:
      - '.github/workflows/fix-mirror-continue-loop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bust mirror script cache everywhere it is referenced
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          changed=[]
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              n=re.sub(r'el-espejo\.js\?v=[^"\']+', 'el-espejo.js?v=20261012-mirror-mechanical-3', s)
              if n!=s:
                  p.write_text(n,encoding='utf-8')
                  changed.append(str(p))
          print('\n'.join(changed) if changed else 'No HTML references needed a cache bump')
          PY

      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ORAS: fuerza carga de la corrección de El Espejo'
          git pull --rebase origin main
          git push origin HEAD:main
