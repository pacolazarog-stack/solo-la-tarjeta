name: Corregir voz y control de música de Ana

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sincronizar con main
        run: git pull --ff-only origin main
      - name: Corregir audio de voz y botón de música
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('elegia-breve/index.html')
          s = p.read_text(encoding='utf-8')

          old = """    .sound-toggle{\n      position:fixed;\n      left:max(14px,env(safe-area-inset-left));\n      bottom:max(14px,env(safe-area-inset-bottom));\n      z-index:35;"""
          new = """    .sound-toggle{\n      position:fixed;\n      left:max(146px,calc(env(safe-area-inset-left) + 134px));\n      bottom:max(12px,env(safe-area-inset-bottom));\n      z-index:2147482999;"""
          if old not in s:
              raise SystemExit('No se encontró el bloque CSS de sound-toggle')
          s = s.replace(old, new, 1)

          old = """          mixContext=createMediaElementSource(recording).connect(mixContext.destination);"""
          # guard against an impossible accidental spelling before the real replacement below
          if old in s:
              raise SystemExit('Apareció una variante inesperada de createMediaElementSource')

          old = """          mixContext.createMediaElementSource(recording).connect(mixContext.destination);\n          mixContext.createMediaElementSource(nameAudio).connect(mixContext.destination);\n          mixContext.createMediaElementSource(voiceMusic).connect(musicGain).connect(mixContext.destination);"""
          new = """          // La voz y el nombre permanecen en la ruta nativa del elemento <audio>.\n          // Así siguen oyéndose aunque AudioContext esté suspendido por la política de autoplay.\n          mixContext.createMediaElementSource(voiceMusic).connect(musicGain).connect(mixContext.destination);"""
          if old not in s:
              raise SystemExit('No se encontró el enrutado WebAudio de voz/nombre')
          s = s.replace(old, new, 1)

          old = """      const openVoice=()=>{\n        if(!readingReady) return;\n        if(!voiceDialog.open){\n          body.classList.add('voice-open');voiceDialog.show();\n        }\n        // A voice selection starts listening with the existing music fade and delay.\n        if(recording.paused && !voicePending) playRecording();\n      };"""
          new = """      const openVoice=()=>{\n        if(!readingReady) return;\n        if(!voiceDialog.open){\n          body.classList.add('voice-open');voiceDialog.show();\n        }\n        // Cada apertura de la voz comienza audible; después el control nativo puede silenciarla.\n        recording.muted=false;\n        if(recording.volume===0) recording.volume=1;\n        // A voice selection starts listening with the existing music fade and delay.\n        if(recording.paused && !voicePending) playRecording();\n      };"""
          if old not in s:
              raise SystemExit('No se encontró openVoice')
          s = s.replace(old, new, 1)

          old = """      voicePlay.addEventListener('click',()=>{\n        if(voicePending) cancelVoiceStart();\n        else if(recording.paused) playRecording();\n        else recording.pause();\n      });"""
          new = """      voicePlay.addEventListener('click',()=>{\n        if(voicePending){cancelVoiceStart();return;}\n        if(!recording.paused){recording.pause();return;}\n        // Tras una pausa se reanuda inmediatamente; la transición de entrada sólo se usa al comenzar.\n        if(recording.currentTime>0 && !recording.ended){\n          voiceAllowed=true;\n          recording.play().catch(()=>{\n            voiceAllowed=false;voicePlay.textContent='Activar voz';\n            voiceStatus.textContent='Pulsa Activar voz para volver a intentarlo.';\n          });\n          return;\n        }\n        playRecording();\n      });"""
          if old not in s:
              raise SystemExit('No se encontró el manejador de voicePlay')
          s = s.replace(old, new, 1)

          old = """      recording.addEventListener('play',()=>{\n        if(voicePriming) return;\n        if(!voiceAllowed){recording.pause();playRecording();return;}\n        voicePlay.textContent='Pausar';voiceStatus.textContent='';startMix();\n      });"""
          new = """      recording.addEventListener('play',()=>{\n        if(voicePriming) return;\n        // Los controles nativos de <audio> también pueden iniciar/reanudar la voz directamente.\n        voiceAllowed=true;voicePending=false;\n        voicePlay.textContent='Pausar';voiceStatus.textContent='';startMix();\n      });"""
          if old not in s:
              raise SystemExit('No se encontró el manejador play de recording')
          s = s.replace(old, new, 1)

          marker = """        // Unlock media playback in this user gesture, preserving the first word.\n        recording.muted=true;"""
          repl = """        // Unlock media playback in this user gesture, preserving the first word.\n        recording.volume=1;\n        recording.muted=true;"""
          if marker not in s:
              raise SystemExit('No se encontró el cebado de recording')
          s = s.replace(marker, repl, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elegia-breve/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Repara voz y despeja control de música"
          git push origin main
