name: Bump narrative universe cache v6
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bump-universe-cache-v6.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump narrative universe loader to v6
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed=[]
          for html in Path('.').rglob('*.html'):
              text=html.read_text(encoding='utf-8')
              new=re.sub(r'narrative-universe\.js\?v=20261010-[0-9A-Za-z._-]+', 'narrative-universe.js?v=20261010-6', text)
              if new != text:
                  html.write_text(new,encoding='utf-8')
                  changed.append(str(html))
          print('Updated:', *changed, sep='\n')
          PY
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/bump-universe-cache-v6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish narrative universe v6 cache key"
          git push
