name: Ajustar música y continuidad de lectura

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar con main
        shell: bash
        run: |
          set -euo pipefail
          sleep 18
          git fetch origin main
          git reset --hard origin/main

      - name: Aplicar continuidad audiovisual y narrativa
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION='20261012-music-portrait-flow-1'

          def replace_once(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise RuntimeError(f'No se encontró el bloque esperado: {label}')
              return text.replace(old,new,1)

          # 1) ANA KLAUDYA: la música se considera activa por defecto y se intenta
          #    arrancar al cargar. Si el navegador bloquea autoplay, el primer gesto
          #    del lector desbloquea el audio sin invertir la preferencia.
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<audio id="voiceMusic" preload="auto" loop src="ana-klaudya.m4a"></audio>',
                      '<audio id="voiceMusic" preload="auto" autoplay loop src="ana-klaudya.m4a"></audio>')

          old="""      const beginPrelude=(nameReady)=>{\n"""
          new="""      const unlockDefaultMusic=()=>{\n        if(musicEnabled.checked && voiceMusic.paused)startSound();\n      };\n      document.addEventListener('pointerdown',unlockDefaultMusic,{capture:true});\n      document.addEventListener('keydown',unlockDefaultMusic,{capture:true});\n\n      const beginPrelude=(nameReady)=>{\n"""
          s=replace_once(s,old,new,'desbloqueo de música por defecto')

          old="""          anaNavigation.hidden=true;\n          body.classList.remove('ana-navigation-ready');\n          clearTimeout(portraitRevealTimer);\n"""
          new="""          anaNavigation.hidden=true;\n          body.classList.remove('ana-navigation-ready');\n          const finalJourneyNav=document.getElementById('journeyNav');\n          if(finalJourneyNav)finalJourneyNav.hidden=true;\n          clearTimeout(portraitRevealTimer);\n"""
          s=replace_once(s,old,new,'ocultar navegación al mostrar fotografía final')

          old="""      const openCeniciento=()=>openPoem('ceniciento',false,false,false,'question');\n      document.getElementById('cenicientoLink').addEventListener('click',openCeniciento);\n"""
          new="""      const openCeniciento=()=>openPoem('ceniciento',false,false,false,'question');\n      document.getElementById('cenicientoLink').addEventListener('click',openCeniciento);\n      const showPortraitFromJourney=()=>{\n        cancelPoemTransition();cancelAnaPrelude();\n        if(!cenicientoFrame.hidden)closeCeniciento();\n        try{window.history.replaceState(null,'',window.location.pathname+window.location.search);}catch(_){}\n        showAnaText();\n        revealPortrait();\n      };\n      window.addEventListener('oras:ana-portrait',showPortraitFromJourney);\n"""
          s=replace_once(s,old,new,'puerta a fotografía final')

          old="""      syncSoundToggle();\n      renderWorld();\n      syncPoemRoute();\n"""
          new="""      startSound();\n      syncSoundToggle();\n      renderWorld();\n      syncPoemRoute();\n"""
          s=replace_once(s,old,new,'arranque musical inicial')
          p.write_text(s,encoding='utf-8')

          # 2) Universo: al final de SOLO LA TARJETA aparece la continuidad a la
          #    primera pieza de ANA aún no leída; con 3/8, será EN TUS LABIOS.
          #    En FLORES (8/8), Adelante conduce a la fotografía final y al ?.
          p=Path('narrative-universe.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const VERSION='[^']+';",f"const VERSION='{VERSION}';",s,count=1)

          old="""function firstUnreadAnaTarget(){\n  const parts=readUniverseState().anaParts;\n  if(!parts||typeof parts!=='object')return null;\n  return ANA_FORWARD_TARGETS.find(target=>target.route!=='epilogo'&&parts[target.state]===false)||null;\n}\n"""
          new="""function firstUnreadAnaTarget(){\n  const parts=readUniverseState().anaParts;\n  if(!parts||typeof parts!=='object')return null;\n  return ANA_FORWARD_TARGETS.find(target=>target.route!=='epilogo'&&parts[target.state]===false)||null;\n}\nfunction firstUnreadAnaTargetIncludingEpilogue(){\n  const parts=readUniverseState().anaParts;\n  if(!parts||typeof parts!=='object')return null;\n  return ANA_FORWARD_TARGETS.find(target=>parts[target.state]===false)||null;\n}\n"""
          s=replace_once(s,old,new,'lector de siguiente pieza de Ana')

          old="""    }else{\n      button.title='SOLO LA TARJETA';\n      button.setAttribute('aria-label','Continuar a SOLO LA TARJETA');\n      button.dataset.ouSoloForward='true';\n      delete button.dataset.ouAnaUnreadForward;\n    }\n  }else if(button.dataset.ouSoloForward==='true'||button.dataset.ouAnaUnreadForward){\n    button.textContent='Siguiente';\n    button.title='';\n    delete button.dataset.ouSoloForward;\n    delete button.dataset.ouAnaUnreadForward;\n  }\n"""
          new="""    }else{\n      button.title='Fotografía final de Ana Klaudya';\n      button.setAttribute('aria-label','Continuar a la fotografía final de Ana Klaudya');\n      button.dataset.ouPortraitForward='true';\n      delete button.dataset.ouSoloForward;\n      delete button.dataset.ouAnaUnreadForward;\n    }\n  }else if(button.dataset.ouSoloForward==='true'||button.dataset.ouAnaUnreadForward||button.dataset.ouPortraitForward==='true'){\n    button.textContent='Siguiente';\n    button.title='';\n    delete button.dataset.ouSoloForward;\n    delete button.dataset.ouAnaUnreadForward;\n    delete button.dataset.ouPortraitForward;\n  }\n"""
          s=replace_once(s,old,new,'Adelante desde Flores hacia retrato final')

          old="""function markCardFound(){try{const state=readUniverseState();state.cardFound=true;localStorage.setItem(STORAGE,JSON.stringify(state))}catch(_){}}\n"""
          new="""function markCardFound(){try{const state=readUniverseState();state.cardFound=true;localStorage.setItem(STORAGE,JSON.stringify(state))}catch(_){}}\n\nlet soloAnaForwardButton=null;\nfunction ensureSoloAnaForwardButton(){\n  if(!soloPage||!document.body)return null;\n  if(soloAnaForwardButton?.isConnected)return soloAnaForwardButton;\n  const button=document.createElement('button');\n  button.id='ou-solo-ana-forward';\n  button.type='button';\n  button.setAttribute('data-oras-screen-transition','true');\n  button.setAttribute('data-oras-screen-navigation','true');\n  button.hidden=true;\n  button.style.cssText='position:fixed;left:50%;bottom:max(72px,calc(env(safe-area-inset-bottom,0px) + 68px));transform:translateX(-50%);z-index:190;min-height:46px;padding:11px 18px;border:1px solid rgba(255,244,220,.48);border-radius:999px;background:rgba(13,16,25,.72);color:#fff8eb;font:500 13px/1.2 system-ui,sans-serif;letter-spacing:.03em;box-shadow:0 8px 28px rgba(0,0,0,.28);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);cursor:pointer;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis';\n  button.addEventListener('click',()=>{\n    const target=firstUnreadAnaTargetIncludingEpilogue();\n    if(!target)return;\n    location.href=ROOT+'elegia-breve/#'+target.route;\n  });\n  document.body.appendChild(button);\n  soloAnaForwardButton=button;\n  return button;\n}\nfunction syncSoloAnaForward(){\n  if(!soloPage||!document.body)return;\n  const button=ensureSoloAnaForwardButton();\n  const state=readUniverseState();\n  const target=state.soloComplete===true?firstUnreadAnaTargetIncludingEpilogue():null;\n  const show=!!target;\n  button.hidden=!show;\n  document.documentElement.classList.toggle('ou-solo-forward-ana',show);\n  if(!show)return;\n  button.textContent='Continuar · '+target.label;\n  button.title=target.label;\n  button.setAttribute('aria-label','Continuar a '+target.label);\n}\nif(soloPage){\n  queueMicrotask(syncSoloAnaForward);\n  addEventListener('pageshow',syncSoloAnaForward);\n  addEventListener('scroll',syncSoloAnaForward,{passive:true});\n  setInterval(syncSoloAnaForward,750);\n}\n"""
          s=replace_once(s,old,new,'botón final de Solo hacia Ana')

          old="""  if(hash==='#epilogo'){\n    event.preventDefault();\n    event.stopImmediatePropagation();\n    const target=firstUnreadAnaTarget();\n    runWithScreenTransition(()=>{\n      if(target&&openAnaTarget(target)){\n        syncRouteChrome();\n        return;\n      }\n      goToSolo('tarjeta');\n    },{expectNavigation:!target});\n    return;\n  }\n"""
          new="""  if(hash==='#epilogo'){\n    event.preventDefault();\n    event.stopImmediatePropagation();\n    const target=firstUnreadAnaTarget();\n    runWithScreenTransition(()=>{\n      if(target&&openAnaTarget(target)){\n        syncRouteChrome();\n        return;\n      }\n      window.dispatchEvent(new CustomEvent('oras:ana-portrait'));\n    },{expectNavigation:false});\n    return;\n  }\n"""
          s=replace_once(s,old,new,'salida del epílogo al retrato')

          old="""html.ou-solo-document .work-subtitle{display:none!important}\n"""
          new="""html.ou-solo-document .work-subtitle{display:none!important}\nhtml.ou-solo-forward-ana .ou-solo-endnav{display:none!important}\n"""
          s=replace_once(s,old,new,'ocultar continuidad antigua de Solo')
          p.write_text(s,encoding='utf-8')

          # 3) Forzar el nuevo cache-buster en todos los HTML.
          for html in Path('.').rglob('*.html'):
              t=html.read_text(encoding='utf-8')
              u=re.sub(r'narrative-universe\\.js\\?v=[^"\\'<>\\s]+',f'narrative-universe.js?v={VERSION}',t)
              if u!=t: html.write_text(u,encoding='utf-8')

          # 4) Actualizar las verificaciones de Pages para esta versión.
          p=Path('.github/workflows/pages.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('20261012-screen-fades-2',VERSION)
          if "grep -Fq 'ou-solo-ana-forward' narrative-universe.js" not in s:
              marker="          grep -Fq 'ORASScreenTransition' oras-screen-transition.js\n"
              insert=("          grep -Fq 'ORASScreenTransition' oras-screen-transition.js\n"
                      "          grep -Fq 'ou-solo-ana-forward' narrative-universe.js\n"
                      "          grep -Fq 'oras:ana-portrait' narrative-universe.js\n"
                      "          grep -Fq 'autoplay loop src=\"ana-klaudya.m4a\"' elegia-breve/index.html\n")
              if marker in s:s=s.replace(marker,insert,1)
          p.write_text(s,encoding='utf-8')

          # El workflow de caché ya usa VERSION; asegurar que no quede el valor anterior.
          p=Path('.github/workflows/bump-ana-universe-cache.yml')
          s=p.read_text(encoding='utf-8').replace('20261012-screen-fades-2',VERSION)
          p.write_text(s,encoding='utf-8')
          PY

          node --check narrative-universe.js
          grep -Fq "const VERSION='20261012-music-portrait-flow-1'" narrative-universe.js
          grep -Fq 'ou-solo-ana-forward' narrative-universe.js
          grep -Fq 'oras:ana-portrait' narrative-universe.js
          grep -Fq 'autoplay loop src="ana-klaudya.m4a"' elegia-breve/index.html
          grep -Fq "window.addEventListener('oras:ana-portrait',showPortraitFromJourney)" elegia-breve/index.html

      - name: Commit y retirar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-music-reading-flow-20261012.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Inicia música y corrige la continuidad Solo-Ana-Ceniciento"
          git pull --rebase origin main
          git push origin HEAD:main
