# trigger r7
name: ANA final watchdog r7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ana-final-watchdog-r7.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar watchdog independiente del EOF
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')

          # Sustituye el umbral demasiado estrecho del parche anterior.
          s=s.replace("if(remaining<=.55){finalizeBeforeEdgeEOF();return;}","if(remaining<=1.25){finalizeBeforeEdgeEOF();return;}")
          s=s.replace("Math.max(0,(remaining-.42)*1000)","Math.max(0,(remaining-1.10)*1000)")
          s=s.replace("duration-recording.currentTime<=.55", "duration-recording.currentTime<=1.25")

          marker="""      recording.addEventListener('timeupdate',()=>{\n        if(body.dataset.anaFinalDone==='1')return;\n        const duration=recording.duration;\n        if(Number.isFinite(duration)&&duration>0&&duration-recording.currentTime<=1.25)finalizeBeforeEdgeEOF();\n      });"""

          watchdog="""
      // Watchdog independiente de los eventos multimedia de Edge.
      // Si el reloj del audio deja de avanzar cerca del final, la transición final
      // se ejecuta igualmente y nunca queda la pantalla detenida en 1:40 / 1:40.
      let anaLastMediaTime=0;
      let anaLastAdvanceAt=performance.now();
      const resetAnaFinalWatch=()=>{
        anaLastMediaTime=recording.currentTime||0;
        anaLastAdvanceAt=performance.now();
      };
      recording.addEventListener('play',resetAnaFinalWatch);
      recording.addEventListener('seeked',resetAnaFinalWatch);
      setInterval(()=>{
        if(body.dataset.anaFinalDone==='1'||recording.paused||recording.seeking)return;
        const duration=recording.duration;
        const now=performance.now();
        const current=recording.currentTime||0;
        if(current>anaLastMediaTime+.02){
          anaLastMediaTime=current;
          anaLastAdvanceAt=now;
        }
        if(!Number.isFinite(duration)||duration<=0)return;
        const remaining=duration-current;
        if(remaining<=1.25 || (remaining<=4 && now-anaLastAdvanceAt>=700)){
          finalizeBeforeEdgeEOF();
        }
      },100);
"""
          if 'Watchdog independiente de los eventos multimedia de Edge.' not in s:
              if marker not in s:
                  raise SystemExit('No se encontró el punto de inserción del watchdog')
              s=s.replace(marker,marker+watchdog,1)

          # En la transición final cerramos explícitamente el diálogo y liberamos el audio.
          old="""        if(voiceDialog){voiceDialog.style.display='none';voiceDialog.setAttribute('aria-hidden','true');}"""
          new="""        if(voiceDialog){\n          try{if(voiceDialog.open)voiceDialog.close();}catch(_){}\n          voiceDialog.style.display='none';\n          voiceDialog.setAttribute('aria-hidden','true');\n        }\n        try{recording.pause();recording.removeAttribute('controls');}catch(_){}"""
          if old in s:
              s=s.replace(old,new,1)

          s=s.replace('20261018-photo-question-final-1','20261018-photo-question-final-3')
          s=s.replace('20261018-photo-question-final-2','20261018-photo-question-final-3')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'Watchdog independiente de los eventos multimedia de Edge' elegia-breve/index.html
          grep -q 'remaining<=1.25' elegia-breve/index.html
          grep -q 'recording.removeAttribute' elegia-breve/index.html
      - name: Guardar y publicar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elegia-breve/index.html
          git commit -m 'ANA: watchdog final evita bloqueo de Edge'
          git push
          sleep 3
          gh workflow run pages.yml --ref main
