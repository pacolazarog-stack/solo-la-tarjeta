name: Restore Ceniciento audio
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore current narration and refine mobile portrait UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Keep current Ceniciento narration.
          p = Path('ceniciento/index.html')
          s = p.read_text(encoding='utf-8')
          old = "MASTER='CENICIENTO_completo.m4a?v=20261010'"
          new = "MASTER='ceniciento-voz-completa.mp3?v=20261010-audio-restored'"
          if old not in s and new not in s:
              raise RuntimeError('No se encontró la referencia de audio esperada en ceniciento/index.html')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # Shared universe controls: card and reading counter on the left in portrait.
          n = Path('narrative-universe.js')
          u = n.read_text(encoding='utf-8')
          u = u.replace("const VERSION='20261010-29';", "const VERSION='20261011-30';")
          marker = "  @media(hover:none) and (pointer:coarse){"
          portrait = r'''  @media(max-width:700px) and (orientation:portrait){
    .ou-card{left:max(10px,env(safe-area-inset-left))!important;right:auto!important;bottom:calc(env(safe-area-inset-bottom,0px) + 12px)!important;width:94px!important;height:58px!important;transform:rotate(-4deg)}
    .ou-card::before{left:13px!important;top:12px!important;width:23px!important;height:17px!important}.ou-card::after{left:13px!important;right:13px!important;bottom:11px!important}
    .ou-reading-checklist{left:max(10px,env(safe-area-inset-left))!important;right:auto!important;bottom:calc(env(safe-area-inset-bottom,0px) + 82px)!important}
    .ou-reading-checklist summary{margin-left:0!important;padding:5px 8px!important;border-color:rgba(255,255,255,.20)!important;background:rgba(12,12,12,.38)!important;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
    .ou-reading-checklist ul{left:0!important;right:auto!important}
  }
'''
          if portrait not in u:
              if marker not in u:
                  raise RuntimeError('No se encontró el anclaje CSS de narrative-universe.js')
              u = u.replace(marker, portrait + marker, 1)
          n.write_text(u, encoding='utf-8')

          # ANA KLAUDYA mobile portrait: transparent linear controls on the right,
          # leaving a dedicated left lane for the card and counter.
          q = Path('elegia-breve/index.html')
          t = q.read_text(encoding='utf-8')
          t = t.replace('20261010-ceniciento-score40-v2', '20261010-ceniciento-score40-v3-audio')
          nav_anchor = '.journey-nav button[hidden]{display:none}\n'
          nav_portrait = r'''@media(max-width:700px) and (orientation:portrait){
  .journey-nav{left:auto;right:max(10px,env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:none;width:calc(100% - 132px);max-width:360px;height:48px;padding:0;border:0;border-top:1px solid rgba(255,250,241,.46);border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  .journey-nav button{min-height:48px;padding:7px 5px;border:0;border-radius:0;background:transparent;box-shadow:none;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.9)}
  .journey-nav button+button{border-left:1px solid rgba(255,250,241,.26)}
}
'''
          if nav_portrait not in t:
              if nav_anchor not in t:
                  raise RuntimeError('No se encontró el anclaje de journey-nav en elegia-breve/index.html')
              t = t.replace(nav_anchor, nav_anchor + nav_portrait, 1)
          t = t.replace('narrative-universe.js?v=20261010-29', 'narrative-universe.js?v=20261011-30')
          q.write_text(t, encoding='utf-8')

          # Bump the shared module cache in every HTML page that uses it.
          for html in Path('.').rglob('*.html'):
              if html == q:
                  continue
              a = html.read_text(encoding='utf-8')
              b = a.replace('narrative-universe.js?v=20261010-29', 'narrative-universe.js?v=20261011-30')
              if b != a:
                  html.write_text(b, encoding='utf-8')
          PY
      - name: Verify reading progress
        run: node check-reading-progress.cjs
      - name: Verify mobile navigation
        run: node elegia-breve/check-mobile-navigation.cjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add narrative-universe.js ceniciento/index.html elegia-breve/index.html '*.html' '**/*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine mobile portrait controls"
          git push
