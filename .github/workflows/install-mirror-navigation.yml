name: Install mirror navigation

on:
  push:
    paths:
      - .github/workflows/install-mirror-navigation.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install mirror navigation on every mirror host
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          tag='<script data-oras-mirror-nav="v2" src="/solo-la-tarjeta/ceniciento/el-espejo-nav.js?v=20261012-mirror-nav-2"></script>'
          changed=[]
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              # Only pages capable of hosting EL ESPEJO.
              if 'data-oras-mirror' not in s and 'data-oras-universe' not in s:
                  continue
              original=s
              if 'data-oras-mirror-nav=' in s:
                  s=re.sub(r'<script data-oras-mirror-nav="[^"]+"[^>]*></script>',tag,s)
              else:
                  # Prefer placing after EL ESPEJO if present; otherwise after narrative-universe,
                  # which creates #mirror synchronously before this script executes.
                  m=re.search(r'(<script data-oras-mirror="true"[^>]*></script>)',s)
                  if not m:
                      m=re.search(r'(<script data-oras-universe="[^"]+"[^>]*></script>)',s)
                  if m:
                      s=s[:m.end()]+'\n'+tag+s[m.end():]
              if s!=original:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print('\n'.join(changed))
          if not changed:
              raise SystemExit('No mirror host pages were updated')
          PY
          grep -Fq 'data-oras-mirror-nav="v2"' index.html
          grep -Fq 'data-oras-mirror-nav="v2"' elegia-breve/index.html
          grep -Fq 'data-oras-mirror-nav="v2"' ceniciento/index.html

      - name: Commit mirror navigation hosts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ORAS: muestra Atrás y Adelante en todos los accesos al Espejo'
          git pull --rebase origin main
          git push origin HEAD:main
# trigger-v2
