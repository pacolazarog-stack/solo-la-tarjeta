name: Aplicar canon de navegación y Espejo ORAS

on:
  push:
    paths:
      - '.github/workflows/apply-oras-canon-navigation-mirror.yml'
      - '.github/scripts/apply_oras_canon_navigation_mirror.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar reglas canónicas
        run: python3 .github/scripts/apply_oras_canon_navigation_mirror.py

      - name: Comprobar sintaxis JavaScript
        run: |
          node --check oras-master-index-r1.js
          node --check oras-reading-window-r2.js
          node --check ceniciento/el-espejo.js
          node --check inventario-del-aire/oras-general-progress-r1.js

      - name: Comprobar reglas canónicas
        run: |
          grep -q "mirrorCrossed" oras-master-index-r1.js
          grep -q "locked:!mirrorCrossed" oras-master-index-r1.js
          grep -q "realityDeformed:true" ceniciento/el-espejo.js
          grep -q "oras-mirror-deformation-r1" ceniciento/el-espejo.js
          grep -q "bloqueado=expansion" inventario-del-aire/oras-general-progress-r1.js
          grep -q "Índice ORAS" oras-reading-window-r2.js

      - name: Publicar cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Impone el índice canónico y el umbral deformante de ORAS"
          git push
