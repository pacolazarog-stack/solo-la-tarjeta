name: Restaurar portada canónica ORAS

on:
  push:
    paths:
      - '.github/workflows/restore-oras-canonical-cover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Restaurar portada aportada por el autor y renovar cachés
        shell: python
        run: |
          from pathlib import Path
          import re

          cover = Path('assets/oras-portada-final.jpg')
          if not cover.exists() or cover.stat().st_size < 100000:
              raise RuntimeError('No está disponible la portada canónica assets/oras-portada-final.jpg')

          master = Path('oras-master-index-r1.js')
          text = master.read_text(encoding='utf-8')
          text = text.replace("const VERSION='20261014-master-index-7';", "const VERSION='20261014-master-index-8';")
          text = text.replace(
              '.oras-master-cover-img{display:none!important}',
              '.oras-master-cover-img{display:block;width:100%;height:100%;object-fit:cover}'
          )
          new_cover = '''cover.innerHTML=`<div class="oras-master-cover-frame"><img class="oras-master-cover-img" src="${ROOT}/assets/oras-portada-final.jpg?v=${VERSION}" alt="ORAS · El archivo profundo"><button class="oras-master-button" type="button" aria-label="Abrir índice general de lectura"><span>Abrir índice general de lectura</span></button></div>`;'''
          text, n = re.subn(r"cover\.innerHTML=`.*?`;\ndocument\.body\.appendChild\(cover\);", new_cover + "\ndocument.body.appendChild(cover);", text, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError('No se pudo sustituir la portada del índice maestro')
          master.write_text(text, encoding='utf-8')

          rw = Path('oras-reading-window-r2.js')
          text = rw.read_text(encoding='utf-8')
          text = text.replace("const VERSION='20261014-reading-window-3';", "const VERSION='20261014-reading-window-4';")
          text = text.replace('oras-master-index-r1.js?v=20261014-master-index-7', 'oras-master-index-r1.js?v=20261014-master-index-8')
          rw.write_text(text, encoding='utf-8')

          idx = Path('index.html')
          text = idx.read_text(encoding='utf-8')
          text = text.replace('oras-reading-window-r2.js?v=20261014-reading-window-3', 'oras-reading-window-r2.js?v=20261014-reading-window-4')
          idx.write_text(text, encoding='utf-8')

          pages = Path('.github/workflows/pages.yml')
          text = pages.read_text(encoding='utf-8')
          text = text.replace('oras-reading-window-r2.js?v=20261014-reading-window-3', 'oras-reading-window-r2.js?v=20261014-reading-window-4')
          text = text.replace('oras-master-index-r1.js?v=20261014-master-index-7', 'oras-master-index-r1.js?v=20261014-master-index-8')
          text = text.replace("const VERSION='20261014-master-index-7'", "const VERSION='20261014-master-index-8'")
          text = text.replace("grep -Fq 'oras-master-cover-fallback' oras-master-index-r1.js", "grep -Fq 'assets/oras-portada-final.jpg' oras-master-index-r1.js")
          pages.write_text(text, encoding='utf-8')

      - name: Validar JavaScript y portada
        run: |
          set -euo pipefail
          node --check oras-master-index-r1.js
          node --check oras-reading-window-r2.js
          grep -Fq 'assets/oras-portada-final.jpg' oras-master-index-r1.js
          test -s assets/oras-portada-final.jpg

      - name: Publicar restauración
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oras-master-index-r1.js oras-reading-window-r2.js index.html .github/workflows/pages.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Usa la portada canónica ORAS · El archivo profundo"
          git push origin main
