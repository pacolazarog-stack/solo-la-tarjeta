name: Remove redundant journey index control

on:
  push:
    paths:
      - '.github/workflows/remove-journey-index-control.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove index control from Ana navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          variants=[
              '<button id="journeyIndexOpen" type="button" aria-haspopup="dialog" hidden>Índice</button>\n',
              '<button id="journeyIndexOpen" type="button" aria-haspopup="dialog">Índice</button>\n',
              '<button id="journeyIndexOpen" type="button" aria-haspopup="dialog" hidden>Índice</button>',
              '<button id="journeyIndexOpen" type="button" aria-haspopup="dialog">Índice</button>'
          ]
          removed=False
          for old in variants:
              if old in s:
                  s=s.replace(old,'',1)
                  removed=True
                  break
          handler="""      document.getElementById('journeyIndexOpen').addEventListener('click',()=>{\n        anaNavigation.hidden=false;journeyIndex.showModal();\n        document.getElementById('journeyIndexClose').focus();\n      });\n"""
          if handler in s:
              s=s.replace(handler,'',1)
          elif "journeyIndexOpen').addEventListener" in s:
              raise RuntimeError('Se encontró un manejador de Índice con formato inesperado')
          if not removed and 'id="journeyIndexOpen"' in s:
              raise RuntimeError('No se pudo retirar el control Índice')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elegia-breve/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ORAS: elimina control Índice redundante'
          git pull --rebase origin main
          git push origin HEAD:main
