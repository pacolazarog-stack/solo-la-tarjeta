name: Remove redundant journey index button

on:
  push:
    paths:
      - '.github/workflows/remove-journey-index-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hide redundant index button
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          old='<button id="journeyIndexOpen" type="button" aria-haspopup="dialog">Índice</button>'
          new='<button id="journeyIndexOpen" type="button" aria-haspopup="dialog" hidden>Índice</button>'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise RuntimeError('No se encontró el botón Índice esperado')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elegia-breve/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ORAS: elimina botón Índice redundante'
          git pull --rebase origin main
          git push origin HEAD:main
