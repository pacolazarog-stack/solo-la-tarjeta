# Publicación r5 verificada: volumen 80, música visible y navegación ORAS.
name: Fix estrella r5 final

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-star-r5-final.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fijar estrella en 80 por ciento y controles visibles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('estrella/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<output id="musicValue">30 %</output>','<output id="musicValue">80 %</output>')
          s=s.replace('id="musicLevel" type="range" min="0" max="80" value="30"','id="musicLevel" type="range" min="0" max="100" value="80"')
          s=s.replace('<button id="musicStart" type="button" hidden>Activar música</button>','<button id="musicStart" type="button">Reproducir música</button>')
          if 'star-r5-final-marker' not in s:
              s=s.replace('</body>','<!-- star-r5-final-marker -->\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq '<output id="musicValue">80 %</output>' estrella/index.html
          grep -Fq 'id="musicLevel" type="range" min="0" max="100" value="80"' estrella/index.html
          grep -Fq '<button id="musicStart" type="button">Reproducir música</button>' estrella/index.html
          grep -Fq 'orasStarInlineNav' estrella/index.html
          grep -Fq 'orasStarInlineAudio' estrella/index.html
          grep -Fq 'star-r5-final-marker' estrella/index.html
      - name: Guardar corrección
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add estrella/index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios: estrella ya corregida.'
            exit 0
          fi
          git commit -m 'ANA: fija estrella en 80 y muestra controles'
          git push origin HEAD:main
