name: Install ORAS reading index R3

on:
  push:
    paths:
      - '.github/workflows/install-reading-index-r3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install reading index on all reading pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          version='20261012-reading-window-r3-index'
          targets=[
            Path('index.html'),
            Path('elegia-breve/index.html'),
            Path('estrella/index.html'),
            Path('ojos/index.html'),
            Path('sonrisa/index.html'),
            Path('cabello/index.html'),
            Path('piel/index.html'),
            Path('interludio/index.html'),
            Path('epilogo/index.html'),
            Path('ceniciento/index.html'),
          ]
          tag=f'<script data-oras-reading-window="r2" src="/solo-la-tarjeta/oras-reading-window-r2.js?v={version}"></script>'
          changed=[]
          for p in targets:
            if not p.exists():
              continue
            s=p.read_text(encoding='utf-8')
            s=re.sub(r'\n?<script data-oras-reading-window="r2"[^>]*></script>', '', s)
            if '</body>' not in s:
              raise RuntimeError(f'No se encontró </body> en {p}')
            s=s.replace('</body>',tag+'\n</body>',1)
            p.write_text(s,encoding='utf-8')
            changed.append(p.as_posix())
          print('Índice instalado en:', ', '.join(changed))
          PY

      - name: Commit reading index installation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html elegia-breve/index.html estrella/index.html ojos/index.html sonrisa/index.html cabello/index.html piel/index.html interludio/index.html epilogo/index.html ceniciento/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ORAS: activa índice navegable de lecturas'
          git pull --rebase origin main
          git push origin HEAD:main
