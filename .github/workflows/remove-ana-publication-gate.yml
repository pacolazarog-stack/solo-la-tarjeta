name: Remove ANA publication gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-ana-publication-gate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove blocking ANA gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('  document.documentElement.classList.add("publication-pending");\n','')
          s=s.replace('    .publication-pending body{visibility:hidden}\n','')
          s=s.replace('    .publication-pending::before{content:"Preparando la lectura…";position:fixed;inset:0;display:grid;place-items:center;background:#eef1e9;color:#201d19;z-index:2147483647;font:18px/1.5 Georgia,serif}\n','')
          # Defensive cleanup in case a stale class survives from old markup/cache fragments.
          guard='''\n  <script id="oras-ana-release-gate">\n    document.documentElement.classList.remove('publication-pending');\n    addEventListener('pageshow',()=>document.documentElement.classList.remove('publication-pending'));\n  </script>\n'''
          if 'oras-ana-release-gate' not in s:
              s=s.replace('</head>',guard+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          ! grep -Fq 'document.documentElement.classList.add("publication-pending")' elegia-breve/index.html
          ! grep -Fq '.publication-pending body{visibility:hidden}' elegia-breve/index.html
          grep -Fq 'oras-ana-release-gate' elegia-breve/index.html
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elegia-breve/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ANA KLAUDYA: elimina la pantalla de preparación bloqueante"
          git push
