name: Fix Ceniciento wait for Seguir
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ceniciento-wait-for-seguir.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force current hard gate and remove self
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ceniciento/index.html')
          s=p.read_text(encoding='utf-8')
          old='/solo-la-tarjeta/ceniciento/el-espejo-nav.js?v=20261012-mirror-nav-2'
          new='/solo-la-tarjeta/ceniciento/el-espejo-nav.js?v=20261014-ceniciento-wait-seguir-1'
          if old in s:
              s=s.replace(old,new)
          else:
              import re
              s=re.sub(r'/solo-la-tarjeta/ceniciento/el-espejo-nav\.js\?v=[^"\']+',new,s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/fix-ceniciento-wait-for-seguir.yml
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ceniciento/index.html .github/workflows/fix-ceniciento-wait-for-seguir.yml
          git commit -m "Ceniciento espera a pulsar Seguir antes del Espejo"
          git push
