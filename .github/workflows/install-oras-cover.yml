name: Instala portada ORAS

on:
  push:
    paths:
      - '.oras-cover-install'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar portada definitiva
        run: |
          mkdir -p assets
          curl -fL --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/170d4aac-9f70-4b79-a87e-761f62a51650.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjJiMjEzZGIyODI2NjYwZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjAwNjM2M30.X2UAxkvPFlHC4K-74aCrZfmm9C-AmG4usQDSUIJAnWo' -o assets/oras-portada-final.jpg
          test -s assets/oras-portada-final.jpg
          rm -f .oras-cover-install
      - name: Publicar portada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Instala la portada final de ORAS' || exit 0
          git push
