name: Canonical poem defaults
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Esperar las normalizaciones previas
        shell: bash
        run: |
          sleep 25
          git pull --rebase origin main
      - name: Fijar música y lectura pausada por defecto
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          simple_poems = [
              Path('ojos/index.html'),
              Path('sonrisa/index.html'),
              Path('cabello/index.html'),
              Path('piel/index.html'),
          ]

          for path in simple_poems:
              s = path.read_text(encoding='utf-8')

              # Sin destello de "música apagada": la música es el estado de entrada.
              s = s.replace(
                  '<button id="musicStart" type="button">Activar música</button>',
                  '<button id="musicStart" type="button" hidden>Activar música</button>',
              )
              old_music = "if(inheritedMusic)sendMusic('ready');"
              new_music = """if(inheritedMusic){\n musicEnabled.checked=true;\n sendMusic('enabled');\n sendMusic('start');\n sendMusic('ready');\n}"""
              if old_music in s:
                  s = s.replace(old_music, new_music, 1)

              # La vista inicial es lectura acompasada: versos ocultos salvo el que toca.
              s = re.sub(r'class="line(?! hidden-line)([^\"]*)"', r'class="line hidden-line\1"', s)
              s = s.replace(
                  '<button class="primary" id="paced" type="button">Leer con pausas</button>',
                  '<button class="primary" id="paced" type="button">Pausar</button>',
                  1,
              )
              s = s.replace(
                  '<p class="status" id="status" role="status">A tu ritmo.</p>',
                  '<p class="status" id="status" role="status">Deja respirar cada verso.</p>',
                  1,
              )
              s = s.replace("let timer=null,index=0,mode='full';", "let timer=null,index=0,mode='playing';", 1)

              init_marker = '/* ORAS default: música + lectura pausada */'
              if init_marker not in s:
                  needle = "full.addEventListener('click',()=>{clear();mode='full';lines.forEach(l=>l.classList.remove('hidden-line'));paced.textContent='Leer con pausas';status.textContent='A tu ritmo.'});"
                  if needle not in s:
                      raise SystemExit(f'No se encontró el cierre de controles en {path}')
                  s = s.replace(
                      needle,
                      needle + "\n" + init_marker + "\nreveal();",
                      1,
                  )

              path.write_text(s, encoding='utf-8')

          # SIGUIENDO UNA TARJETA ya entra acompasado; se añade la alternativa completa.
          path = Path('estrella/index.html')
          s = path.read_text(encoding='utf-8')
          s = s.replace(
              '<button id="musicStart" type="button">Activar música</button>',
              '<button id="musicStart" type="button" hidden>Activar música</button>',
          )
          old_music = "if(inheritedMusic)sendMusic('ready');"
          new_music = """if(inheritedMusic){\n musicEnabled.checked=true;\n sendMusic('enabled');\n sendMusic('start');\n sendMusic('ready');\n}"""
          if old_music in s:
              s = s.replace(old_music, new_music, 1)

          if 'id="full"' not in s:
              s = s.replace(
                  '<button class="primary" id="paced" type="button" disabled>Esperando a la luna</button>',
                  '<button class="primary" id="paced" type="button" disabled>Esperando a la luna</button>\n<button id="full" type="button" disabled>Poema completo</button>',
                  1,
              )

          s = s.replace(
              "const paced=document.getElementById('paced'),status=document.getElementById('status');",
              "const paced=document.getElementById('paced'),full=document.getElementById('full'),status=document.getElementById('status');",
              1,
          )
          s = s.replace(
              "paced.disabled=true;paced.textContent='Esperando a la luna';status.textContent='La luna se está formando.';",
              "paced.disabled=true;full.disabled=true;paced.textContent='Esperando a la luna';status.textContent='La luna se está formando.';",
              1,
          )

          old_complete = """function completeMoon(){\n if(moonReady || mode!=='waiting')return;\n moonReady=true;poem.hidden=false;paced.disabled=false;\n mode='playing';paced.textContent='Pausar';status.textContent='Deja respirar cada frase.';reveal();\n}"""
          new_complete = """function startPaced(){\n clear();index=0;phrases.forEach(phrase=>{phrase.classList.add('hidden-phrase');phrase.setAttribute('aria-hidden','true')});\n mode='playing';paced.textContent='Pausar';status.textContent='Deja respirar cada frase.';reveal();\n}\nfunction completeMoon(){\n if(moonReady || mode!=='waiting')return;\n moonReady=true;poem.hidden=false;paced.disabled=false;full.disabled=false;\n startPaced();\n}"""
          if old_complete in s:
              s = s.replace(old_complete, new_complete, 1)

          old_paced = """paced.addEventListener('click',()=>{\n if(!moonReady)return;\n if(mode==='playing'){clear();mode='paused';paced.textContent='Continuar';status.textContent='Una pausa, a tu elección.';return}\n if(mode==='paused'){mode='playing';paced.textContent='Pausar';status.textContent='Deja respirar cada frase.';reveal();return}\n beginCelestialJourney(150);\n});"""
          new_paced = """paced.addEventListener('click',()=>{\n if(!moonReady)return;\n if(mode==='playing'){clear();mode='paused';paced.textContent='Continuar';status.textContent='Una pausa, a tu elección.';return}\n if(mode==='paused'){mode='playing';paced.textContent='Pausar';status.textContent='Deja respirar cada frase.';reveal();return}\n startPaced();\n});\nfull.addEventListener('click',()=>{\n if(!moonReady)return;\n clear();mode='full';phrases.forEach(phrase=>{phrase.classList.remove('hidden-phrase');phrase.removeAttribute('aria-hidden')});\n paced.textContent='Leer con pausas';status.textContent='A tu ritmo.';\n});"""
          if old_paced in s:
              s = s.replace(old_paced, new_paced, 1)
          elif 'full.addEventListener' not in s:
              raise SystemExit('No se pudo instalar Poema completo en estrella/index.html')

          path.write_text(s, encoding='utf-8')

          # A FUEGO LENTO ya inicia en lectura acompasada; sólo se fija la música como entrada.
          path = Path('epilogo/index.html')
          s = path.read_text(encoding='utf-8')
          s = s.replace(
              '<button id="musicStart" type="button">Activar música</button>',
              '<button id="musicStart" type="button" hidden>Activar música</button>',
          )
          old_music = "if(inheritedMusic)sendMusic('ready');"
          new_music = """if(inheritedMusic){\n musicEnabled.checked=true;\n sendMusic('enabled');\n sendMusic('start');\n sendMusic('ready');\n}"""
          if old_music in s:
              s = s.replace(old_music, new_music, 1)
          path.write_text(s, encoding='utf-8')

          # ANA KLAUDYA: COMENZAR debe entrar en la elegía, nunca abrir #estrella.
          path = Path('elegia-breve/index.html')
          s = path.read_text(encoding='utf-8')
          old_start = """      entryButton.addEventListener('click',()=>{\n        if(entryButton.disabled)return;\n        window.dispatchEvent(new CustomEvent('oras:reading-start'));\n        entryButton.disabled=true;\n        body.classList.add('journey-started','sound-ready');\n        entry.classList.add('is-open');\n        if(prologuePlayed){beginPrelude(false);setJourney('elegia');}\n        else {prologueNameReady=false;openPoem('estrella',true);}\n      });"""
          new_start = """      entryButton.addEventListener('click',()=>{\n        if(entryButton.disabled)return;\n        window.dispatchEvent(new CustomEvent('oras:reading-start'));\n        entryButton.disabled=true;\n        body.classList.add('journey-started','sound-ready');\n        entry.classList.add('is-open');\n        prologuePlayed=true;\n        prologueNameReady=false;\n        beginPrelude(false);\n        setJourney('elegia');\n      });"""
          if old_start in s:
              s = s.replace(old_start, new_start, 1)
          elif "openPoem('estrella',true)" in s:
              raise SystemExit('ANA sigue conteniendo una apertura automática de estrella desde COMENZAR')
          s = s.replace('oras-reading-window-r2.js?v=20261018-ana-start-elegia-1','oras-reading-window-r2.js?v=20261018-ana-inline-start-1')
          s = s.replace('oras-reading-window-r2.js?v=20261018-ana-end-stable-r6','oras-reading-window-r2.js?v=20261018-ana-inline-start-1')
          path.write_text(s, encoding='utf-8')
          PY
      - name: Comprobar los estados canónicos
        shell: bash
        run: |
          set -euo pipefail
          for f in ojos/index.html sonrisa/index.html cabello/index.html piel/index.html; do
            grep -q "mode='playing'" "$f"
            grep -q "ORAS default: música + lectura pausada" "$f"
            grep -q 'id="musicStart" type="button" hidden' "$f"
          done
          grep -q 'id="full" type="button" disabled>Poema completo' estrella/index.html
          grep -q "full.addEventListener" estrella/index.html
          grep -q 'id="musicStart" type="button" hidden' estrella/index.html
          ! grep -q "openPoem('estrella',true)" elegia-breve/index.html
      - name: Guardar cambios
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ojos/index.html sonrisa/index.html cabello/index.html piel/index.html estrella/index.html epilogo/index.html elegia-breve/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ORAS: fija estados canónicos y entrada de ANA"
          git push
