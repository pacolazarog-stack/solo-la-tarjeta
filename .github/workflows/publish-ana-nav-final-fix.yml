name: Publicar corrección final navegación ANA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ana-nav-final-fix.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fijar runtime canónico y eliminar caché anterior
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          import re
          version='20261018-canonical-nav-final-1'
          changed=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              t=re.sub(r'oras-reading-window-r2\.js\?v=[^"\'<>\s]+',f'oras-reading-window-r2.js?v={version}',s)
              if t!=s:
                  p.write_text(t,encoding='utf-8')
                  changed.append(str(p))
          print('HTML actualizados:', len(changed))
          rw=Path('oras-reading-window-r2.js').read_text(encoding='utf-8')
          forbidden=["box.innerHTML='<summary>Índice ORAS",'forcePiece(',"stopImmediatePropagation();\n    safeEnd()"]
          for token in forbidden:
              if token in rw:
                  raise SystemExit('Sigue presente una interferencia antigua: '+token)
          if "VERSION='20261018-canonical-nav-final-1'" not in rw:
              raise SystemExit('El runtime canónico nuevo no está activo')
          PY
          node --check oras-reading-window-r2.js
      - name: Guardar el bust de caché
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html' 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ANA: publica navegación única y final desbloqueado'
            git push
          fi
      - name: Publicar GitHub Pages desde main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          gh workflow run pages.yml --ref main
