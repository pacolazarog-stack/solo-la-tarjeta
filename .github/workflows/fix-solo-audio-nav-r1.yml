name: Fix SOLO audio and prev-next controls
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-solo-audio-nav-r1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SOLO controls and bump audio cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'oras-suno-volume-r1\.js\?v=[^"\'<>\s]+','oras-suno-volume-r1.js?v=20261014-suno-volume-6',s)
              s=re.sub(r'ana-klaudya/publication\.js\?v=[^"\'<>\s]+','ana-klaudya/publication.js?v=20261014-ana-stable-1',s)
              s=re.sub(r'\.\./ana-klaudya/publication\.js\?v=[^"\'<>\s]+','../ana-klaudya/publication.js?v=20261014-ana-stable-1',s)
              p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          hard_hide='''<style id="oras-single-audio-control-r1">\n.sound-toggle,#soundToggle{display:none!important;visibility:hidden!important;pointer-events:none!important}\n</style>'''
          if 'id="oras-single-audio-control-r1"' not in s:
              s=s.replace('</head>',hard_hide+'\n</head>',1)

          solo_nav=r'''<script id="oras-solo-prev-next-r1">
          (()=>{
            'use strict';
            if(window.__orasSoloPrevNextR1)return;
            window.__orasSoloPrevNextR1=true;
            const clean=location.pathname.replace(/\/index\.html$/i,'/').replace(/\/+$/,'');
            if(clean!=='/solo-la-tarjeta')return;
            const style=document.createElement('style');
            style.textContent=`#orasSoloPrevNext{position:fixed;z-index:2147483644;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:grid;grid-template-columns:1fr 1fr;width:min(360px,calc(100vw - 250px));min-width:230px;height:42px;border-top:1px solid rgba(255,255,255,.34);background:rgba(8,8,8,.08);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}#orasSoloPrevNext button{appearance:none;border:0;background:transparent;color:#fffaf1;text-shadow:0 1px 4px rgba(0,0,0,.9);font:500 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.04em;cursor:pointer}#orasSoloPrevNext button+button{border-left:1px solid rgba(255,255,255,.22)}#orasSoloPrevNext button:focus-visible{outline:1px solid rgba(255,255,255,.65);outline-offset:-2px}@media(max-width:700px){#orasSoloPrevNext{bottom:max(10px,env(safe-area-inset-bottom));width:min(220px,calc(100vw - 132px));min-width:160px;height:40px}#orasSoloPrevNext button{font-size:11px}}`;
            document.head.appendChild(style);
            const nav=document.createElement('nav');
            nav.id='orasSoloPrevNext';nav.setAttribute('aria-label','Navegación de SOLO LA TARJETA');
            nav.innerHTML='<button type="button" data-dir="-1" aria-label="Anterior">Anterior</button><button type="button" data-dir="1" aria-label="Siguiente">Siguiente</button>';
            document.body.appendChild(nav);
            const centers=()=>{const preferred=[...document.querySelectorAll('.dusk-beat,.hero,.two-days-passage,.paris-section,.closing-section,.pre-final')];return preferred.filter(el=>{const r=el.getBoundingClientRect();return r.height>8&&getComputedStyle(el).display!=='none'})};
            const move=dir=>{const nodes=centers();const y=scrollY+innerHeight*.50;if(nodes.length){const pts=nodes.map(el=>({el,y:el.offsetTop+Math.min(el.offsetHeight/2,innerHeight*.45)})).sort((a,b)=>a.y-b.y);let target=null;if(dir>0)target=pts.find(p=>p.y>y+24)||pts.at(-1);else target=[...pts].reverse().find(p=>p.y<y-24)||pts[0];if(target){scrollTo({top:Math.max(0,target.y-innerHeight*.48),behavior:'smooth'});return;}}scrollBy({top:dir*innerHeight*.78,behavior:'smooth'});};
            nav.addEventListener('click',e=>{const b=e.target.closest('button[data-dir]');if(b)move(Number(b.dataset.dir))});
          })();
          </script>'''
          s=re.sub(r'\n?<script id="oras-solo-prev-next-r1">.*?</script>\n?','\n',s,flags=re.S)
          s=s.replace('</body>',solo_nav+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html '*.html' '**/*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ORAS: actualiza caché del audio y estabiliza ANA KLAUDYA"
          git push
