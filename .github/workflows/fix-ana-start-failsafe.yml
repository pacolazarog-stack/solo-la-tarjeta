name: Fix ANA start failsafe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ana-start-failsafe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add resilient ANA start fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          marker='''<script id="ana-start-failsafe-r1">
(() => {
  const btn=document.getElementById('entryButton');
  if(!btn || btn.dataset.failsafeBound==='1') return;
  btn.dataset.failsafeBound='1';
  btn.addEventListener('click',() => {
    const entry=document.getElementById('entry');
    const frame=document.getElementById('cenicientoFrame');
    setTimeout(() => {
      const stillBlocked = entry && !entry.classList.contains('is-open') && (!frame || frame.hidden);
      if(stillBlocked){
        location.href='../estrella/?prologue=1&from=ana-start';
      }
    },350);
  },{capture:true});
})();
</script>'''
          if 'ana-start-failsafe-r1' not in s:
              needle='''        <button class="entry-button" id="entryButton" type="button">▶ Comenzar</button>'''
              if needle not in s:
                  raise RuntimeError('No se encontró entryButton')
              s=s.replace(needle,needle+'\n      '+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -Fq 'ana-start-failsafe-r1' elegia-breve/index.html
          grep -Fq "../estrella/?prologue=1&from=ana-start" elegia-breve/index.html
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elegia-breve/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ANA KLAUDYA: asegura que Comenzar abra el prólogo"
          git push
