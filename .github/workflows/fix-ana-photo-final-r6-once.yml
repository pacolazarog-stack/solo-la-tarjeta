name: Fix ANA photo final r6 once

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Garantizar fotografía final sin bloqueo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')

          new_finish='''      const forcePortraitFinal=()=>{\n        portraitRequested=true;\n        portraitFinale.setAttribute('aria-hidden','false');\n        body.classList.add('portrait-revealed');\n        if(anaNavigation){anaNavigation.hidden=true;body.classList.remove('ana-navigation-ready');}\n        const nav=document.getElementById('journeyNav');\n        if(nav)nav.hidden=false;\n      };\n      const finishVoicePass=()=>{\n        if(listeningStart!==null) listeningEnd=recording.currentTime;\n        saveListenedRange();\n        completedVoicePasses++;\n\n        body.classList.add('edge-final-safe');\n        finalSequenceStarted=true;\n        warmPhase=0;\n        warmTakeover=.88;\n        root.style.setProperty('--warm','.88');\n        root.style.setProperty('--green','.06');\n        root.style.setProperty('--deep','.04');\n        root.style.setProperty('--billiard','.08');\n        finalHeat.classList.add('is-shown','show-calor');\n\n        clearTimeout(finalCalorTimer);\n        clearTimeout(finalPortraitTimer);\n        finalCalorTimer=null;\n        finalPortraitTimer=setTimeout(()=>{\n          finalPortraitTimer=null;\n          forcePortraitFinal();\n        },1200);\n\n        listenedRanges=[];\n        listeningStart=null;\n      };\n      const resetPortraitFinale='''

          pattern=r"      const finishVoicePass=\(\)=>\{\n.*?\n      \};\n      const resetPortraitFinale="
          s2,n=re.subn(pattern,new_finish,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'No se encontró finishVoicePass exactamente una vez: {n}')
          s=s2

          old_pause="""      recording.addEventListener('pause',()=>{\n        if(voicePriming || voicePending || body.classList.contains('ceniciento-open')) return;\n        voiceAllowed=false;voicePlay.textContent='Activar voz';restoreAmbient();\n      });"""
          new_pause="""      recording.addEventListener('pause',()=>{\n        if(voicePriming || voicePending || body.classList.contains('ceniciento-open')) return;\n        if(recording.ended || (Number.isFinite(recording.duration) && recording.duration>0 && recording.currentTime>=recording.duration-.2)) return;\n        voiceAllowed=false;voicePlay.textContent='Activar voz';restoreAmbient();\n      });"""
          if old_pause not in s:
              raise SystemExit('No se encontró listener pause de voz')
          s=s.replace(old_pause,new_pause,1)

          old_end="""      recording.addEventListener('ended',()=>{\n        finishVoicePass();\n        voiceAllowed=false;voicePlay.textContent='Volver a escuchar';\n        voiceStatus.textContent='Fin de la grabación.';restoreAmbient();\n      });"""
          new_end="""      recording.addEventListener('ended',()=>{\n        finishVoicePass();\n        voiceAllowed=false;voicePlay.textContent='Volver a escuchar';\n        voiceStatus.textContent='Fin de la grabación.';\n      });"""
          if old_end not in s:
              raise SystemExit('No se encontró listener ended de voz')
          s=s.replace(old_end,new_end,1)

          p.write_text(s,encoding='utf-8')
          PY

          git diff --check
          git diff -- elegia-breve/index.html

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elegia-breve/index.html
          git commit -m "ANA: garantiza fotografía final r6"
          git push
