name: Fix ORAS inline cover 20261014

on:
  push:
    paths:
      - '.github/workflows/fix-oras-cover-inline-20261014.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace broken image cover with self-contained cover
        shell: python
        run: |
          from pathlib import Path

          p = Path('oras-master-index-r1.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace("const VERSION='20261014-master-index-6';", "const VERSION='20261014-master-index-7';")
          text = text.replace(
              '.oras-master-cover-img{display:block;width:100%;height:100%;object-fit:cover}',
              '.oras-master-cover-img{display:none!important}.oras-master-cover-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,rgba(76,65,49,.22),transparent 31%),linear-gradient(180deg,#17130f 0%,#090807 62%,#030303 100%);color:#efe5d2;text-align:center}.oras-master-cover-title{font:400 clamp(4.5rem,13vw,8.5rem)/.88 Georgia,serif;letter-spacing:.08em;text-indent:.08em}.oras-master-cover-sub{margin-top:1.1rem;font:italic clamp(1rem,2.3vw,1.35rem)/1.2 Georgia,serif;letter-spacing:.035em;color:rgba(239,229,210,.76)}.oras-master-cover-hint{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font:500 .66rem/1.2 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:rgba(239,229,210,.42);white-space:nowrap}'
          )
          old = 'cover.innerHTML=`<div class="oras-master-cover-frame"><img class="oras-master-cover-img" src="${ROOT}/assets/oras-portada-final.jpg?v=${VERSION}" alt="ORAS · Lo que queda de las horas"><button class="oras-master-button" type="button" aria-label="Abrir índice general de lectura"><span>Abrir índice general de lectura</span></button></div>`;'
          new = 'cover.innerHTML=`<div class="oras-master-cover-frame oras-master-cover-fallback"><div class="oras-master-cover-title">ORAS</div><div class="oras-master-cover-sub">Lo que queda de las horas</div><div class="oras-master-cover-hint">Abrir índice</div><button class="oras-master-button" type="button" aria-label="Abrir índice general de lectura"><span>Abrir índice general de lectura</span></button></div>`;'
          if old not in text:
              raise SystemExit('No se encontró el bloque de portada esperado')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          rw = Path('oras-reading-window-r2.js')
          text = rw.read_text(encoding='utf-8')
          text = text.replace('oras-master-index-r1.js?v=20261014-master-index-6', 'oras-master-index-r1.js?v=20261014-master-index-7')
          text = text.replace("const VERSION='20261014-reading-window-2';", "const VERSION='20261014-reading-window-3';")
          rw.write_text(text, encoding='utf-8')

          idx = Path('index.html')
          text = idx.read_text(encoding='utf-8')
          text = text.replace('/solo-la-tarjeta/oras-reading-window-r2.js?v=20261014-reading-window-2', '/solo-la-tarjeta/oras-reading-window-r2.js?v=20261014-reading-window-3')
          idx.write_text(text, encoding='utf-8')

      - name: Commit inline cover fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oras-master-index-r1.js oras-reading-window-r2.js index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Hace autónoma la portada del índice ORAS"
          git push origin main
