name: Activa ANA end stability 4 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-ana-end-stability-4-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump runtime ANA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'oras-reading-window-r2\.js\?v=[^"\']+', 'oras-reading-window-r2.js?v=20261018-ana-end-stability-4', s, count=1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/bump-ana-end-stability-4-once.yml
      - name: Publicar
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elegia-breve/index.html .github/workflows/bump-ana-end-stability-4-once.yml
          git commit -m 'ANA: activa final estable sin bloqueo de Edge'
          git push