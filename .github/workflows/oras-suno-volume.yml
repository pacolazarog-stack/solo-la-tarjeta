name: Unificar volumen ORAS tipo Suno

on:
  push:
    paths:
      - '.github/workflows/oras-suno-volume.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar control global de volumen
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('oras-reading-window-r2.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const VERSION='[^']+';", "const VERSION='20261014-suno-volume-1';", s, count=1)

          if "oras-suno-volume-control-r1" not in s:
              s += r'''

/* ORAS · control de volumen visual compacto inspirado en el patrón de Suno. */
(()=>{
'use strict';
if(window.__orasSunoVolumeInstalled)return;
window.__orasSunoVolumeInstalled=true;
const STORE='oras.master.volume.v1';
const style=document.createElement('style');
style.id='oras-suno-volume-control-r1';
style.textContent=`
#orasSunoVolume{position:fixed;z-index:2147483646;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#orasSunoVolume .oras-vol-button{width:42px;height:42px;border:1px solid rgba(255,255,255,.16);border-radius:9px;background:rgba(9,9,9,.82);display:grid;place-items:center;color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.24);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;padding:0}
#orasSunoVolume .oras-vol-button:hover,#orasSunoVolume .oras-vol-button:focus-visible{background:rgba(22,22,22,.93);outline:none;border-color:rgba(255,255,255,.28)}
#orasSunoVolume .oras-vol-button svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#orasSunoVolume .oras-vol-pop{position:absolute;left:0;bottom:50px;width:164px;min-height:42px;padding:10px 12px;border:1px solid rgba(255,255,255,.14);border-radius:9px;background:rgba(9,9,9,.9);box-shadow:0 8px 26px rgba(0,0,0,.28);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);display:flex;align-items:center;gap:9px;opacity:0;visibility:hidden;transform:translateY(5px);transition:opacity .16s ease,transform .16s ease,visibility .16s ease}
#orasSunoVolume[data-open="true"] .oras-vol-pop{opacity:1;visibility:visible;transform:none}
#orasSunoVolume .oras-vol-pop input{width:112px;margin:0;accent-color:#fff}
#orasSunoVolume .oras-vol-value{min-width:28px;text-align:right;color:rgba(255,255,255,.7);font:500 10px/1 system-ui,sans-serif}
body.oras-suno-volume-ready .ou-reading-window-r2{left:max(62px,calc(env(safe-area-inset-left) + 62px))}
body.oras-suno-volume-ready .music{display:none!important}
@media(max-width:700px){#orasSunoVolume{left:max(9px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom))}#orasSunoVolume .oras-vol-button{width:40px;height:40px;border-radius:8px}#orasSunoVolume .oras-vol-pop{bottom:48px;width:156px}.oras-suno-volume-ready .ou-reading-window-r2{left:max(57px,calc(env(safe-area-inset-left) + 57px))}}
`;
document.head.appendChild(style);

const root=document.createElement('div');
root.id='orasSunoVolume';
root.dataset.open='false';
root.innerHTML=`<div class="oras-vol-pop" role="group" aria-label="Volumen"><input class="oras-vol-range" type="range" min="0" max="100" step="1" aria-label="Volumen"><span class="oras-vol-value"></span></div><button class="oras-vol-button" type="button" aria-label="Volumen" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"></path><path class="oras-wave oras-wave-1" d="M16 9.5a4 4 0 0 1 0 5"></path><path class="oras-wave oras-wave-2" d="M18.5 7a7.5 7.5 0 0 1 0 10"></path></svg></button>`;
document.body.appendChild(root);
const button=root.querySelector('.oras-vol-button');
const range=root.querySelector('.oras-vol-range');
const value=root.querySelector('.oras-vol-value');
let lastNonZero=80;
try{lastNonZero=Math.max(1,Math.min(100,Number(localStorage.getItem(STORE)||80)))}catch(_){}
range.value=String(lastNonZero);

function targetRange(){return document.querySelector('#musicLevel,input[type="range"][data-volume],input[type="range"][id*="volume" i],input[type="range"][name*="volume" i]')}
function targetEnabled(){return document.querySelector('#musicEnabled,input[type="checkbox"][id*="music" i]')}
function mirrorScore(){return document.querySelector('audio[data-oras-mirror-score="1"]')}
function visibleStart(){const b=document.getElementById('musicStart');return b&&!b.hidden?b:null}
function renderIcon(level){
  root.querySelector('.oras-wave-1').style.display=level>0?'':'none';
  root.querySelector('.oras-wave-2').style.display=level>45?'':'none';
  button.setAttribute('aria-label',level>0?`Volumen ${level} %`:'Volumen silenciado');
  value.textContent=level+'%';
}
function apply(level,emit=true){
  level=Math.max(0,Math.min(100,Number(level)||0));
  range.value=String(level);renderIcon(level);
  if(level>0){lastNonZero=level;try{localStorage.setItem(STORE,String(level))}catch(_){}}
  const native=targetRange();
  if(native){
    const max=Number(native.max||100),min=Number(native.min||0);
    native.value=String(min+(max-min)*(level/100));
    if(emit){native.dispatchEvent(new Event('input',{bubbles:true}));native.dispatchEvent(new Event('change',{bubbles:true}))}
  }
  const enabled=targetEnabled();
  if(enabled&&enabled.checked!==(level>0)){enabled.checked=level>0;if(emit)enabled.dispatchEvent(new Event('change',{bubbles:true}))}
  const score=mirrorScore();
  if(score){score.volume=level/100;score.muted=level===0}
  if(level>0&&emit){try{visibleStart()?.click()}catch(_){}}
}
function syncFromNative(){
  const native=targetRange();
  if(!native)return apply(range.value,false);
  const max=Number(native.max||100),min=Number(native.min||0),v=Number(native.value||0);
  const pct=Math.round(((v-min)/Math.max(.0001,max-min))*100);
  range.value=String(pct);renderIcon(pct);
}
range.addEventListener('input',()=>apply(range.value,true));
button.addEventListener('click',event=>{event.stopPropagation();const open=root.dataset.open!=='true';root.dataset.open=String(open);button.setAttribute('aria-expanded',String(open));if(open)syncFromNative()});
document.addEventListener('click',event=>{if(!root.contains(event.target)){root.dataset.open='false';button.setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){root.dataset.open='false';button.setAttribute('aria-expanded','false')}});
new MutationObserver(()=>{if(document.querySelector('audio,.music,#musicLevel')){document.body.classList.add('oras-suno-volume-ready');const score=mirrorScore();if(score&&!score.dataset.orasVolumeSynced){score.dataset.orasVolumeSynced='1';apply(range.value,false)}}}).observe(document.documentElement,{childList:true,subtree:true});
if(document.querySelector('audio,.music,#musicLevel'))document.body.classList.add('oras-suno-volume-ready');
setTimeout(syncFromNative,0);setTimeout(syncFromNative,700);
window.ORASVolume={set:apply,get:()=>Number(range.value),toggle:()=>{const current=Number(range.value);apply(current>0?0:lastNonZero,true)}};
})();
'''
          p.write_text(s,encoding='utf-8')

          # Fuerza la nueva versión en todas las páginas que ya usan la ventana global.
          for h in Path('.').rglob('*.html'):
              t=h.read_text(encoding='utf-8')
              u=re.sub(r'oras-reading-window-r2\.js\?v=[^"\'<>\s]+','oras-reading-window-r2.js?v=20261014-suno-volume-1',t)
              if u!=t:h.write_text(u,encoding='utf-8')
      - name: Validar
        run: |
          node --check oras-reading-window-r2.js
          grep -q 'oras-suno-volume-control-r1' oras-reading-window-r2.js
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oras-reading-window-r2.js '*.html' */*.html */*/*.html 2>/dev/null || true
          git add -u
          rm -f .github/workflows/oras-suno-volume.yml
          git add -A
          git commit -m 'ORAS: unifica el volumen con control compacto tipo Suno'
          git pull --rebase origin main
          git push
