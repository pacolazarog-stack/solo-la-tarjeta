name: Unificar volumen ORAS tipo Suno

on:
  push:
    paths:
      - '.github/workflows/oras-suno-volume.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inyectar control global
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag='<script src="/solo-la-tarjeta/oras-suno-volume-r1.js?v=20261014-suno-volume-1"></script>'
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              if 'oras-suno-volume-r1.js' in s:
                  continue
              if '</body>' in s:
                  s=s.replace('</body>',tag+'\n</body>',1)
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: |
          test -f oras-suno-volume-r1.js
          grep -RIl 'oras-suno-volume-r1.js' --include='*.html' . | head -n 1
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/oras-suno-volume.yml
          git add -A
          git commit -m 'ORAS: activa el control de volumen compacto tipo Suno en todo el recorrido'
          git pull --rebase origin main
          git push
