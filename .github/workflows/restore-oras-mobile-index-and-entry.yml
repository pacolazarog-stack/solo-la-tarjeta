name: Restaurar índice móvil global y entrada ORAS

on:
  push:
    paths:
      - '.github/workflows/restore-oras-mobile-index-and-entry.yml'
      - '.github/scripts/restore_oras_mobile_index_and_entry.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar cambios
        run: python3 .github/scripts/restore_oras_mobile_index_and_entry.py
      - name: Validar núcleo
        run: |
          set -euo pipefail
          node --check oras-master-index-r1.js
          node --check oras-reading-window-r2.js
          node --check narrative-universe.js
          node --check ceniciento/el-espejo.js
          grep -Fq "const COVER_ENTRY=" oras-master-index-r1.js
          grep -Fq "data-reset" oras-master-index-r1.js
          grep -Fq "window.ORASMasterIndex=" oras-master-index-r1.js
          grep -Fq "clearStaleVisitsAfterRestart(){return;}" narrative-universe.js
          if grep -Fq "anaComplete:false" ceniciento/el-espejo.js; then
            echo 'ERROR: El Espejo aún reinicia LA VIDA'
            exit 1
          fi
      - name: Publicar cambios
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ORAS: restaura índice móvil global, entrada inmersiva y reinicio manual"
          git pull --rebase origin main
          git push
