name: Aplicar arquitectura emocional definitiva ORAS

on:
  push:
    paths:
      - '.github/workflows/apply-oras-final-emotional-architecture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reordenar índice, Atlas y canon
        shell: python
        run: |
          from pathlib import Path
          import re

          # ------------------------------------------------------------
          # 1. Índice ORAS: III Expansión -> IV Archivero -> V Cero
          # ------------------------------------------------------------
          p = Path('oras-master-index-r1.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const VERSION='20261014-master-index-12';", "const VERSION='20261014-master-index-13';", 1)

          s = re.sub(
              r"const CIUDAD=\[.*?\];\n\nconst ZERO=\['zero','Epílogo · La Habitación Número Cero'\];\nconst EXPANSION=\[\.\.\.INVENTARIO,\.\.\.OFICIO,\.\.\.CIUDAD,ZERO\];",
              """const CIUDAD=[
  ['ciu-1','I. La plaza'],
  ['ciu-2','II. El archivero'],
  ['ciu-3','III. La fuente'],
  ['ciu-4','IV. Los resistentes'],
  ['ciu-5','V. El mapa imposible'],
  ['ciu-6','VI. Teoría'],
  ['ciu-7','VII. El museo'],
  ['ciu-8','VIII. El visitante'],
  ['ciu-9','IX. Invierno']
];

const ARCHIVERO=[
  ['ciu-11','X. El Archivo Profundo'],
  ['ciu-12','XI. La Máquina de las Huellas'],
  ['ciu-13','XII. El Resonador'],
  ['ciu-10','XIII. La Última Sala']
];

const ATLAS=['atlas','ATLAS / AZAR'];
const ZERO=['zero','Epílogo · La Habitación Número Cero'];
const EXPANSION=[...INVENTARIO,...OFICIO,...CIUDAD,...ARCHIVERO,ATLAS,ZERO];""",
              s,
              count=1,
              flags=re.S
          )

          old = """  const ciudadCount=countDone(CIUDAD);
  const zeroDone=expansionDone('zero');
  const lifeWorks=[solo,anaComplete,cen].filter(Boolean).length;
  const expansionCount=invCount+oficioCount+ciudadCount;
  const pct=Math.round((p.done/p.total)*100);

  // Índice progresivo: sólo se muestra lo que el lector ha desbloqueado.
  const showAna=solo;
  const showCeniciento=solo;
  const showMirror=mirrorReady||mirror||mirrorCrossed;
  const showExpansion=mirrorCrossed;
  const showInventario=showExpansion;
  const showOficio=showExpansion&&invCount===INVENTARIO.length;
  const showCiudad=showOficio&&oficioCount===OFICIO.length;
  const showZero=showCiudad&&ciudadCount===CIUDAD.length;

  const anaParts=ANA.map(([id,label,href])=>chip('ana-'+id,label,href,anaDone(id,u))).join('');
  const invParts=INVENTARIO.map(([id,label])=>chip(id,label,invHref(id),expansionDone(id))).join('');
  const oficioParts=OFICIO.map(([id,label])=>chip(id,label,invHref(id),expansionDone(id))).join('');
  const ciudadParts=CIUDAD.map(([id,label])=>chip(id,label,invHref(id),expansionDone(id),id==='atlas'?'is-atlas':'')).join('');
"""
          new = """  const ciudadCount=countDone(CIUDAD);
  const archiveroCount=countDone(ARCHIVERO);
  const atlasDone=expansionDone('atlas');
  const zeroDone=expansionDone('zero');
  const lifeWorks=[solo,anaComplete,cen].filter(Boolean).length;
  const expansionCount=invCount+oficioCount+ciudadCount;
  const pct=Math.round((p.done/p.total)*100);

  // Índice progresivo y emocional: el lector no ve todavía lo que no ha alcanzado.
  const showAna=solo;
  const showCeniciento=solo;
  const showMirror=mirrorReady||mirror||mirrorCrossed;
  const showExpansion=mirrorCrossed;
  const showInventario=showExpansion;
  const showOficio=showExpansion&&invCount===INVENTARIO.length;
  const showCiudad=showOficio&&oficioCount===OFICIO.length;
  const showArchivero=showCiudad&&ciudadCount===CIUDAD.length;
  const showAtlas=showArchivero&&archiveroCount===ARCHIVERO.length;
  const showZero=showAtlas&&atlasDone;

  const anaParts=ANA.map(([id,label,href])=>chip('ana-'+id,label,href,anaDone(id,u))).join('');
  const invParts=INVENTARIO.map(([id,label])=>chip(id,label,invHref(id),expansionDone(id))).join('');
  const oficioParts=OFICIO.map(([id,label])=>chip(id,label,invHref(id),expansionDone(id))).join('');
  const ciudadParts=CIUDAD.map(([id,label])=>chip(id,label,invHref(id),expansionDone(id))).join('');
"""
          if old not in s:
              raise SystemExit('No se encontró el bloque de progresión del índice')
          s = s.replace(old,new,1)

          old = """    ...(showCiudad?CIUDAD.map(([id])=>!expansionDone(id)&&invHref(id)):[]),
    showZero&&!zeroDone&&invHref('zero')
"""
          new = """    ...(showCiudad?CIUDAD.map(([id])=>!expansionDone(id)&&invHref(id)):[]),
    ...(showArchivero?ARCHIVERO.map(([id])=>!expansionDone(id)&&invHref(id)):[]),
    showAtlas&&!atlasDone&&invHref('atlas'),
    showZero&&!zeroDone&&invHref('zero')
"""
          if old not in s:
              raise SystemExit('No se encontró firstUnread del tramo final')
          s = s.replace(old,new,1)

          old = """    ${showExpansion?`<section class=\"oras-mi-section\">
      ${sectionHead('III · LA EXPANSIÓN',`${expansionCount}/${INVENTARIO.length+OFICIO.length+CIUDAD.length}`)}
      ${showInventario?card({id:'inventario',mark:'4',title:'El inventario del aire',meta:`${invCount}/${INVENTARIO.length} huellas`,done:invCount===INVENTARIO.length,parts:invParts,open:open.has('inventario')}):''}
      ${showOficio?card({id:'oficio',mark:'5',title:'El oficio de las sombras',meta:`${oficioCount}/${OFICIO.length} huellas`,done:oficioCount===OFICIO.length,parts:oficioParts,open:open.has('oficio')}):''}
      ${showCiudad?card({id:'ciudad',mark:'6',title:'La ciudad que aprendió a olvidar',meta:`${ciudadCount}/${CIUDAD.length} huellas`,done:ciudadCount===CIUDAD.length,parts:ciudadParts,open:open.has('ciudad')}):''}
    </section>`:''}

    ${showZero?`<section class=\"oras-mi-section\">
      ${sectionHead('IV · EL CERO',zeroDone?'1/1':'0/1')}
      ${card({id:'zero',mark:'0',title:'La Habitación Número Cero',meta:zeroDone?'completa':'pendiente',done:zeroDone,href:invHref('zero')})}
    </section>`:''}`;
"""
          new = """    ${showExpansion?`<section class=\"oras-mi-section\">
      ${sectionHead('III · LA EXPANSIÓN',`${expansionCount}/${INVENTARIO.length+OFICIO.length+CIUDAD.length}`)}
      ${showInventario?card({id:'inventario',mark:'4',title:'El inventario del aire',meta:`${invCount}/${INVENTARIO.length} huellas`,done:invCount===INVENTARIO.length,parts:invParts,open:open.has('inventario')}):''}
      ${showOficio?card({id:'oficio',mark:'5',title:'El oficio de las sombras',meta:`${oficioCount}/${OFICIO.length} huellas`,done:oficioCount===OFICIO.length,parts:oficioParts,open:open.has('oficio')}):''}
      ${showCiudad?card({id:'ciudad',mark:'6',title:'La ciudad que aprendió a olvidar',meta:`${ciudadCount}/${CIUDAD.length} huellas · I–IX`,done:ciudadCount===CIUDAD.length,parts:ciudadParts,open:open.has('ciudad')}):''}
    </section>`:''}

    ${showArchivero?`<section class=\"oras-mi-section\">
      ${sectionHead('IV · EL ARCHIVERO',`${archiveroCount}/${ARCHIVERO.length}`)}
      ${ARCHIVERO.map(([id,label],i)=>card({id,mark:['X','XI','XII','XIII'][i],title:label.replace(/^[XVI]+\\.\\s*/,''),meta:expansionDone(id)?'leída':'pendiente',done:expansionDone(id),href:invHref(id)})).join('')}
    </section>`:''}

    ${showAtlas?`<section class=\"oras-mi-section\">
      ${sectionHead('V · EL CERO',`${(atlasDone?1:0)+(zeroDone?1:0)}/2`)}
      ${card({id:'atlas',mark:'A/Z',title:'ATLAS / AZAR',meta:'Interludio documental · Documento recuperado del Archivo Profundo',done:atlasDone,href:invHref('atlas')})}
      ${showZero?card({id:'zero',mark:'0',title:'La Habitación Número Cero',meta:zeroDone?'completa':'última pieza',done:zeroDone,href:invHref('zero')}):''}
    </section>`:''}`;
"""
          if old not in s:
              raise SystemExit('No se encontró el bloque HTML del tramo final')
          s = s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # ------------------------------------------------------------
          # 2. Página de lectura: ATLAS/AZAR pasa detrás de XIII.
          #    Se hace en DOM para no tocar el texto canónico.
          # ------------------------------------------------------------
          p = Path('inventario-del-aire/r8-canonical-headings.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  XI · La Máquina de las Huellas\n  ATLAS / AZAR\n  XII · El Resonador\n  XIII · La última sala\n  EPÍLOGO · La Habitación Número Cero",
                        "  XI · La Máquina de las Huellas\n  XII · El Resonador\n  XIII · La última sala\n  ATLAS / AZAR · interludio documental\n  EPÍLOGO · La Habitación Número Cero",1)

          insert = r'''
function placeAtlasAfterLastRoom(){
  const atlas=book.querySelector('h3[data-chapter="atlas"]');
  const last=book.querySelector('h3[data-chapter="last-room"]');
  if(!atlas||!last)return false;

  const headings=[...book.querySelectorAll('h3[data-chapter]')];
  const ai=headings.indexOf(atlas);
  const li=headings.indexOf(last);
  if(ai===li+1){
    ensureAtlasLabel(atlas);
    return false;
  }

  const block=[];
  let node=atlas;
  while(node){
    const next=node.nextSibling;
    block.push(node);
    node=next;
    if(node?.nodeType===1 && node.matches?.('h3[data-chapter]'))break;
  }

  const refreshed=[...book.querySelectorAll('h3[data-chapter]')];
  const lastNow=book.querySelector('h3[data-chapter="last-room"]');
  const lastIndex=refreshed.indexOf(lastNow);
  const anchor=refreshed[lastIndex+1]||null;
  for(const n of block)book.insertBefore(n,anchor);
  ensureAtlasLabel(atlas);
  return true;
}

function ensureAtlasLabel(atlas){
  if(atlas.nextElementSibling?.dataset?.orasAtlasDocument==='1')return;
  const p=document.createElement('p');
  p.dataset.orasAtlasDocument='1';
  p.textContent='Documento recuperado del Archivo Profundo.';
  p.style.cssText='margin:.2rem 0 1.35rem;font-style:italic;opacity:.62;letter-spacing:.03em';
  atlas.insertAdjacentElement('afterend',p);
}
'''
          if 'function placeAtlasAfterLastRoom(){' not in s:
              s=s.replace('function run(){normalizeR8Headings();}',insert+'\nfunction run(){normalizeR8Headings();placeAtlasAfterLastRoom();}',1)
          else:
              s=s.replace('function run(){normalizeR8Headings();}', 'function run(){normalizeR8Headings();placeAtlasAfterLastRoom();}',1)
          p.write_text(s,encoding='utf-8')

          # Cache bust del compositor de encabezados.
          p = Path('inventario-del-aire/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('r8-canonical-headings.js?v=20261013-r9-order-1','r8-canonical-headings.js?v=20261014-final-emotional-order-1')
          p.write_text(s,encoding='utf-8')

          # ------------------------------------------------------------
          # 3. Documento rector
          # ------------------------------------------------------------
          p = Path('ORAS_CANON_NAVEGACION_Y_ESPEJO_R1.md')
          s = p.read_text(encoding='utf-8')
          old = '''### III · LA EXPANSIÓN

4. **EL INVENTARIO DEL AIRE**
5. **EL OFICIO DE LAS SOMBRAS**
6. **LA CIUDAD QUE APRENDIÓ A OLVIDAR**

LA EXPANSIÓN sólo se revela después de haber atravesado efectivamente EL ESPEJO. Dentro de ella, el índice mantiene la misma lógica de descubrimiento: primero EL INVENTARIO DEL AIRE; completado éste, EL OFICIO DE LAS SOMBRAS; completado éste, LA CIUDAD QUE APRENDIÓ A OLVIDAR.

### IV · EL CERO

**LA HABITACIÓN NÚMERO CERO**

LA HABITACIÓN NÚMERO CERO sólo aparece después de completar LA CIUDAD QUE APRENDIÓ A OLVIDAR.
'''
          new = '''### III · LA EXPANSIÓN

4. **EL INVENTARIO DEL AIRE**
5. **EL OFICIO DE LAS SOMBRAS**
6. **LA CIUDAD QUE APRENDIÓ A OLVIDAR · I–IX**

LA EXPANSIÓN sólo se revela después de haber atravesado efectivamente EL ESPEJO. Dentro de ella, el índice mantiene la misma lógica de descubrimiento: primero EL INVENTARIO DEL AIRE; completado éste, EL OFICIO DE LAS SOMBRAS; completado éste, LA CIUDAD QUE APRENDIÓ A OLVIDAR hasta **IX · Invierno**.

### IV · EL ARCHIVERO

- **X · EL ARCHIVO PROFUNDO**
- **XI · LA MÁQUINA DE LAS HUELLAS**
- **XII · EL RESONADOR**
- **XIII · LA ÚLTIMA SALA**

Esta sección conserva al lector dentro de la historia del archivero. Aquí la narración sobre pérdidas se convierte en investigación sobre su naturaleza, pero el eje humano no se abandona. **LA ÚLTIMA SALA** culmina con la muerte del archivero.

### V · EL CERO

**ATLAS / AZAR** aparece aquí como pieza autónoma y sin número, presentada como **INTERLUDIO DOCUMENTAL**:

> Documento recuperado del Archivo Profundo.

De este modo deja de interrumpir la investigación del archivero y pasa a funcionar como resto superviviente, evidencia recuperada después de su muerte.

Después aparece **LA HABITACIÓN NÚMERO CERO**, última pieza absoluta de ORAS. Nada puede situarse detrás de ella.
'''
          if old not in s:
              raise SystemExit('No se encontró la arquitectura anterior en el canon')
          s = s.replace(old,new,1)

          s += '''

---

## 11. Canon definitivo del arco emocional

El orden definitivo del tramo final es:

**LA CIUDAD QUE APRENDIÓ A OLVIDAR I–IX → EL ARCHIVERO X–XIII → ATLAS / AZAR → LA HABITACIÓN NÚMERO CERO.**

La secuencia emocional profunda de ORAS es:

**persona → amor → presencia → tiempo → ausencia → memoria → ciudad → archivero → muerte → documentos supervivientes → cero.**

Las teorías sostienen la emoción; no la sustituyen.

ATLAS / AZAR no forma parte de la numeración X–XIII. Es un documento superviviente y debe distinguirse gráficamente como tal.

LA HABITACIÓN NÚMERO CERO permanece intacta y cierra toda la obra. No existe XIV, coda ni explicación posterior.

La última frase absoluta de ORAS es:

> **Nadie supo decir desde cuándo.**
'''
          p.write_text(s,encoding='utf-8')

      - name: Validar cambios
        run: |
          node --check oras-master-index-r1.js
          node --check inventario-del-aire/r8-canonical-headings.js
          grep -Fq "IV · EL ARCHIVERO" oras-master-index-r1.js
          grep -Fq "V · EL CERO" oras-master-index-r1.js
          grep -Fq "Documento recuperado del Archivo Profundo" oras-master-index-r1.js
          grep -Fq "placeAtlasAfterLastRoom" inventario-del-aire/r8-canonical-headings.js
          grep -Fq "Nadie supo decir desde cuándo." ORAS_CANON_NAVEGACION_Y_ESPEJO_R1.md

      - name: Commit y publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oras-master-index-r1.js inventario-del-aire/r8-canonical-headings.js inventario-del-aire/index.html ORAS_CANON_NAVEGACION_Y_ESPEJO_R1.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ORAS: fija la arquitectura emocional definitiva"
          git pull --rebase origin main
          git push
