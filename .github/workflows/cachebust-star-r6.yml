name: Cachebust estrella r6

on:
  push:
    paths:
      - '.github/workflows/cachebust-star-r6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versionar runtime de estrella
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('estrella/index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="/solo-la-tarjeta/estrella-standalone-core-r4.js"></script>'
          new='<script src="/solo-la-tarjeta/estrella-standalone-core-r4.js?v=20261017-runtime-r6"></script>'
          if old not in s:
              raise SystemExit('referencia de runtime no encontrada')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Publicar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrella/index.html
          git commit -m "ANA: cachebust del runtime r6 de estrella"
          git push
