name: Fix epilogue forward to unread Ana piece

on:
  push:
    paths:
      - .github/workflows/fix-epilogue-forward-unread.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch epilogue forward navigation
        run: python3 tools/fix_epilogue_forward_unread.py
      - name: Validate JavaScript
        run: node --check narrative-universe.js
      - name: Validate diff
        run: git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add narrative-universe.js elegia-breve/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ORAS: Epílogo continúa por la pieza de Ana pendiente'
          git pull --rebase origin main
          git push origin HEAD:main
