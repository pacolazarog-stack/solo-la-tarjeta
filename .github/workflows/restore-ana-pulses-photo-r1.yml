name: Restore ANA pulses and portrait
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-ana-pulses-photo-r1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pulses and guarantee portrait reveal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) ANA: the pulse remains alive. Only the portrait itself is simplified
          # once it is visible; background breathing is never cancelled.
          for file in ['oras-suno-volume-r1.js','oras-reading-window-r2.js']:
              p=Path(file)
              s=p.read_text(encoding='utf-8')
              s=s.replace(',\n    body.oras-ana-static-final .pulse-field,\n    body.oras-ana-static-final .pulse-field::before,\n    body.oras-ana-static-final .pulse-field::after,\n    body.oras-ana-static-final .layer-warm,\n    body.oras-ana-static-final .heat-final','')
              s=s.replace(',body.oras-ana-static-final .pulse-field,body.oras-ana-static-final .pulse-field::before,body.oras-ana-static-final .pulse-field::after,body.oras-ana-static-final .layer-warm,body.oras-ana-static-final .heat-final','')
              s=s.replace("document.querySelectorAll('.pulse-field,.layer-warm,.heat-final').forEach(el=>{\n        try{el.getAnimations().forEach(a=>a.cancel())}catch(_){}\n      });","")
              s=s.replace("document.querySelectorAll('.pulse-field,.layer-warm,.heat-final').forEach(el=>{try{el.getAnimations().forEach(a=>a.cancel())}catch(_){}});","")
              p.write_text(s,encoding='utf-8')

          # 2) ANA: after 'el calor.' the photograph is guaranteed to arrive.
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          marker="""          finalHeat.classList.add('show-calor');\n          intensifyWarmWithCalor();"""
          replacement="""          finalHeat.classList.add('show-calor');\n          intensifyWarmWithCalor();\n          /* Canon: the visual pulses continue and the portrait must arrive after the final heat. */\n          clearTimeout(finalPortraitTimer);\n          finalPortraitTimer=setTimeout(()=>{\n            finalPortraitTimer=null;\n            if(cenicientoFrame.hidden && body.classList.contains('reading-ready'))revealPortrait();\n          },6000);"""
          if 'Canon: the visual pulses continue and the portrait must arrive after the final heat.' not in s:
              if marker not in s:
                  raise RuntimeError('No se localiza el final calor de ANA')
              s=s.replace(marker,replacement,1)
          # Remove older reread-only portrait timer so it cannot postpone/replace the canonical reveal.
          s=re.sub(r"\n\s*if\(elegiaAlreadyReadAtFinal\(\)\)\{\n\s*clearTimeout\(finalPortraitTimer\);\n\s*finalPortraitTimer=setTimeout\(\(\)=>\{\n\s*finalPortraitTimer=null;\n\s*if\(cenicientoFrame.hidden && body.classList.contains\('reading-ready'\)\)revealPortrait\(\);\n\s*\},4000\);\n\s*\}","",s,count=1)
          p.write_text(s,encoding='utf-8')

          # 3) Force fresh script URLs in all HTML files.
          for h in Path('.').rglob('*.html'):
              if '.git' in h.parts: continue
              t=h.read_text(encoding='utf-8')
              t=re.sub(r'oras-suno-volume-r1\.js\?v=[^"\'<>\s]+','oras-suno-volume-r1.js?v=20261015-suno-volume-8',t)
              t=re.sub(r'oras-reading-window-r2\.js\?v=[^"\'<>\s]+','oras-reading-window-r2.js?v=20261015-reading-stable-2',t)
              h.write_text(t,encoding='utf-8')
          PY
      - name: Validate JS
        run: |
          node --check oras-suno-volume-r1.js
          node --check oras-reading-window-r2.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elegia-breve/index.html oras-suno-volume-r1.js oras-reading-window-r2.js '*.html' '**/*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ANA KLAUDYA: restaura pulsos y garantiza la aparición de la foto"
          git push
