name: Publicar SOLO LA TARJETA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Verificar versión audiovisual vigente
        shell: bash
        run: |
          set -euo pipefail
          node --check narrative-universe.js
          node --check ceniciento/el-espejo.js
          node --check inventario-del-aire/oras-expansion.js
          grep -Fq '20261012-epilogue-unread-forward-1' narrative-universe.js
          grep -Fq 'resetCycleAfterInventoryReturn' narrative-universe.js
          grep -Fq "new URLSearchParams(location.search).get('from')==='inventario'" narrative-universe.js
          grep -Fq '20261012-mirror-mechanical-3' ceniciento/el-espejo.js
          grep -Fq 'el-espejo.js?v=20261012-mirror-mechanical-3' ceniciento/index.html
          grep -Fq 'narrative-universe.js?v=20261012-epilogue-unread-forward-1' index.html
          grep -Fq 'narrative-universe.js?v=20261012-epilogue-unread-forward-1' elegia-breve/index.html
          ! grep -Fq 'Relato breve digital inmersivo' index.html
          grep -Fq 'maintainSilence' ceniciento/el-espejo.js
          grep -Fq 'playMechanicalStep' ceniciento/el-espejo.js
          grep -Fq 'clearedPauses' ceniciento/el-espejo.js
          grep -Fq 'finalContinue.addEventListener' ceniciento/el-espejo.js
          grep -Fq 'solo-la-tarjeta-fondo.mp3' inventario-del-aire/index.html
          echo 'PASS: fuente publicada = fuente vigente; el Epílogo continúa por la pieza de Ana pendiente y el retorno del Inventario reinicia el ciclo.'

      - name: Preparar voz de Ceniciento
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts = sorted(Path('ceniciento/voz-parts').glob('*.bin'))
          if len(parts) != 14:
              raise RuntimeError('Faltan partes de la voz de Ceniciento')
          audio = b''.join(part.read_bytes() for part in parts)
          if hashlib.sha256(audio).hexdigest() != '5bf334d4dcfcffa240d455719795ee9687293395467b93b220219fb8b158d55b':
              raise RuntimeError('La grabación no coincide con el audio completo')
          Path('ceniciento/ceniciento-voz-completa.mp3').write_bytes(audio)
          PY

      - name: Replicar voz en la edición internacional
        run: |
          if [ -d nmwp-international/ceniciento ]; then
            cp ceniciento/ceniciento-voz-completa.mp3 nmwp-international/ceniciento/ceniciento-voz-completa.mp3
          fi

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
