# EL ESPEJO · banda sonora canónica v3 · ANA pulses-photo restore v2 · ORAS nacre roulette r1 · ANA entry failsafe r6 · preview limpio completo hasta EL CERO r4 · navegación unificada r7 · estrella core r2
name: Publicar SOLO LA TARJETA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Verificar núcleo ORAS
        shell: bash
        run: |
          set -euo pipefail
          node --check narrative-universe.js
          node --check oras-reading-window-r2.js
          node --check oras-master-index-r1.js
          node --check oras-screen-transition.js
          node --check oras-nacre-roulette-r1.js
          node --check oras-unified-nav-r1.js
          node --check ana-entry-failsafe-r1.js
          node --check ceniciento/el-espejo.js
          node --check ceniciento/el-espejo-soundtrack.js
          test -s assets/oras-portada-final.jpg
          test -s assets/oras-el-espejo-centro-de-datos.m4a
          test "$(wc -c < assets/oras-el-espejo-centro-de-datos.m4a)" -gt 800000
          grep -Fq 'assets/oras-portada-final.jpg' oras-master-index-r1.js
          grep -Fq 'oras-master-cover-img{display:block' oras-master-index-r1.js
          grep -Fq 'el-espejo-soundtrack.js?v=20261014-espejo-soundtrack-3' ceniciento/index.html
          echo 'PASS: núcleo ORAS legado disponible mientras se publica el preview limpio.'

      - name: Activar índice circular de nácar en todo ORAS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          tag='<script defer src="/solo-la-tarjeta/oras-nacre-roulette-r1.js?v=20261015-nacre-roulette-1"></script>'
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              if 'oras-master-index-r1.js' not in s or 'oras-nacre-roulette-r1.js' in s: continue
              if '</body>' in s:
                  s=s.replace('</body>',tag+'\n</body>',1)
                  p.write_text(s,encoding='utf-8')
          PY
          grep -RFl 'oras-nacre-roulette-r1.js?v=20261015-nacre-roulette-1' --include='*.html' . | head -n 1 | grep -q .

      - name: Blindar entrada de ANA KLAUDYA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('oras-reading-window-r2.js?v=20261013-ana-portrait-prev-next-1','oras-reading-window-r2.js?v=20261016-estrella-direct-2')
          tag='<script defer src="/solo-la-tarjeta/ana-entry-failsafe-r1.js?v=20261016-ana-entry-failsafe-6"></script>'
          if 'ana-entry-failsafe-r1.js' not in s:
              if '</body>' not in s: raise RuntimeError('No se encontró </body> en ANA KLAUDYA')
              s=s.replace('</body>',tag+'\n</body>',1)
          else:
              import re
              s=re.sub(r'ana-entry-failsafe-r1\.js\?v=[^"\']+', 'ana-entry-failsafe-r1.js?v=20261016-ana-entry-failsafe-6', s)
          p.write_text(s,encoding='utf-8')

          e=Path('estrella/index.html')
          t=e.read_text(encoding='utf-8')
          t=t.replace('../ana-klaudya/publication.js','../ana-klaudya/publication.js?v=20261016-publication-visible-1')
          e.write_text(t,encoding='utf-8')
          PY
          grep -Fq 'oras-reading-window-r2.js?v=20261016-estrella-direct-2' elegia-breve/index.html
          grep -Fq 'ana-entry-failsafe-r1.js?v=20261016-ana-entry-failsafe-6' elegia-breve/index.html
          grep -Fq 'publication.js?v=20261016-publication-visible-1' estrella/index.html

      - name: Corregir núcleo directo de ANA KLAUDYA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          old=("        prologueActive=asPrologue;\n"
               "        cenicientoFrame.hidden=false;\n"
               "        cenicientoFrame.setAttribute('title',piece==='estrella'?'Prólogo de Ana Klaudya':document.title);\n"
               "        setJourney(piece);\n")
          new=("        prologueActive=asPrologue;\n"
               "        cenicientoFrame.hidden=false;\n"
               "        for(const prop of ['display','opacity','visibility','pointer-events','z-index','background'])cenicientoFrame.style.removeProperty(prop);\n"
               "        if(piece==='estrella'){\n"
               "          cenicientoFrame.classList.add('sonrisa-visible');\n"
               "          cenicientoFrame.style.setProperty('display','block','important');\n"
               "          cenicientoFrame.style.setProperty('opacity','1','important');\n"
               "          cenicientoFrame.style.setProperty('visibility','visible','important');\n"
               "          cenicientoFrame.style.setProperty('pointer-events','auto','important');\n"
               "          cenicientoFrame.style.setProperty('z-index','2147482000','important');\n"
               "          cenicientoFrame.style.setProperty('background','#090e19','important');\n"
               "        }\n"
               "        cenicientoFrame.setAttribute('title',piece==='estrella'?'Prólogo de Ana Klaudya':document.title);\n"
               "        setJourney(piece);\n")
          if old in s:
              s=s.replace(old,new,1)
          old2=("      window.addEventListener('popstate',syncPoemRoute);\n"
                "      window.addEventListener('hashchange',syncPoemRoute);\n"
                "      window.addEventListener('message',event=>{\n")
          new2=("      window.addEventListener('popstate',syncPoemRoute);\n"
                "      window.addEventListener('hashchange',syncPoemRoute);\n"
                "      syncPoemRoute(); // 20261016-estrella-core-r2\n"
                "      window.addEventListener('message',event=>{\n")
          if '20261016-estrella-core-r2' not in s:
              if old2 not in s: raise RuntimeError('No se encontró el bloque syncPoemRoute esperado')
              s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq '20261016-estrella-core-r2' elegia-breve/index.html
          grep -Fq "cenicientoFrame.style.setProperty('opacity','1','important')" elegia-breve/index.html

      - name: Preparar voz de Ceniciento
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts = sorted(Path('ceniciento/voz-parts').glob('*.bin'))
          if len(parts) != 14: raise RuntimeError('Faltan partes de la voz de Ceniciento')
          audio = b''.join(part.read_bytes() for part in parts)
          if hashlib.sha256(audio).hexdigest() != '5bf334d4dcfcffa240d455719795ee9687293395467b93b220219fb8b158d55b':
              raise RuntimeError('La grabación no coincide con el audio completo')
          Path('ceniciento/ceniciento-voz-completa.mp3').write_bytes(audio)
          PY

      - name: Replicar voz en la edición internacional
        run: |
          if [ -d nmwp-international/ceniciento ]; then
            cp ceniciento/ceniciento-voz-completa.mp3 nmwp-international/ceniciento/ceniciento-voz-completa.mp3
          fi

      - name: Incorporar preview público de ORAS raíz limpia
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW='oras-raiz-limpia-preview'
          rm -rf "$PREVIEW"
          mkdir -p "$PREVIEW"
          git fetch --no-tags --depth=1 origin oras-raiz-limpia
          git archive FETCH_HEAD | tar -x -C "$PREVIEW"
          rm -rf "$PREVIEW/.github"
          if [ -f ceniciento/ceniciento-voz-completa.mp3 ]; then
            mkdir -p "$PREVIEW/ceniciento"
            cp ceniciento/ceniciento-voz-completa.mp3 "$PREVIEW/ceniciento/ceniciento-voz-completa.mp3"
          fi
          test -s "$PREVIEW/index.html"
          test -s "$PREVIEW/oras.js"
          test -s "$PREVIEW/core/reader.js"
          test -s "$PREVIEW/core/solo-scene.js"
          test -s "$PREVIEW/solo-scene.css"
          test -s "$PREVIEW/core/ana-scenes.js"
          test -s "$PREVIEW/ana-scenes.css"
          test -s "$PREVIEW/core/ceniciento.js"
          test -s "$PREVIEW/ceniciento-scene.css"
          test -s "$PREVIEW/core/mirror.js"
          test -s "$PREVIEW/mirror-scene.css"
          test -s "$PREVIEW/core/expansion.js"
          test -s "$PREVIEW/content/expansion-scenes.js"
          test -s "$PREVIEW/expansion-scenes.css"
          test -s "$PREVIEW/inventario-del-aire/assets-r4/house/01-recibidor.webp"
          test -s "$PREVIEW/inventario-del-aire/assets-r4/train/01-estacion.webp"
          test -s "$PREVIEW/inventario-del-aire/assets-r4/city/01-plaza.webp"
          test -s "$PREVIEW/inventario-del-aire/assets-r4/zero/01-habitacion-cero.webp"
          echo 'PASS: preview ORAS raíz limpia completo incorporado sin sustituir main.'

      - name: Unificar botonera de navegación ORAS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          tag='<script defer src="/solo-la-tarjeta/oras-unified-nav-r1.js?v=20261016-unified-nav-7"></script>'
          excluded={'nmwp','nmwp-international'}
          count=0
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or any(part in excluded for part in p.parts):
                  continue
              s=p.read_text(encoding='utf-8')
              if 'oras-unified-nav-r1.js' in s or '</body>' not in s:
                  continue
              oras = ('oras-master-index-r1.js' in s or
                      'oras-reading-window-r2.js' in s or
                      'data-oras-reader' in s or
                      'oras-reader-' in s or
                      'SOLO LA TARJETA' in s or
                      'ANA KLAUDYA' in s or
                      'CENICIENTO' in s or
                      'EL ESPEJO' in s or
                      'EL INVENTARIO DEL AIRE' in s)
              if not oras:
                  continue
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
              count+=1
          if count < 1:
              raise RuntimeError('No se inyectó la navegación ORAS')
          print(f'PASS: navegación ORAS unificada inyectada en {count} páginas.')
          PY
          grep -Fq 'oras-unified-nav-r1.js?v=20261016-unified-nav-7' index.html
          grep -Fq 'oras-unified-nav-r1.js?v=20261016-unified-nav-7' oras-raiz-limpia-preview/index.html

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
