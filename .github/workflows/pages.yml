# ORAS · recorridos canónicos v1 · índice circular mejorado
name: Publicar SOLO LA TARJETA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Verificar núcleo ORAS
        shell: bash
        run: |
          set -euo pipefail
          node --check narrative-universe.js
          node --check oras-reading-window-r3.js
          node --check ana-final-r37.js
          node --check ana-final-r39.js
          node --check ceniciento-entry-r38.js
          node --check oras-master-index-r1.js
          node --check oras-screen-transition.js
          node --check ceniciento/el-espejo.js
          node --check ceniciento/el-espejo-soundtrack.js
          test -s assets/oras-portada-final.jpg
          test -s assets/oras-el-espejo-centro-de-datos.m4a
          test "$(wc -c < assets/oras-el-espejo-centro-de-datos.m4a)" -gt 800000
          grep -Fq 'assets/oras-portada-final.jpg' oras-master-index-r1.js
          grep -Fq 'Recorridos de lectura' oras-master-index-r1.js
          grep -Fq 'oras-toolbar' oras-master-index-r1.js
          grep -Fq "id:'canonica'" oras-master-index-r1.js
          grep -Fq 'el-espejo-soundtrack.js?v=20261014-espejo-soundtrack-3' ceniciento/index.html
          grep -Fq "VERSION='20261020-ana-voice-owner-r22'" oras-reading-window-r3.js
          echo 'PASS: núcleo ORAS, ANA r37 + interrogante R1 r39 y entrada Ceniciento r38 disponibles.'

      - name: Preparar voz de Ceniciento
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts = sorted(Path('ceniciento/voz-parts').glob('*.bin'))
          if len(parts) != 14:
              raise RuntimeError('Faltan partes de la voz de Ceniciento')
          audio = b''.join(part.read_bytes() for part in parts)
          if hashlib.sha256(audio).hexdigest() != '5bf334d4dcfcffa240d455719795ee9687293395467b93b220219fb8b158d55b':
              raise RuntimeError('La grabación no coincide con el audio completo')
          Path('ceniciento/ceniciento-voz-completa.mp3').write_bytes(audio)
          PY

      - name: Replicar voz en la edición internacional
        run: |
          if [ -d nmwp-international/ceniciento ]; then
            cp ceniciento/ceniciento-voz-completa.mp3 nmwp-international/ceniciento/ceniciento-voz-completa.mp3
          fi

      - name: Preparar ANA estable para Edge
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y ffmpeg; }

          ffmpeg -hide_banner -loglevel error -y \
            -i elegia-breve/recitado.m4a \
            -f lavfi -t 12 -i anullsrc=r=44100:cl=stereo \
            -filter_complex "[0:a]aformat=sample_rates=44100:channel_layouts=stereo[a0];[1:a]aformat=sample_rates=44100:channel_layouts=stereo[a1];[a0][a1]concat=n=2:v=0:a=1[out]" \
            -map "[out]" -codec:a libmp3lame -q:a 2 \
            elegia-breve/recitado-edge-r37.mp3
          test -s elegia-breve/recitado-edge-r37.mp3

          ffmpeg -hide_banner -loglevel error -y \
            -i elegia-breve/ana-klaudya-fotografia.jpg \
            -vf scale=900:-2 -q:v 3 \
            elegia-breve/ana-klaudya-fotografia-edge-r37.jpg
          test -s elegia-breve/ana-klaudya-fotografia-edge-r37.jpg

          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'src="recitado(?:-edge-r\d+\.mp3\?v=[^"]+|\.m4a)"', 'src="recitado-edge-r37.mp3?v=20261021-r37"', s)
          s=re.sub(r'src="ana-klaudya-fotografia(?:-edge-r\d+\.jpg\?v=[^"]+|\.jpg)"', 'src="ana-klaudya-fotografia-edge-r37.jpg?v=20261021-r37"', s)
          s=re.sub(r'oras-reading-window-r2\.js\?v=[^"\']+', 'oras-reading-window-r3.js?v=20261021-ana-r37', s)
          s=re.sub(r'<script src="/solo-la-tarjeta/ana-final-r\d+\.js\?v=[^"]+"></script>\s*', '', s)
          s=s.replace('</body>','<script src="/solo-la-tarjeta/ana-final-r37.js?v=20261021-ana-final-r37"></script>\n<script src="/solo-la-tarjeta/ana-final-r39.js?v=20261021-ana-question-r1"></script>\n</body>')
          p.write_text(s,encoding='utf-8')

          c=Path('ceniciento/index.html')
          t=c.read_text(encoding='utf-8')
          t=re.sub(r'<script src="/solo-la-tarjeta/ceniciento-entry-r\d+\.js\?v=[^"]+"></script>\s*', '', t)
          t=t.replace('</body>','<script src="/solo-la-tarjeta/ceniciento-entry-r38.js?v=20261021-ceniciento-r38"></script>\n</body>')
          c.write_text(t,encoding='utf-8')
          PY
          grep -Fq 'recitado-edge-r37.mp3?v=20261021-r37' elegia-breve/index.html
          grep -Fq 'ana-klaudya-fotografia-edge-r37.jpg?v=20261021-r37' elegia-breve/index.html
          grep -Fq 'oras-reading-window-r3.js?v=20261021-ana-r37' elegia-breve/index.html
          grep -Fq 'ana-final-r37.js?v=20261021-ana-final-r37' elegia-breve/index.html
          grep -Fq 'ana-final-r39.js?v=20261021-ana-question-r1' elegia-breve/index.html
          grep -Fq 'ceniciento-entry-r38.js?v=20261021-ceniciento-r38' ceniciento/index.html
          ! grep -Fq 'ana-final-r36.js' elegia-breve/index.html

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
