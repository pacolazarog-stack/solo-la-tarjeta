name: Publicar SOLO LA TARJETA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Verificar núcleo ORAS
        shell: bash
        run: |
          set -euo pipefail
          node --check narrative-universe.js
          node --check oras-reading-window-r2.js
          node --check oras-master-index-r1.js
          node --check oras-screen-transition.js
          node --check ceniciento/el-espejo.js
          node --check ceniciento/el-espejo-soundtrack.js
          test -s assets/oras-portada-final.jpg
          test -s assets/oras-espejo-centro-datos.b64
          grep -Fq 'assets/oras-portada-final.jpg' oras-master-index-r1.js
          grep -Fq 'oras-master-cover-img{display:block' oras-master-index-r1.js
          echo 'PASS: núcleo ORAS, portada y banda sonora de EL ESPEJO disponibles.'

      - name: Preparar voz de Ceniciento
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts = sorted(Path('ceniciento/voz-parts').glob('*.bin'))
          if len(parts) != 14:
              raise RuntimeError('Faltan partes de la voz de Ceniciento')
          audio = b''.join(part.read_bytes() for part in parts)
          if hashlib.sha256(audio).hexdigest() != '5bf334d4dcfcffa240d455719795ee9687293395467b93b220219fb8b158d55b':
              raise RuntimeError('La grabación no coincide con el audio completo')
          Path('ceniciento/ceniciento-voz-completa.mp3').write_bytes(audio)
          PY

      - name: Replicar voz en la edición internacional
        run: |
          if [ -d nmwp-international/ceniciento ]; then
            cp ceniciento/ceniciento-voz-completa.mp3 nmwp-international/ceniciento/ceniciento-voz-completa.mp3
          fi

      - name: Preparar música de EL ESPEJO
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          src=Path('assets/oras-espejo-centro-datos.b64').read_text().strip()
          src=''.join(src.split())
          src += '=' * ((4-len(src)%4)%4)
          audio=base64.b64decode(src, validate=False)
          if len(audio) < 800000:
              raise RuntimeError(f'La música reconstruida está incompleta: {len(audio)} bytes')
          Path('assets/oras-espejo-centro-datos.mp3').write_bytes(audio)
          print(f'Música de EL ESPEJO reconstruida: {len(audio)} bytes')
          PY
          test -s assets/oras-espejo-centro-datos.mp3

      - name: Incrustar controlador musical de EL ESPEJO
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ceniciento/index.html')
          s=p.read_text()
          tag='<script data-oras-mirror-soundtrack="v2" src="/solo-la-tarjeta/ceniciento/el-espejo-soundtrack.js?v=20261014-espejo-soundtrack-2"></script>'
          if tag not in s:
              needle='<script data-oras-mirror="true" src="el-espejo.js?v=20261014-persistent-reading-2"></script>'
              if needle not in s:
                  raise RuntimeError('No se encontró el cargador canónico de EL ESPEJO')
              s=s.replace(needle, needle+'\n'+tag, 1)
              p.write_text(s)
          PY
          grep -Fq 'el-espejo-soundtrack.js?v=20261014-espejo-soundtrack-2' ceniciento/index.html

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
