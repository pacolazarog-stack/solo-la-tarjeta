# EL ESPEJO · banda sonora canónica v3 · ANA pulses-photo restore v2 · ORAS nacre roulette r1 · ANA entry failsafe r1 · preview limpio escenas ANA+SOLO+CENICIENTO r3
name: Publicar SOLO LA TARJETA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Verificar núcleo ORAS
        shell: bash
        run: |
          set -euo pipefail
          node --check narrative-universe.js
          node --check oras-reading-window-r2.js
          node --check oras-master-index-r1.js
          node --check oras-screen-transition.js
          node --check oras-nacre-roulette-r1.js
          node --check ana-entry-failsafe-r1.js
          node --check ceniciento/el-espejo.js
          node --check ceniciento/el-espejo-soundtrack.js
          test -s assets/oras-portada-final.jpg
          test -s assets/oras-el-espejo-centro-de-datos.m4a
          test "$(wc -c < assets/oras-el-espejo-centro-de-datos.m4a)" -gt 800000
          grep -Fq 'assets/oras-portada-final.jpg' oras-master-index-r1.js
          grep -Fq 'oras-master-cover-img{display:block' oras-master-index-r1.js
          grep -Fq 'el-espejo-soundtrack.js?v=20261014-espejo-soundtrack-3' ceniciento/index.html
          echo 'PASS: núcleo ORAS, entrada ANA, ruleta de nácar y banda sonora de EL ESPEJO disponibles.'

      - name: Activar índice circular de nácar en todo ORAS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          tag='<script defer src="/solo-la-tarjeta/oras-nacre-roulette-r1.js?v=20261015-nacre-roulette-1"></script>'
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s=p.read_text(encoding='utf-8')
              if 'oras-master-index-r1.js' not in s:
                  continue
              if 'oras-nacre-roulette-r1.js' in s:
                  continue
              if '</body>' in s:
                  s=s.replace('</body>',tag+'\n</body>',1)
                  p.write_text(s,encoding='utf-8')
          PY
          grep -RFl 'oras-nacre-roulette-r1.js?v=20261015-nacre-roulette-1' --include='*.html' . | head -n 1 | grep -q .

      - name: Blindar entrada de ANA KLAUDYA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="/solo-la-tarjeta/ana-entry-failsafe-r1.js?v=20261015-ana-entry-failsafe-1"></script>'
          if 'ana-entry-failsafe-r1.js' not in s:
              if '</body>' not in s:
                  raise RuntimeError('No se encontró </body> en ANA KLAUDYA')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'ana-entry-failsafe-r1.js?v=20261015-ana-entry-failsafe-1' elegia-breve/index.html

      - name: Preparar voz de Ceniciento
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts = sorted(Path('ceniciento/voz-parts').glob('*.bin'))
          if len(parts) != 14:
              raise RuntimeError('Faltan partes de la voz de Ceniciento')
          audio = b''.join(part.read_bytes() for part in parts)
          if hashlib.sha256(audio).hexdigest() != '5bf334d4dcfcffa240d455719795ee9687293395467b93b220219fb8b158d55b':
              raise RuntimeError('La grabación no coincide con el audio completo')
          Path('ceniciento/ceniciento-voz-completa.mp3').write_bytes(audio)
          PY

      - name: Replicar voz en la edición internacional
        run: |
          if [ -d nmwp-international/ceniciento ]; then
            cp ceniciento/ceniciento-voz-completa.mp3 nmwp-international/ceniciento/ceniciento-voz-completa.mp3
          fi

      - name: Incorporar preview público de ORAS raíz limpia
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW='oras-raiz-limpia-preview'
          rm -rf "$PREVIEW"
          mkdir -p "$PREVIEW"
          git fetch --no-tags --depth=1 origin oras-raiz-limpia
          git archive FETCH_HEAD | tar -x -C "$PREVIEW"
          rm -rf "$PREVIEW/.github"
          if [ -f ceniciento/ceniciento-voz-completa.mp3 ]; then
            mkdir -p "$PREVIEW/ceniciento"
            cp ceniciento/ceniciento-voz-completa.mp3 "$PREVIEW/ceniciento/ceniciento-voz-completa.mp3"
          fi
          test -s "$PREVIEW/index.html"
          test -s "$PREVIEW/oras.js"
          test -s "$PREVIEW/core/reader.js"
          test -s "$PREVIEW/core/solo-scene.js"
          test -s "$PREVIEW/solo-scene.css"
          test -s "$PREVIEW/core/ana-scenes.js"
          test -s "$PREVIEW/ana-scenes.css"
          test -s "$PREVIEW/core/ceniciento.js"
          test -s "$PREVIEW/ceniciento-scene.css"
          echo 'PASS: preview ORAS raíz limpia incorporado sin sustituir main.'

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
