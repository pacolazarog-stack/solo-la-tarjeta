name: Publicar SOLO LA TARJETA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Verificar versión ORAS vigente
        shell: bash
        run: |
          set -euo pipefail
          node --check narrative-universe.js
          node --check oras-reading-window-r2.js
          node --check oras-master-index-r1.js
          node --check oras-screen-transition.js
          node --check ceniciento/el-espejo.js
          node --check inventario-del-aire/oras-expansion.js
          node --check inventario-del-aire/r8-canonical-headings.js
          node --check inventario-del-aire/oras-r9-echo-remap.js
          node --check inventario-del-aire/oras-general-progress-r1.js

          # Estado actual del contador e índice.
          grep -Fq "const VERSION='20261014-reading-counter-fix-1'" narrative-universe.js
          grep -Fq "oras-reading-window-r2.js?v=20261014-reading-window-4" index.html
          grep -Fq "oras-master-index-r1.js?v=20261014-master-index-8" oras-reading-window-r2.js
          grep -Fq "const VERSION='20261014-master-index-8'" oras-master-index-r1.js
          grep -Fq 'assets/oras-portada-final.jpg' oras-master-index-r1.js
          grep -Fq 'Abrir índice' oras-master-index-r1.js

          # Continuidad audiovisual y navegación.
          grep -Fq 'ORASScreenTransition' oras-screen-transition.js
          grep -Fq 'oras-screen-transition-veil' oras-screen-transition.js
          grep -Fq '#journeyNext' oras-screen-transition.js
          grep -Fq '.oras-ceniciento-mirror-gate button' oras-screen-transition.js
          grep -Fq '.oras-solo-mirror-gate button' oras-screen-transition.js
          grep -Fq '.oras-mirror-nav button' oras-screen-transition.js
          grep -Fq '.return-link' oras-screen-transition.js
          grep -Fq 'maintainSilence' ceniciento/el-espejo.js
          grep -Fq 'playMechanicalStep' ceniciento/el-espejo.js
          grep -Fq 'clearedPauses' ceniciento/el-espejo.js
          grep -Fq 'finalContinue.addEventListener' ceniciento/el-espejo.js
          ! grep -Fq "mark.textContent='flag'" ceniciento/el-espejo.js

          # Canon literario X–XIII y Cero.
          grep -Fq '## X. EL ARCHIVO PROFUNDO' EL_INVENTARIO_DEL_AIRE_TRILOGIA_CANONICA.md
          grep -Fq '## XI. LA MÁQUINA DE LAS HUELLAS' EL_INVENTARIO_DEL_AIRE_TRILOGIA_CANONICA.md
          grep -Fq '# ATLAS / AZAR' EL_INVENTARIO_DEL_AIRE_TRILOGIA_CANONICA.md
          grep -Fq '## XII. EL RESONADOR' EL_INVENTARIO_DEL_AIRE_TRILOGIA_CANONICA.md
          grep -Fq '## XIII. La última sala' EL_INVENTARIO_DEL_AIRE_TRILOGIA_CANONICA.md
          grep -Fq 'Allí donde ya no queda huella suficiente,' EL_INVENTARIO_DEL_AIRE_TRILOGIA_CANONICA.md

          ! grep -Fq 'Relato breve digital inmersivo' index.html
          echo 'PASS: ORAS actualizado, contador, índice, portada canónica y canon validados.'

      - name: Preparar voz de Ceniciento
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts = sorted(Path('ceniciento/voz-parts').glob('*.bin'))
          if len(parts) != 14:
              raise RuntimeError('Faltan partes de la voz de Ceniciento')
          audio = b''.join(part.read_bytes() for part in parts)
          if hashlib.sha256(audio).hexdigest() != '5bf334d4dcfcffa240d455719795ee9687293395467b93b220219fb8b158d55b':
              raise RuntimeError('La grabación no coincide con el audio completo')
          Path('ceniciento/ceniciento-voz-completa.mp3').write_bytes(audio)
          PY

      - name: Replicar voz en la edición internacional
        run: |
          if [ -d nmwp-international/ceniciento ]; then
            cp ceniciento/ceniciento-voz-completa.mp3 nmwp-international/ceniciento/ceniciento-voz-completa.mp3
          fi

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
