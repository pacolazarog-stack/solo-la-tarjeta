# ORAS · recorridos canónicos v1 · índice circular mejorado
name: Publicar SOLO LA TARJETA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Verificar núcleo ORAS
        shell: bash
        run: |
          set -euo pipefail
          node --check narrative-universe.js
          node --check oras-reading-window-r2.js
          node --check ana-final-r19.js
          node --check oras-master-index-r1.js
          node --check oras-screen-transition.js
          node --check ceniciento/el-espejo.js
          node --check ceniciento/el-espejo-soundtrack.js
          test -s assets/oras-portada-final.jpg
          test -s assets/oras-el-espejo-centro-de-datos.m4a
          test "$(wc -c < assets/oras-el-espejo-centro-de-datos.m4a)" -gt 800000
          grep -Fq 'assets/oras-portada-final.jpg' oras-master-index-r1.js
          grep -Fq 'Recorridos de lectura' oras-master-index-r1.js
          grep -Fq 'oras-toolbar' oras-master-index-r1.js
          grep -Fq "id:'canonica'" oras-master-index-r1.js
          grep -Fq 'el-espejo-soundtrack.js?v=20261014-espejo-soundtrack-3' ceniciento/index.html
          grep -Fq "VERSION='20261019-ana-final-photo-r17'" oras-reading-window-r2.js
          echo 'PASS: núcleo ORAS, runtime ANA y cierre r19 disponibles.'

      - name: Preparar voz de Ceniciento
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts = sorted(Path('ceniciento/voz-parts').glob('*.bin'))
          if len(parts) != 14:
              raise RuntimeError('Faltan partes de la voz de Ceniciento')
          audio = b''.join(part.read_bytes() for part in parts)
          if hashlib.sha256(audio).hexdigest() != '5bf334d4dcfcffa240d455719795ee9687293395467b93b220219fb8b158d55b':
              raise RuntimeError('La grabación no coincide con el audio completo')
          Path('ceniciento/ceniciento-voz-completa.mp3').write_bytes(audio)
          PY

      - name: Replicar voz en la edición internacional
        run: |
          if [ -d nmwp-international/ceniciento ]; then
            cp ceniciento/ceniciento-voz-completa.mp3 nmwp-international/ceniciento/ceniciento-voz-completa.mp3
          fi

      - name: Preparar ANA estable para Edge
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y ffmpeg; }

          ffmpeg -hide_banner -loglevel error -y \
            -i elegia-breve/recitado.m4a \
            -f lavfi -t 12 -i anullsrc=r=44100:cl=stereo \
            -filter_complex "[0:a]aformat=sample_rates=44100:channel_layouts=stereo[a0];[1:a]aformat=sample_rates=44100:channel_layouts=stereo[a1];[a0][a1]concat=n=2:v=0:a=1[out]" \
            -map "[out]" -codec:a libmp3lame -q:a 2 \
            elegia-breve/recitado-edge-r19.mp3
          test -s elegia-breve/recitado-edge-r19.mp3

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'src="recitado(?:-edge-r\d+\.mp3\?v=[^"]+|\.m4a)"', 'src="recitado-edge-r19.mp3?v=20261020-r19"', s)
          s=re.sub(r'oras-reading-window-r2\.js\?v=[^"\']+', 'oras-reading-window-r2.js?v=20261019-ana-final-photo-r17', s)
          s=s.replace(
              "recording.addEventListener('playing',startMix);",
              "recording.addEventListener('playing',()=>{if(!window.__orasDisableLegacyVoiceMix)startMix();});"
          )
          s=s.replace(
              "voicePlay.textContent='Pausar';voiceStatus.textContent='';startMix();",
              "voicePlay.textContent='Pausar';voiceStatus.textContent='';if(!window.__orasDisableLegacyVoiceMix)startMix();"
          )
          s=s.replace(
              "voiceAllowed=false;voicePlay.textContent='Activar voz';restoreAmbient();",
              "voiceAllowed=false;voicePlay.textContent='Activar voz';if(!window.__orasDisableLegacyVoiceMix)restoreAmbient();"
          )
          s=s.replace(
              "cancelVoiceStart();recording.pause();body.classList.remove('voice-open');restoreAmbient();",
              "cancelVoiceStart();recording.pause();body.classList.remove('voice-open');if(!window.__orasDisableLegacyVoiceMix)restoreAmbient();"
          )
          overlay='<script src="/solo-la-tarjeta/ana-final-r19.js?v=20261020-ana-final-r19"></script>'
          if overlay not in s:
              s=s.replace('</body>',overlay+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'recitado-edge-r19.mp3?v=20261020-r19' elegia-breve/index.html
          grep -Fq 'ana-final-r19.js?v=20261020-ana-final-r19' elegia-breve/index.html
          grep -Fq 'if(!window.__orasDisableLegacyVoiceMix)startMix()' elegia-breve/index.html

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
