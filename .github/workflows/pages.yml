name: Publicar SOLO LA TARJETA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Aplicar canon de ANA KLAUDYA
        run: python3 ana-klaudya/apply_canonical_site.py
      - name: Restaurar universo narrativo y aplicar disposición de controles
        run: |
          git show 80866cb8ae17d31356462edf408a4d7f099e1241:narrative-universe.js > narrative-universe.js
          python3 - <<'PY'
          from pathlib import Path

          p = Path('narrative-universe.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const VERSION='20261010-29';", "const VERSION='20261011-31';")
          s = s.replace(
              '.ou-card{position:fixed;z-index:74;left:max(26px,4.2vw);',
              '.ou-card{position:fixed;z-index:74;right:max(26px,4.2vw);left:auto;'
          )
          s = s.replace(
              '.ou-reading-checklist{position:fixed;z-index:90;right:max(10px,env(safe-area-inset-right));',
              '.ou-reading-checklist{position:fixed;z-index:90;left:max(10px,env(safe-area-inset-left));right:auto;'
          )
          s = s.replace(
              '.ou-reading-checklist ul{position:absolute;right:0;',
              '.ou-reading-checklist ul{position:absolute;left:0;right:auto;'
          )
          s = s.replace(
              '.ou-card{left:max(16px,env(safe-area-inset-left));bottom:calc(env(safe-area-inset-bottom,0px) + 88px);width:112px;height:70px}',
              '.ou-card{right:max(16px,env(safe-area-inset-right));left:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 88px);width:112px;height:70px}'
          )
          portrait = '''
  @media(max-width:700px) and (orientation:portrait){
    .ou-card{right:max(10px,env(safe-area-inset-right))!important;left:auto!important;bottom:calc(env(safe-area-inset-bottom,0px) + 10px)!important;width:94px!important;height:58px!important;transform:rotate(4deg)!important}
    .ou-card::before{left:13px!important;top:12px!important;width:23px!important;height:17px!important}.ou-card::after{left:13px!important;right:13px!important;bottom:11px!important}
    .ou-reading-checklist{left:max(10px,env(safe-area-inset-left))!important;right:auto!important;bottom:calc(env(safe-area-inset-bottom,0px) + 18px)!important}
    .ou-reading-checklist summary{margin-left:0!important;padding:5px 8px!important;border-color:rgba(255,255,255,.20)!important;background:rgba(12,12,12,.38)!important;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
    .ou-reading-checklist ul{left:0!important;right:auto!important}
  }
'''
          marker = '  @media(hover:none) and (pointer:coarse){'
          if portrait not in s:
              s = s.replace(marker, portrait + marker, 1)
          p.write_text(s, encoding='utf-8')

          q = Path('elegia-breve/index.html')
          t = q.read_text(encoding='utf-8')
          t = t.replace('narrative-universe.js?v=20261010-29', 'narrative-universe.js?v=20261011-31')
          t = t.replace('narrative-universe.js?v=20261011-30', 'narrative-universe.js?v=20261011-31')
          nav_anchor = '.journey-nav button[hidden]{display:none}\n'
          nav_portrait = '''@media(max-width:700px) and (orientation:portrait){
  .journey-nav{left:112px;right:112px;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:none;width:auto;max-width:none;height:48px;padding:0;border:0;border-top:1px solid rgba(255,250,241,.46);border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  .journey-nav button{min-width:0;min-height:48px;padding:7px 3px;border:0;border-radius:0;background:transparent;box-shadow:none;font-size:12px;text-shadow:0 1px 4px rgba(0,0,0,.9)}
  .journey-nav button+button{border-left:1px solid rgba(255,250,241,.26)}
}\n'''
          if nav_portrait not in t and nav_anchor in t:
              t = t.replace(nav_anchor, nav_anchor + nav_portrait, 1)
          q.write_text(t, encoding='utf-8')
          PY
      - name: Verificar progreso de lectura
        run: |
          node check-reading-progress.cjs
          node ceniciento/check-mirror.cjs
          node check-publication-loading.cjs
      - name: Preparar voz de Ceniciento
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts = sorted(Path('ceniciento/voz-parts').glob('*.bin'))
          if len(parts) != 14:
              raise RuntimeError('Faltan partes de la voz de Ceniciento')
          audio = b''.join(part.read_bytes() for part in parts)
          if hashlib.sha256(audio).hexdigest() != '5bf334d4dcfcffa240d455719795ee9687293395467b93b220219fb8b158d55b':
              raise RuntimeError('La grabación no coincide con el audio completo')
          Path('ceniciento/ceniciento-voz-completa.mp3').write_bytes(audio)
          PY
      - name: Replicar voz en la edición internacional
        run: |
          if [ -d nmwp-international/ceniciento ]; then
            cp ceniciento/ceniciento-voz-completa.mp3 nmwp-international/ceniciento/ceniciento-voz-completa.mp3
          fi
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
