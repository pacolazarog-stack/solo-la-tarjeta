name: Publicar SOLO LA TARJETA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar sincronización textual afinada
        env:
          CENICIENTO_PAGE_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-0d6c-820a-9d60-5b931da85785/raw?se=2026-10-05T00%3A55%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=c8e3e896-509b-59c6-9c93-bafdb31b964a&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T03%3A25%3A11Z&ske=2026-10-05T03%3A25%3A11Z&sks=b&skv=2026-02-06&sig=XZK6t%2BilvTLssuhS7tOSimge7OS7AHLbM4vretuub9I%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output ceniciento/index.html "$CENICIENTO_PAGE_URL"
          test "$(wc -c < ceniciento/index.html)" -eq 21734
          grep -q "Ella asintió','Ella removió el café" ceniciento/index.html
          grep -q "Ella dio un paso','La luz blanca del interior permanecía encendida" ceniciento/index.html
          grep -q "CENICIENTO_completo.m4a" ceniciento/index.html
          ! grep -q "aidocmaker" ceniciento/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ceniciento/index.html
          git commit -m "Afinar karaoke con los cortes reales del audio" || true
          git push
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
