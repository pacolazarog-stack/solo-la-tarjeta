name: Publicar SOLO LA TARJETA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Aplicar canon de ANA KLAUDYA
        run: python3 ana-klaudya/apply_canonical_site.py

      - name: Restaurar universo narrativo estable
        run: git show 80866cb8ae17d31356462edf408a4d7f099e1241:narrative-universe.js > narrative-universe.js

      - name: Aplicar disposición de controles
        run: python3 patch-mobile-layout.py

      - name: Exigir lectura integral de ANA KLAUDYA
        run: python3 patch-ana-composite-progress.py

      - name: Comunicar lectura de Tu cabello y Tu piel
        run: python3 patch-ana-detail-progress-bridge.py

      - name: Hacer navegable la barra de lecturas
        run: python3 patch-checklist-navigation.py

      - name: Encadenar Flores con EL ESPEJO cuando ANA completa 3/3
        run: python3 patch-ana-third-mirror-gate.py

      - name: Unificar navegación final de SOLO LA TARJETA
        run: python3 patch-solo-endnav.py

      - name: Eliminar duplicados de SOLO LA TARJETA y CENICIENTO en el índice
        run: python3 patch-index-deduplicate-related.py

      - name: Exigir cierre completo de SOLO antes de EL ESPEJO
        run: python3 patch-solo-ceniciento-mirror-gate.py

      - name: Forzar visibilidad del verso final de SOLO
        run: python3 patch-solo-final-verse-visible.py

      - name: Forzar versión vigente y verificar motivos del índice
        run: python3 patch-index-version-42.py

      - name: Mejorar contraste de A fuego lento
        run: python3 patch-a-fuego-contrast.py

      - name: Ocultar invitación flotante redundante al epílogo
        run: python3 patch-hide-epilogue-invitation.py

      - name: Forzar letras blancas en Leer con pausa
        run: python3 patch-read-pause-contrast.py

      - name: Reforzar contraste de PAUSAR y VOLVER
        run: python3 patch-voice-dialog-contrast.py

      - name: Cerrar EL ESPEJO con flag y flores
        run: python3 patch-mirror-finale.py

      - name: Eliminar Índice de la pantalla final flag
        run: python3 patch-remove-final-index.py

      - name: Unificar controles finales de CENICIENTO
        run: python3 patch-ceniciento-finale-controls.py

      - name: Compatibilizar navegación final de CENICIENTO con las pruebas
        run: python3 patch-ceniciento-finale-test-compat.py

      - name: Eliminar salidas heredadas de CENICIENTO
        run: python3 patch-ceniciento-remove-legacy-exits.py

      - name: Añadir transición y bloqueos de lectura de EL ESPEJO
        run: python3 patch-ceniciento-mirror-reading-gates.py

      - name: Blindar las pausas de EL ESPEJO contra bucles
        run: python3 patch-mirror-pause-loop-hardfix.py

      - name: Enlazar ? con CENICIENTO y tarjeta con SOLO LA TARJETA
        run: python3 patch-mirror-finale-direct-links.py

      - name: Exigir acción explícita para entrar en EL ESPEJO
        run: python3 patch-mirror-explicit-entry.py

      - name: Devolver Salir a la página de origen
        run: python3 patch-exit-return-source.py

      - name: Mantener letras blancas en controles oscuros
        run: python3 patch-dark-controls-white-text.py

      - name: Mantener siempre visible el contador de lecturas
        run: python3 patch-reading-counter-always-visible.py

      - name: Reducir navegación a Atrás y Adelante
        run: python3 patch-two-button-navigation.py

      - name: Aplicar cierre desnudo de EL ESPEJO
        run: python3 patch-mirror-minimal-return.py

      - name: Verificar progreso de lectura
        run: |
          node --check narrative-universe.js
          node --check ceniciento/el-espejo.js
          node check-ana-composite.cjs
          node ceniciento/check-mirror.cjs
          node check-publication-loading.cjs

      - name: Preparar voz de Ceniciento
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts = sorted(Path('ceniciento/voz-parts').glob('*.bin'))
          if len(parts) != 14:
              raise RuntimeError('Faltan partes de la voz de Ceniciento')
          audio = b''.join(part.read_bytes() for part in parts)
          if hashlib.sha256(audio).hexdigest() != '5bf334d4dcfcffa240d455719795ee9687293395467b93b220219fb8b158d55b':
              raise RuntimeError('La grabación no coincide con el audio completo')
          Path('ceniciento/ceniciento-voz-completa.mp3').write_bytes(audio)
          PY

      - name: Replicar voz en la edición internacional
        run: |
          if [ -d nmwp-international/ceniciento ]; then
            cp ceniciento/ceniciento-voz-completa.mp3 nmwp-international/ceniciento/ceniciento-voz-completa.mp3
          fi

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
