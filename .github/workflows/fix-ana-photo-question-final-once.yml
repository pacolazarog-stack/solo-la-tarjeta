name: ANA final rescue r9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ana-photo-question-final-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar rescate final r9
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if(remaining<=.55){finalizeBeforeEdgeEOF();return;}","if(remaining<=1.50){finalizeBeforeEdgeEOF();return;}")
          s=s.replace("Math.max(0,(remaining-.42)*1000)","Math.max(0,(remaining-1.30)*1000)")
          s=s.replace("duration-recording.currentTime<=.55","duration-recording.currentTime<=1.50")
          marker="""      recording.addEventListener('timeupdate',()=>{\n        if(body.dataset.anaFinalDone==='1')return;\n        const duration=recording.duration;\n        if(Number.isFinite(duration)&&duration>0&&duration-recording.currentTime<=1.50)finalizeBeforeEdgeEOF();\n      });"""
          watchdog="""
      let anaLastMediaTime=0;
      let anaLastAdvanceAt=performance.now();
      const resetAnaFinalWatch=()=>{
        anaLastMediaTime=recording.currentTime||0;
        anaLastAdvanceAt=performance.now();
      };
      recording.addEventListener('play',resetAnaFinalWatch);
      recording.addEventListener('seeked',resetAnaFinalWatch);
      setInterval(()=>{
        if(body.dataset.anaFinalDone==='1'||recording.seeking)return;
        const duration=recording.duration;
        const now=performance.now();
        const current=recording.currentTime||0;
        if(current>anaLastMediaTime+.02){anaLastMediaTime=current;anaLastAdvanceAt=now;}
        if(!Number.isFinite(duration)||duration<=0)return;
        const remaining=duration-current;
        if(remaining<=1.50 || (remaining<=5 && now-anaLastAdvanceAt>=650) || recording.ended || current>=duration-.05)finalizeBeforeEdgeEOF();
      },100);
"""
          if 'anaLastAdvanceAt=performance.now()' not in s:
              if marker not in s: raise SystemExit('No se encontró el punto de inserción r9')
              s=s.replace(marker,marker+watchdog,1)
          old="""        if(voiceDialog){voiceDialog.style.display='none';voiceDialog.setAttribute('aria-hidden','true');}"""
          new="""        if(voiceDialog){\n          try{if(voiceDialog.open)voiceDialog.close();}catch(_){}\n          voiceDialog.style.display='none';\n          voiceDialog.setAttribute('aria-hidden','true');\n        }\n        try{recording.pause();recording.removeAttribute('controls');}catch(_){}"""
          if old in s:s=s.replace(old,new,1)
          for oldv in ['20261018-photo-question-final-1','20261018-photo-question-final-2','20261018-photo-question-final-3']:
              s=s.replace(oldv,'20261018-ana-final-rescue-r9')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'anaLastAdvanceAt=performance.now()' elegia-breve/index.html
          grep -q 'remaining<=1.50' elegia-breve/index.html
          grep -q 'recording.removeAttribute' elegia-breve/index.html
          grep -q '20261018-ana-final-rescue-r9' elegia-breve/index.html
      - name: Guardar parche
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elegia-breve/index.html
          git commit -m 'ANA: instala rescate final r9' || exit 0
          git push
