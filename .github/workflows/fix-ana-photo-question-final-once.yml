name: Corrige final ANA antes de EOF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ana-photo-question-final-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evitar el bloqueo de Edge en el último instante del audio
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          old="""      const ensureFinalAtMediaEnd=()=>{\n        if(body.dataset.anaFinalDone==='1')return;\n        const duration=recording.duration;\n        if(Number.isFinite(duration)&&duration>0&&recording.currentTime>=duration-.35){\n          finishVoicePass();\n          voiceAllowed=false;voicePlay.textContent='Volver a escuchar';\n          voiceStatus.textContent='Fin de la grabación.';\n        }\n      };\n      recording.addEventListener('timeupdate',ensureFinalAtMediaEnd);\n      recording.addEventListener('pause',ensureFinalAtMediaEnd);"""
          new="""      let anaPreEndTimer=null;\n      const finalizeBeforeEdgeEOF=()=>{\n        if(body.dataset.anaFinalDone==='1')return;\n        clearTimeout(anaPreEndTimer);anaPreEndTimer=null;\n        try{if(!recording.paused)recording.pause();}catch(_){}\n        finishVoicePass();\n        voiceAllowed=false;voicePlay.textContent='Volver a escuchar';\n        voiceStatus.textContent='Fin de la grabación.';\n      };\n      const armAnaPreEnd=()=>{\n        clearTimeout(anaPreEndTimer);anaPreEndTimer=null;\n        if(body.dataset.anaFinalDone==='1'||recording.paused)return;\n        const duration=recording.duration;\n        if(!Number.isFinite(duration)||duration<=0)return;\n        const remaining=Math.max(0,duration-recording.currentTime);\n        if(remaining<=.55){finalizeBeforeEdgeEOF();return;}\n        anaPreEndTimer=setTimeout(finalizeBeforeEdgeEOF,Math.max(0,(remaining-.42)*1000));\n      };\n      recording.addEventListener('playing',armAnaPreEnd);\n      recording.addEventListener('seeked',armAnaPreEnd);\n      recording.addEventListener('durationchange',armAnaPreEnd);\n      recording.addEventListener('timeupdate',()=>{\n        if(body.dataset.anaFinalDone==='1')return;\n        const duration=recording.duration;\n        if(Number.isFinite(duration)&&duration>0&&duration-recording.currentTime<=.55)finalizeBeforeEdgeEOF();\n      });"""
          if old not in s:
              raise SystemExit('No se encontró el detector final anterior')
          s=s.replace(old,new,1)
          s=s.replace('oras-reading-window-r2.js?v=20261018-photo-question-final-1','oras-reading-window-r2.js?v=20261018-photo-question-final-2')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'finalizeBeforeEdgeEOF' elegia-breve/index.html
          grep -q '20261018-photo-question-final-2' elegia-breve/index.html
      - name: Guardar y publicar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elegia-breve/index.html
          git commit -m 'ANA: finaliza antes del EOF para evitar bloqueo de Edge'
          git push
          sleep 3
          gh workflow run pages.yml --ref main
