name: Fix ANA pulse and portrait final r2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ana-pulse-portrait-final-r2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore live pulse and robust portrait
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Reading window: never freeze ANA's visual world or portrait.
          p=Path('oras-reading-window-r2.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'body\.oras-ana-static-final \.portrait-finale,body\.oras-ana-static-final \.portrait-finale \*\{[^}]*\}\nbody\.oras-ana-static-final \.portrait-finale img\{[^}]*\}\nbody\.oras-ana-static-final #journeyNav,body\.oras-ana-static-final #journeyNav button,body\.oras-ana-static-final \.portrait-question,body\.oras-ana-static-final \.ou-reading-window-r2,body\.oras-ana-static-final #orasSunoVolume\{[^}]*\}\nbody\.oras-ana-static-final #journeyNav\{[^}]*\}\n','',s,count=1)
          old="""  if(path.endsWith('/elegia-breve')){\n    const stabilize=()=>{\n      const b=document.body;if(!b)return;\n      if(b.classList.contains('portrait-revealed')){\n        b.classList.add('oras-ana-static-final');\n        completeAnaPart('elegia');\n        \n      }\n    };\n    new MutationObserver(stabilize).observe(document.body,{attributes:true,attributeFilter:['class']});\n    stabilize();\n  }"""
          new="""  if(path.endsWith('/elegia-breve')){\n    const markElegia=()=>{\n      const b=document.body;if(!b)return;\n      if(b.classList.contains('portrait-revealed')) completeAnaPart('elegia');\n    };\n    new MutationObserver(markElegia).observe(document.body,{attributes:true,attributeFilter:['class']});\n    markElegia();\n  }"""
          if old in s:s=s.replace(old,new,1)
          s=s.replace("const VERSION='20261013-ana-portrait-prev-next-1';","const VERSION='20261015-ana-live-pulse-portrait-1';")
          p.write_text(s,encoding='utf-8')

          # Global volume: remove the ANA final-freeze helper completely.
          p=Path('oras-suno-volume-r1.js')
          s=p.read_text(encoding='utf-8')
          start=s.find("/* Salvaguarda de ANA KLAUDYA")
          end=s.find("const STORE='oras.master.volume.v1';")
          if start!=-1 and end!=-1 and end>start:
              prefix=s[:start]
              # Keep only the publication gate safeguard, not any visual freezing.
              guard="""/* ANA KLAUDYA: release only the publication gate; never freeze visual pulses. */\nconst IS_ANA=location.pathname.includes('/elegia-breve/');\nif(IS_ANA){\n  const releaseAnaGate=()=>document.documentElement.classList.remove('publication-pending');\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(releaseAnaGate,120),{once:true});\n  else setTimeout(releaseAnaGate,120);\n  setTimeout(releaseAnaGate,1800);\n}\n\n"""
              s=prefix+guard+s[end:]
          p.write_text(s,encoding='utf-8')

          # ANA: strengthen pulse visibility and make portrait reveal fail-safe without blanking the page.
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          if 'ANA_LIVE_PULSE_PORTRAIT_R2' not in s:
              css="""\n<style id=\"ANA_LIVE_PULSE_PORTRAIT_R2\">\n/* Keep the final heartbeat alive and visible. */\nbody.reading-ready .pulse-field{animation:pulseField var(--pulse-duration) linear infinite!important;will-change:opacity,filter!important}\nbody.reading-ready .pulse-field::before{animation:pulseA var(--pulse-duration) ease-in-out infinite!important}\nbody.reading-ready .pulse-field::after{animation:pulseB var(--pulse-duration) ease-in-out infinite!important}\nbody.portrait-revealed .portrait-finale{opacity:1!important;visibility:visible!important;background:#1b1711!important}\nbody.portrait-revealed .portrait-finale img{opacity:1!important;visibility:visible!important}\n</style>\n"""
              s=s.replace('</head>',css+'</head>',1)

          marker="""          portraitFinale.setAttribute('aria-hidden','false');\n          body.classList.add('portrait-revealed');"""
          replacement="""          portraitFinale.setAttribute('aria-hidden','false');\n          portraitFinale.style.visibility='visible';\n          portraitFinale.style.opacity='1';\n          portraitFinale.style.background='#1b1711';\n          anaPortrait.style.visibility='visible';\n          anaPortrait.style.opacity='1';\n          body.classList.remove('oras-ana-static-final');\n          body.classList.add('portrait-revealed');"""
          if marker in s and "portraitFinale.style.visibility='visible'" not in s:
              s=s.replace(marker,replacement,1)

          # Add a final watchdog immediately after the canonical 6-second reveal timer is armed.
          needle="""          finalPortraitTimer=setTimeout(()=>{\n            finalPortraitTimer=null;\n            if(cenicientoFrame.hidden && body.classList.contains('reading-ready'))revealPortrait();\n          },6000);"""
          watchdog="""          finalPortraitTimer=setTimeout(()=>{\n            finalPortraitTimer=null;\n            if(cenicientoFrame.hidden && body.classList.contains('reading-ready'))revealPortrait();\n          },6000);\n          setTimeout(()=>{\n            if(!cenicientoFrame.hidden || !body.classList.contains('reading-ready'))return;\n            revealPortrait();\n            if(body.classList.contains('portrait-revealed')){\n              portraitFinale.style.visibility='visible';\n              portraitFinale.style.opacity='1';\n              anaPortrait.style.visibility='visible';\n              anaPortrait.style.opacity='1';\n            }\n          },9000);"""
          if needle in s and 'setTimeout(()=>{\n            if(!cenicientoFrame.hidden' not in s:
              s=s.replace(needle,watchdog,1)

          # Fresh cache for global helpers.
          s=s.replace('oras-reading-window-r2.js?v=20261015-reading-stable-2','oras-reading-window-r2.js?v=20261015-ana-live-pulse-portrait-1')
          s=re.sub(r'oras-suno-volume-r1\.js\?v=[^"\'<>\s]+','oras-suno-volume-r1.js?v=20261015-suno-volume-9',s)
          p.write_text(s,encoding='utf-8')

          # Bump helper URLs across the site so stale freeze code cannot survive.
          for h in Path('.').rglob('*.html'):
              if '.git' in h.parts: continue
              t=h.read_text(encoding='utf-8')
              t=re.sub(r'oras-reading-window-r2\.js\?v=[^"\'<>\s]+','oras-reading-window-r2.js?v=20261015-ana-live-pulse-portrait-1',t)
              t=re.sub(r'oras-suno-volume-r1\.js\?v=[^"\'<>\s]+','oras-suno-volume-r1.js?v=20261015-suno-volume-9',t)
              h.write_text(t,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check oras-reading-window-r2.js
          node --check oras-suno-volume-r1.js
          grep -Fq 'ANA_LIVE_PULSE_PORTRAIT_R2' elegia-breve/index.html
          grep -Fq "portraitFinale.style.visibility='visible'" elegia-breve/index.html
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elegia-breve/index.html oras-reading-window-r2.js oras-suno-volume-r1.js '*.html' '**/*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ANA KLAUDYA: mantiene pulsos vivos y asegura el retrato final"
          git push
