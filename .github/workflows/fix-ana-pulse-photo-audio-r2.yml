# trigger 2026-10-15
name: Fix ANA pulse photo audio R2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ana-pulse-photo-audio-r2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix ANA pulse portrait and audio cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')

          css='''\n<style id="oras-ana-pulse-portrait-r2">\n/* Pulso canónico: siempre vivo, ligero y sin filtros de pantalla completa. */\n.pulse-field{animation:orasPulseField 1.85s ease-in-out infinite!important;animation-play-state:running!important;filter:none!important;will-change:opacity,transform!important}\n.pulse-field::before{animation:orasPulseA 1.85s ease-in-out infinite!important;animation-play-state:running!important}\n.pulse-field::after{animation:orasPulseB 1.85s ease-in-out infinite!important;animation-play-state:running!important}\nbody.eyes-open .pulse-field,body.eyes-open .pulse-field::before,body.eyes-open .pulse-field::after{animation-play-state:running!important}\n@keyframes orasPulseField{0%,100%{opacity:.40;transform:scale(1)}10%{opacity:.82;transform:scale(1.018)}18%{opacity:.48;transform:scale(1.004)}33%{opacity:.72;transform:scale(1.013)}44%{opacity:.43;transform:scale(1)}}\n@keyframes orasPulseA{0%,100%{opacity:.24;transform:scale(1)}10%{opacity:.62;transform:scale(1.035)}18%{opacity:.30;transform:scale(1.008)}33%{opacity:.52;transform:scale(1.025)}44%{opacity:.26;transform:scale(1)}}\n@keyframes orasPulseB{0%,100%{opacity:.15;transform:scale(1.006)}10%{opacity:.42;transform:scale(1.05)}18%{opacity:.19;transform:scale(1.012)}33%{opacity:.34;transform:scale(1.038)}44%{opacity:.17;transform:scale(1.006)}}\nbody.portrait-revealed .portrait-finale{opacity:1!important;visibility:visible!important}\nbody.portrait-revealed .portrait-finale img{opacity:1!important;visibility:visible!important;filter:none!important}\nbody.portrait-revealed .portrait-image-area,body.portrait-revealed .portrait-image-wrap{opacity:1!important;visibility:visible!important}\n</style>\n'''
          if 'oras-ana-pulse-portrait-r2' not in s:
              s=s.replace('</head>',css+'</head>',1)

          pattern=r"const revealPortrait=\(\)=>\{.*?\n      \};\n      let mixContext="
          replacement="""const revealPortrait=()=>{\n        if(body.classList.contains('portrait-revealed')) return;\n        portraitRequested=true;\n        clearTimeout(portraitRevealTimer);\n        body.classList.remove('oras-ana-static-final');\n        portraitFinale.setAttribute('aria-hidden','false');\n        portraitFinale.style.opacity='1';\n        portraitFinale.style.visibility='visible';\n        anaPortrait.loading='eager';\n        anaPortrait.decoding='async';\n        anaPortrait.style.opacity='1';\n        anaPortrait.style.visibility='visible';\n        body.classList.add('portrait-revealed');\n        anaNavigation.hidden=true;\n        body.classList.remove('ana-navigation-ready');\n        const finalJourneyNav=document.getElementById('journeyNav');\n        setJourney('elegia');\n        if(finalJourneyNav)finalJourneyNav.hidden=false;\n        if(!anaPortrait.complete || !anaPortrait.naturalWidth){\n          const raw=anaPortrait.getAttribute('src')||'ana-klaudya-fotografia.jpg';\n          anaPortrait.src=raw.split('?')[0]+'?v=20261015-portrait-r2';\n        }\n        portraitRevealTimer=setTimeout(()=>{\n          if(!body.classList.contains('portrait-revealed') || !cenicientoFrame.hidden)return;\n          questionGrowthActive=true;\n          anaNavigation.hidden=false;\n          body.classList.add('ana-navigation-ready');\n        },25000);\n      };\n      let mixContext="""
          ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise RuntimeError(f'No se pudo sustituir revealPortrait: {n}')
          s=ns
          s=s.replace('body.eyes-open *,body.eyes-open *::before,body.eyes-open *::after{animation-play-state:paused!important}',
                      'body.eyes-open .portrait-finale *,body.eyes-open .portrait-finale *::before,body.eyes-open .portrait-finale *::after{animation-play-state:paused!important}')
          if 'rel="preload" as="image" href="ana-klaudya-fotografia.jpg"' not in s:
              s=s.replace('<title>ANA KLAUDYA</title>','<title>ANA KLAUDYA</title>\n  <link rel="preload" as="image" href="ana-klaudya-fotografia.jpg">',1)
          p.write_text(s,encoding='utf-8')

          for h in Path('.').rglob('*.html'):
              if '.git' in h.parts: continue
              t=h.read_text(encoding='utf-8')
              t=re.sub(r'oras-suno-volume-r1\.js\?v=[^"\'<>\s]+','oras-suno-volume-r1.js?v=20261015-suno-volume-9',t)
              h.write_text(t,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check oras-suno-volume-r1.js
          grep -Fq 'oras-ana-pulse-portrait-r2' elegia-breve/index.html
          grep -Fq '20261015-portrait-r2' elegia-breve/index.html
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elegia-breve/index.html oras-suno-volume-r1.js '*.html' '**/*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ANA KLAUDYA: restaura pulso continuo, retrato final y audio"
          git push
