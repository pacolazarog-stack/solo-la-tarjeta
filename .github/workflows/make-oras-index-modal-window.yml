name: Aplicar arquitectura emocional definitiva ORAS

on:
  push:
    paths:
      - '.github/workflows/make-oras-index-modal-window.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar arquitectura emocional definitiva
        run: python scripts/apply_oras_final_architecture.py

      - name: Validar
        run: |
          node --check oras-master-index-r1.js
          node --check inventario-del-aire/r8-canonical-headings.js
          grep -Fq "IV · EL ARCHIVERO" oras-master-index-r1.js
          grep -Fq "V · EL CERO" oras-master-index-r1.js
          grep -Fq "Documento recuperado del Archivo Profundo" oras-master-index-r1.js
          grep -Fq "placeAtlasAfterLastRoom" inventario-del-aire/r8-canonical-headings.js
          grep -Fq "Nadie supo decir desde cuándo." ORAS_CANON_NAVEGACION_Y_ESPEJO_R1.md

      - name: Commit y publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oras-master-index-r1.js inventario-del-aire/r8-canonical-headings.js inventario-del-aire/index.html ORAS_CANON_NAVEGACION_Y_ESPEJO_R1.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ORAS: fija la arquitectura emocional definitiva"
          git pull --rebase origin main
          git push
