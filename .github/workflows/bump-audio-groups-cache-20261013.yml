name: Actualizar cache de grupos sonoros

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sincronizar con main
        run: git pull --ff-only origin main
      - name: Cambiar versión audiovisual
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='20261012-music-portrait-flow-1'
          new='20261013-audio-groups-1'
          changed=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              if p.suffix.lower() not in {'.html','.js','.md','.txt'}:
                  continue
              try:
                  s=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if old not in s:
                  continue
              p.write_text(s.replace(old,new),encoding='utf-8')
              changed.append(str(p))
          print('\n'.join(changed) if changed else 'Sin referencias antiguas')
          PY
      - name: Guardar refresco
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Refresca cache para la lógica de grupos sonoros"
          git push origin main
