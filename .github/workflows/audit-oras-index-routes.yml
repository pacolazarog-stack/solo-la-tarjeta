name: Auditar destinos del índice ORAS

# Auditoría canónica de rutas del índice ORAS.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corregir destinos canónicos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(text, old, new, label):
              if old in text:
                  return text.replace(old, new)
              if new in text:
                  return text
              raise RuntimeError(f'No se encontró patrón para {label}')

          # 1) Índice maestro: ningún acceso directo a CENICIENTO.
          p = Path('oras-master-index-r1.js')
          s = p.read_text(encoding='utf-8')
          s = replace_required(s,
              "const VERSION='20261014-master-index-9';",
              "const VERSION='20261014-master-index-10';",
              'versión del índice')
          s = replace_required(s,
              ".oras-mi-card.is-locked{opacity:.46}",
              ".oras-mi-card.is-locked{opacity:.46}.oras-mi-card.is-locked .oras-mi-card-action{pointer-events:none;cursor:default}",
              'bloqueo real de tarjetas')
          s = replace_required(s,
              "!cen&&`${ROOT}/ceniciento/`,",
              "!cen&&`${ROOT}/elegia-breve/#epilogo`,",
              'continuación hacia el interrogante de Ceniciento')
          s = replace_required(s,
              "mirrorReady&&!mirror&&`${ROOT}/ceniciento/`,",
              "mirrorReady&&!mirror&&`${ROOT}/ceniciento/?mirror=1`,",
              'continuación directa a El Espejo')
          s = replace_required(s,
              "${card({id:'ceniciento',mark:'3',title:'Ceniciento',meta:cen?'completa':'pendiente',done:cen,href:`${ROOT}/ceniciento/`})}",
              "${card({id:'ceniciento',mark:'3',title:'Ceniciento',meta:'acceso únicamente por el interrogante',done:cen,href:'',locked:true})}",
              'tarjeta Ceniciento sin enlace directo')
          s = replace_required(s,
              "${card({id:'mirror',mark:'◇',title:'El Espejo',meta:'32 fragmentos',done:mirror,href:`${ROOT}/ceniciento/`,locked:!mirrorReady&&!mirror})}",
              "${card({id:'mirror',mark:'◇',title:'El Espejo',meta:'32 fragmentos',done:mirror,href:`${ROOT}/ceniciento/?mirror=1`,locked:!mirrorReady&&!mirror})}",
              'tarjeta El Espejo')
          p.write_text(s, encoding='utf-8')

          # 2) Loader del índice: romper caché.
          p = Path('oras-reading-window-r2.js')
          s = p.read_text(encoding='utf-8')
          s = replace_required(s,
              "oras-master-index-r1.js?v=20261014-master-index-9",
              "oras-master-index-r1.js?v=20261014-master-index-10",
              'loader master-index-10')
          p.write_text(s, encoding='utf-8')

          # 3) EL ESPEJO: el botón del índice abre exactamente la pantalla de EL ESPEJO,
          #    sin ofrecer CENICIENTO como lectura alternativa.
          p = Path('ceniciento/el-espejo.js')
          s = p.read_text(encoding='utf-8')
          s = replace_required(s,
              "const VERSION='20261012-mirror-gates-4';",
              "const VERSION='20261014-mirror-direct-5';",
              'versión El Espejo')
          marker = "window.addEventListener('oras:mirror-reset',()=>{\n  clearInterval(silenceTimer);\n  started=false;finished=false;finalReady=false;locked=false;lockedScene=null;\n  clearedPauses.clear();\n  mirror.style.transition='';mirror.style.opacity='';mirror.hidden=true;document.body.classList.remove('mirror');\n});\n})();"
          replacement = "window.addEventListener('oras:mirror-reset',()=>{\n  clearInterval(silenceTimer);\n  started=false;finished=false;finalReady=false;locked=false;lockedScene=null;\n  clearedPauses.clear();\n  mirror.style.transition='';mirror.style.opacity='';mirror.hidden=true;document.body.classList.remove('mirror');\n});\n\n/* Entrada exacta desde el índice ORAS: ?mirror=1 abre EL ESPEJO, no CENICIENTO. */\nconst directMirrorRequested=new URLSearchParams(location.search).get('mirror')==='1';\nif(directMirrorRequested){\n  let state={};\n  try{state=JSON.parse(localStorage.getItem(STORAGE)||'{}')||{}}catch(_){}\n  const allowed=state.anaComplete===true&&state.soloComplete===true&&state.cenicientoComplete===true&&state.cenicientoUnlocked===true;\n  if(allowed){\n    requestAnimationFrame(()=>requestAnimationFrame(start));\n  }else{\n    location.replace(ROOT+'?indice=1');\n  }\n}\n})();"
          if 'directMirrorRequested' not in s:
              if marker not in s:
                  raise RuntimeError('No se encontró cierre de el-espejo.js')
              s = s.replace(marker, replacement)
          p.write_text(s, encoding='utf-8')

          # 4) Router de la expansión: destino semántico exacto para cada huella.
          p = Path('inventario-del-aire/oras-general-progress-r1.js')
          s = p.read_text(encoding='utf-8')
          s = replace_required(s, "const VERSION=3;", "const VERSION=4;", 'versión router expansión')
          anchor = "const norm=s=>(s||'').replace(/\\s+/g,' ').trim().toUpperCase();"
          targets = """const TARGET_KEYS={
  'inv-1':'entry','inv-2':'clock','inv-3':'kitchen','inv-4':'corridor','inv-5':'bedroom','inv-6':'garden','inv-7':'inventory','inv-8':'exit',
  'som-1':'station','som-2':'inspector','som-3':'shadows','som-4':'row-seven','som-5':'conversation','som-6':'mobile-inventory','som-7':'workshop','som-8':'office','som-9':'last-journey',
  'ciu-1':'plaza','ciu-2':'archivist','ciu-3':'fountain','ciu-4':'resisters','ciu-5':'map','ciu-6':'theory','ciu-7':'museum','ciu-8':'visitor','ciu-9':'winter',
  'ciu-11':'deep-archive','ciu-12':'trace-machine','atlas':'atlas','ciu-13':'resonator','ciu-10':'last-room'
};

const norm=s=>(s||'').replace(/\\s+/g,' ').trim().toUpperCase();"""
          if 'const TARGET_KEYS=' not in s:
              if anchor not in s:
                  raise RuntimeError('No se encontró punto de inserción TARGET_KEYS')
              s = s.replace(anchor, targets)
          old_panel = """function panelForId(id){
  if(id==='atlas')return document.querySelector('.story-panel.atlas-panel-r6,.story-panel.atlas-panel');
  if(id==='zero'){
    const marker=zeroTarget();
    return marker?.closest('.story-panel')||marker||null;
  }
  return [...document.querySelectorAll('.story-panel')].find(p=>idForPanel(p)===id)||null;
}"""
          new_panel = """function panelForId(id){
  if(id==='zero'){
    const marker=zeroTarget();
    return marker?.closest('.story-panel')||marker||null;
  }
  if(id==='atlas'){
    const atlas=document.querySelector('.story-panel.atlas-panel-r6,.story-panel.atlas-panel,[data-chapter=\"atlas\"]');
    return atlas?.closest('.story-panel')||atlas||null;
  }
  const key=TARGET_KEYS[id];
  if(key){
    const marker=document.querySelector(`[data-chapter=\"${key}\"]`);
    if(marker)return marker.closest('.story-panel')||marker;
  }
  return [...document.querySelectorAll('.story-panel')].find(p=>idForPanel(p)===id)||null;
}"""
          s = replace_required(s, old_panel, new_panel, 'panelForId exacto')
          p.write_text(s, encoding='utf-8')

          # 5) Romper caché del router dentro de la expansión.
          p = Path('inventario-del-aire/index.html')
          s = p.read_text(encoding='utf-8')
          s = replace_required(s,
              "oras-general-progress-r1.js?v=20261014-general-progress-3",
              "oras-general-progress-r1.js?v=20261014-general-progress-4",
              'cache general-progress-4')
          p.write_text(s, encoding='utf-8')

          # Comprobaciones de coherencia: no debe quedar ningún enlace del índice
          # que abra CENICIENTO directamente.
          master=Path('oras-master-index-r1.js').read_text(encoding='utf-8')
          assert "title:'Ceniciento'" in master
          assert "title:'Ceniciento',meta:'acceso únicamente por el interrogante'" in master
          assert "title:'El Espejo',meta:'32 fragmentos'" in master and '?mirror=1' in master
          assert "!cen&&`${ROOT}/elegia-breve/#epilogo`" in master
          assert "href:`${ROOT}/ceniciento/`" not in master
          PY

      - name: Validar JavaScript
        run: |
          node --check oras-master-index-r1.js
          node --check oras-reading-window-r2.js
          node --check ceniciento/el-espejo.js
          node --check inventario-del-aire/oras-general-progress-r1.js

      - name: Publicar corrección
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No hay cambios pendientes.'
            exit 0
          fi
          git config user.name 'pacolazarog-stack'
          git config user.email 'paco.lazaro.g@gmail.com'
          git add oras-master-index-r1.js oras-reading-window-r2.js ceniciento/el-espejo.js inventario-del-aire/oras-general-progress-r1.js inventario-del-aire/index.html
          git commit -m 'Corrige todos los destinos del índice ORAS'
          git push
