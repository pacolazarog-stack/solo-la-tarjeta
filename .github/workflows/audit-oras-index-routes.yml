name: Auditar destinos del índice ORAS

on:
  push:
    branches: ["main"]
    paths:
      - '.github/scripts/fix_oras_index_routes.py'
      - '.github/workflows/audit-oras-index-routes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corregir rutas
        run: python3 .github/scripts/fix_oras_index_routes.py

      - name: Validar JavaScript
        run: |
          node --check oras-master-index-r1.js
          node --check oras-reading-window-r2.js
          node --check ceniciento/el-espejo.js
          node --check inventario-del-aire/oras-general-progress-r1.js

      - name: Publicar corrección
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No hay cambios pendientes.'
            exit 0
          fi
          git config user.name 'pacolazarog-stack'
          git config user.email 'paco.lazaro.g@gmail.com'
          git add oras-master-index-r1.js oras-reading-window-r2.js ceniciento/el-espejo.js inventario-del-aire/oras-general-progress-r1.js inventario-del-aire/index.html
          git commit -m 'Corrige y audita los destinos del índice ORAS'
          git push
