name: Force ORAS universe cache refresh
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump universe script URLs and clean Solo title
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = '20261012-audio-mirror-1'
          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              updated = re.sub(
                  r'narrative-universe\.js\?v=[^"\'<>\s]+',
                  f'narrative-universe.js?v={version}',
                  s,
              )
              if p.as_posix() == 'index.html':
                  updated = updated.replace('      <div class="work-subtitle">Relato breve digital inmersivo</div>\n', '')
              if updated != s:
                  p.write_text(updated, encoding='utf-8')
          PY
      - name: Commit refreshed URLs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ORAS: publica transición sonora y Espejo silencioso"
          git push
