# Workflow legado conservado sólo para ejecución manual.
# No debe reescribir archivos de producción automáticamente en cada push.
name: Force ORAS universe cache refresh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar scripts ORAS sin modificar el repositorio
        shell: bash
        run: |
          set -euo pipefail
          node --check narrative-universe.js
          node --check oras-reading-window-r2.js
          node --check oras-unified-nav-r1.js
          node --check oras-master-index-r1.js
          echo 'PASS: workflow de caché en modo manual y no mutante.'
