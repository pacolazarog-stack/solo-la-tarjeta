name: Stabilize ANA KLAUDYA interaction
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilize-ana-interaction-r1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove polling and freeze expensive final effects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          rw=Path('oras-reading-window-r2.js')
          s=rw.read_text(encoding='utf-8')
          s=re.sub(r"const VERSION='[^']+';","const VERSION='20261014-ana-interaction-stable-1';",s,count=1)
          s=s.replace("new MutationObserver(enforceCanonicalIndexLinks).observe(document.body,{childList:true,subtree:true});\n","")
          s=s.replace("setInterval(render,600);\n","")

          marker="document.head.appendChild(style);"
          stability=r'''
const anaStabilityStyle=document.createElement('style');
anaStabilityStyle.id='oras-ana-interaction-stability-r1';
anaStabilityStyle.textContent=`
body.oras-ana-static-final .pulse-field,
body.oras-ana-static-final .pulse-field::before,
body.oras-ana-static-final .pulse-field::after,
body.oras-ana-static-final .layer-warm,
body.oras-ana-static-final .portrait-finale,
body.oras-ana-static-final .portrait-finale img,
body.oras-ana-static-final .portrait-question,
body.oras-ana-static-final .question-beat,
body.oras-ana-static-final .heat-final,
body.oras-ana-static-final .heat-part{animation:none!important;transition:none!important;filter:none!important;will-change:auto!important}
body.oras-ana-static-final .portrait-question{visibility:visible!important;pointer-events:auto!important}
body.oras-ana-static-final #journeyNav{pointer-events:auto!important}
`;
document.head.appendChild(anaStabilityStyle);
const stabilizeAnaFinal=()=>{
  if(!location.pathname.replace(/\/index\\.html$/,'/').replace(/\\/+$/,'').endsWith('/elegia-breve'))return;
  const body=document.body;if(!body)return;
  if(body.classList.contains('portrait-revealed')||body.dataset.ouCompletedAnaFinal==='true')body.classList.add('oras-ana-static-final');
};
new MutationObserver(stabilizeAnaFinal).observe(document.body,{attributes:true,attributeFilter:['class']});
'''
          if 'oras-ana-interaction-stability-r1' not in s:
              s=s.replace(marker,marker+'\n'+stability,1)

          s=s.replace("  body.dataset.ouCompletedAnaFinal='true';\n","  body.dataset.ouCompletedAnaFinal='true';\n  body.classList.add('oras-ana-static-final');\n",1)
          s=s.replace("      body.classList.add('portrait-revealed');\n","      body.classList.add('portrait-revealed','oras-ana-static-final');\n",1)
          rw.write_text(s,encoding='utf-8')

          # Force the stable reading-window URL everywhere.
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              t=p.read_text(encoding='utf-8')
              t=re.sub(r'oras-reading-window-r2\\.js\\?v=[^"\\'<>\\s]+','oras-reading-window-r2.js?v=20261014-ana-interaction-stable-1',t)
              p.write_text(t,encoding='utf-8')

          # Prevent the global cache workflow from restoring the old reading-window version.
          bw=Path('.github/workflows/bump-ana-universe-cache.yml')
          b=bw.read_text(encoding='utf-8')
          b=b.replace("reading_version = '20261013-ana-portrait-prev-next-1'","reading_version = '20261014-ana-interaction-stable-1'")
          b=b.replace("const VERSION='20261013-ana-portrait-prev-next-1';","const VERSION='20261014-ana-interaction-stable-1';")
          bw.write_text(b,encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check oras-reading-window-r2.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oras-reading-window-r2.js .github/workflows/bump-ana-universe-cache.yml '*.html' '**/*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ANA KLAUDYA: elimina bloqueo del hilo y estabiliza controles"
          git push
