name: Fix ANA estrella core

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-ana-estrella-core.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir entrada inicial #estrella en el núcleo de ANA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')

          old="""        prologueActive=asPrologue;
        cenicientoFrame.hidden=false;
        cenicientoFrame.setAttribute('title',piece==='estrella'?'Prólogo de Ana Klaudya':document.title);
        setJourney(piece);
"""
          new="""        prologueActive=asPrologue;
        cenicientoFrame.hidden=false;
        for(const prop of ['display','opacity','visibility','pointer-events','z-index','background'])cenicientoFrame.style.removeProperty(prop);
        if(piece==='estrella'){
          cenicientoFrame.classList.add('sonrisa-visible');
          cenicientoFrame.style.setProperty('display','block','important');
          cenicientoFrame.style.setProperty('opacity','1','important');
          cenicientoFrame.style.setProperty('visibility','visible','important');
          cenicientoFrame.style.setProperty('pointer-events','auto','important');
          cenicientoFrame.style.setProperty('z-index','2147482000','important');
          cenicientoFrame.style.setProperty('background','#090e19','important');
        }
        cenicientoFrame.setAttribute('title',piece==='estrella'?'Prólogo de Ana Klaudya':document.title);
        setJourney(piece);
"""
          if old not in s:
              if "20261016-estrella-core-r1" not in s:
                  raise SystemExit('No se encontró el bloque openPoem esperado')
          else:
              s=s.replace(old,new,1)

          old2="""      window.addEventListener('popstate',syncPoemRoute);
      window.addEventListener('hashchange',syncPoemRoute);
      window.addEventListener('message',event=>{
"""
          new2="""      window.addEventListener('popstate',syncPoemRoute);
      window.addEventListener('hashchange',syncPoemRoute);
      // Entrada directa: si la página nace con #estrella (o cualquier pieza),
      // monta la ruta inmediatamente sin depender de parches externos.
      syncPoemRoute(); // 20261016-estrella-core-r1
      window.addEventListener('message',event=>{
"""
          if old2 not in s:
              if "20261016-estrella-core-r1" not in s:
                  raise SystemExit('No se encontró el bloque syncPoemRoute esperado')
          else:
              s=s.replace(old2,new2,1)

          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq '20261016-estrella-core-r1' elegia-breve/index.html
          grep -Fq "cenicientoFrame.style.setProperty('opacity','1','important')" elegia-breve/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elegia-breve/index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios: el núcleo ya estaba corregido.'
            exit 0
          fi
          git commit -m 'ANA: corrige entrada directa #estrella en el núcleo'
          git push origin HEAD:main
