name: Incrustar banda sonora en EL ESPEJO

on:
  push:
    paths:
      - '.github/workflows/embed-oras-mirror-score.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar banda sonora completa
        env:
          SCORE_URL: "https://production-273614-media-export.storage.googleapis.com/c9016949-e023-404a-a0b9-5e34c9db6ab1/original.m4a?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=descript-api%40production-273614.iam.gserviceaccount.com%2F20261014%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261014T174941Z&X-Goog-Expires=86400&X-Goog-SignedHeaders=host&X-Goog-"
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fL --retry 3 "$SCORE_URL" -o assets/oras-el-espejo-centro-de-datos.m4a
          bytes=$(wc -c < assets/oras-el-espejo-centro-de-datos.m4a)
          echo "Banda sonora: ${bytes} bytes"
          test "$bytes" -gt 800000

      - name: Fijar controlador y cargador
        shell: python
        run: |
          from pathlib import Path

          h=Path('ceniciento/index.html')
          s=h.read_text(encoding='utf-8')
          old='<script data-oras-mirror-soundtrack="v2" src="/solo-la-tarjeta/ceniciento/el-espejo-soundtrack.js?v=20261014-espejo-soundtrack-2"></script>'
          new='<script data-oras-mirror-soundtrack="v3" src="/solo-la-tarjeta/ceniciento/el-espejo-soundtrack.js?v=20261014-espejo-soundtrack-3"></script>'
          if old in s:
              s=s.replace(old,new)
          elif 'el-espejo-soundtrack.js?v=20261014-espejo-soundtrack-3' not in s:
              marker='<script data-oras-mirror="true" src="el-espejo.js?v=20261014-persistent-reading-2"></script>'
              if marker not in s:
                  raise SystemExit('No se encontró el cargador de EL ESPEJO')
              s=s.replace(marker,marker+'\n'+new,1)
          h.write_text(s,encoding='utf-8')

      - name: Verificar banda sonora y control visible
        run: |
          set -euo pipefail
          test -s assets/oras-el-espejo-centro-de-datos.m4a
          test "$(wc -c < assets/oras-el-espejo-centro-de-datos.m4a)" -gt 800000
          node --check ceniciento/el-espejo-soundtrack.js
          grep -Fq '20261014-espejo-soundtrack-3' ceniciento/index.html
          grep -Fq 'oras-espejo-sound' ceniciento/el-espejo-soundtrack.js

      - name: Guardar banda sonora canónica
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/oras-el-espejo-centro-de-datos.m4a ceniciento/index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios'
            exit 0
          fi
          git commit -m 'ORAS: fija banda sonora y control de EL ESPEJO'
          git push
