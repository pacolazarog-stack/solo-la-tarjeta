name: Fix estrella runtime r6

on:
  push:
    paths:
      - '.github/workflows/fix-star-runtime-r6.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar override runtime r6
        shell: python
        run: |
          from pathlib import Path
          p=Path('estrella/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- star-r5-final-marker -->'
          if marker not in s:
              raise SystemExit('marker r5 no encontrado')
          r6=r'''<!-- estrella-runtime-r6 -->
<script id="orasStarRuntimeR6">
(()=>{
'use strict';
if(window.parent!==window)return;
const BASE='/solo-la-tarjeta';
const $=id=>document.getElementById(id);

function force80(){
  const slider=$('musicLevel'), out=$('musicValue'), enabled=$('musicEnabled');
  if(slider){slider.min='0';slider.max='100';slider.value='80';}
  if(out)out.textContent='80 %';
  if(enabled){enabled.checked=true;enabled.disabled=false;}
}

function ensureNav(){
  let nav=$('orasStarRuntimeNav');
  if(!nav){
    nav=document.createElement('nav');
    nav.id='orasStarRuntimeNav';
    nav.setAttribute('aria-label','Navegación ORAS');
    nav.innerHTML='<button type="button" data-prev>← Anterior</button><button type="button" data-index>Índice ORAS</button><button type="button" data-next>Siguiente →</button>';
    document.body.appendChild(nav);
    nav.querySelector('[data-prev]').onclick=()=>location.href=BASE+'/?read=solo';
    nav.querySelector('[data-index]').onclick=()=>location.href=BASE+'/?indice=1';
    nav.querySelector('[data-next]').onclick=()=>location.href=BASE+'/elegia-breve/?v=20261017-ana-r6&afterPrologue=1';
  }
  const st={position:'fixed',left:'50%',bottom:'14px',transform:'translateX(-50%)','z-index':'2147483647',display:'grid','grid-template-columns':'1fr auto 1fr',width:'min(560px, calc(100vw - 24px))',height:'48px',border:'1px solid rgba(255,255,255,.22)','border-radius':'14px',overflow:'hidden',background:'rgba(8,12,20,.96)',color:'#f8eee4','box-shadow':'0 8px 30px rgba(0,0,0,.38)','backdrop-filter':'blur(8px)','font-family':'system-ui,-apple-system,Segoe UI,sans-serif',visibility:'visible',opacity:'1','pointer-events':'auto'};
  for(const [k,v] of Object.entries(st))nav.style.setProperty(k,v,'important');
  nav.querySelectorAll('button').forEach((b,i)=>{
    const bs={display:'block',visibility:'visible',opacity:'1','pointer-events':'auto',height:'48px',margin:'0',padding:'0 14px',border:'0','border-radius':'0',background:'transparent',color:'#f8eee4',font:'500 13px/1 system-ui,-apple-system,Segoe UI,sans-serif','white-space':'nowrap'};
    for(const [k,v] of Object.entries(bs))b.style.setProperty(k,v,'important');
    if(i)b.style.setProperty('border-left','1px solid rgba(255,255,255,.12)','important');
  });
  return nav;
}

let audio=$('orasStarRuntimeAudioR6');
if(!audio){
  audio=document.createElement('audio');
  audio.id='orasStarRuntimeAudioR6';
  audio.src=BASE+'/elegia-breve/ana-klaudya.m4a?v=20261017-star-r6';
  audio.preload='auto';audio.loop=true;audio.playsInline=true;audio.volume=.8;audio.muted=false;
  audio.style.display='none';document.body.appendChild(audio);
}
const start=$('musicStart'), enabled=$('musicEnabled'), slider=$('musicLevel'), out=$('musicValue');
function label(){if(start){start.hidden=false;start.style.setProperty('display','inline-flex','important');start.textContent=(!audio.paused&&!audio.muted)?'Pausar música':'Reproducir música';}}
function set80(){force80();audio.volume=.8;audio.muted=false;}
async function play(){set80();try{await audio.play();label()}catch(e){label();console.warn('ORAS audio r6',e)}}
function pause(){audio.pause();label()}
if(start){
  start.hidden=false;start.style.setProperty('display','inline-flex','important');
  start.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();(!audio.paused&&!audio.muted)?pause():play()},{capture:true});
}
if(slider){slider.addEventListener('input',e=>{e.stopImmediatePropagation();const n=Math.max(0,Math.min(100,Number(slider.value)||0));audio.volume=n/100;if(out)out.textContent=Math.round(n)+' %';},{capture:true});}
if(enabled){enabled.addEventListener('change',e=>{e.stopImmediatePropagation();enabled.checked?play():pause()},{capture:true});}

function enforce(){force80();ensureNav();label();}
enforce();
requestAnimationFrame(enforce);
setTimeout(enforce,100);
setTimeout(enforce,500);
setTimeout(enforce,1500);
setTimeout(enforce,3500);
})();
</script>
<!-- star-r6-final-marker -->'''
          s=s.replace(marker,r6)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrella/index.html
          git commit -m "ANA: fija música y navegación runtime de estrella r6"
          git push
