name: Bump Ceniciento cache key

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh Ceniciento iframe URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('elegia-breve/index.html')
          s = p.read_text(encoding='utf-8')
          old = "v=20261009-pausa-flores"
          new = "v=20261010-ceniciento-score40-v2"
          if old not in s:
              raise SystemExit('cache key not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/bump-ceniciento-cache.yml
      - name: Commit cache-buster
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elegia-breve/index.html .github/workflows/bump-ceniciento-cache.yml
          git commit -m 'Force fresh Ceniciento score in Ana Klaudya'
          git push
