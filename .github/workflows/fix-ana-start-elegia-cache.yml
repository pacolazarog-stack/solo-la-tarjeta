name: Fix ANA start elegia cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump ANA reading runtime URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'oras-reading-window-r2\.js\?v=[^"\']+', 'oras-reading-window-r2.js?v=20261018-ana-start-elegia-1', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elegia-breve/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ANA: fuerza carga del inicio directo en Elegía"
          git push
