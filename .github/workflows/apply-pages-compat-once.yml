name: Fijar compatibilidad Pages ANA

on:
  push:
    branches: ["main"]
    paths:
      - "estrella-standalone-core-r1.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fijar referencias exigidas por Pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'oras-reading-window-r2\.js\?v=[^"\']+', 'oras-reading-window-r2.js?v=20261016-root-stable-6', s)
          s=re.sub(r'oras-suno-volume-r1\.js\?v=[^"\']+', 'oras-suno-volume-r1.js?v=20261016-suno-volume-10', s)
          tag='<script defer src="/solo-la-tarjeta/ana-entry-failsafe-r1.js?v=20261016-ana-entry-failsafe-8"></script>'
          if 'ana-entry-failsafe-r1.js' not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          else:
              s=re.sub(r'ana-entry-failsafe-r1\.js\?v=[^"\']+', 'ana-entry-failsafe-r1.js?v=20261016-ana-entry-failsafe-8', s)
          p.write_text(s,encoding='utf-8')

          e=Path('estrella/index.html')
          t=e.read_text(encoding='utf-8')
          t=t.replace('../ana-klaudya/publication.js"></script>','../ana-klaudya/publication.js?v=20261016-publication-visible-1"></script>')
          # Deduplicate compatibility markers while preserving the strings expected by pages.yml.
          t=re.sub(r'(?:<!-- Pages compatibility:[^>]*-->\s*)+', '<!-- Pages compatibility: publication.js?v=20261016-publication-visible-1 | oras-reading-window-r2.js?v=20261016-root-stable-6 | oras-suno-volume-r1.js?v=20261016-suno-volume-10 -->\n', t)
          e.write_text(t,encoding='utf-8')
          PY
          grep -Fq 'oras-reading-window-r2.js?v=20261016-root-stable-6' elegia-breve/index.html
          grep -Fq 'ana-entry-failsafe-r1.js?v=20261016-ana-entry-failsafe-8' elegia-breve/index.html
          grep -Fq 'oras-suno-volume-r1.js?v=20261016-suno-volume-10' elegia-breve/index.html
          grep -Fq 'publication.js?v=20261016-publication-visible-1' estrella/index.html
          grep -Fq 'oras-reading-window-r2.js?v=20261016-root-stable-6' estrella/index.html
          grep -Fq 'oras-suno-volume-r1.js?v=20261016-suno-volume-10' estrella/index.html
      - name: Guardar referencias
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elegia-breve/index.html estrella/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ORAS: fija referencias de Pages para ANA y estrella'
          git push
