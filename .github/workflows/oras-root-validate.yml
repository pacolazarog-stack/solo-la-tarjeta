name: Validate ORAS clean root
on:
  push:
    branches: [oras-raiz-limpia]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate modules and canonical count
        shell: bash
        run: |
          set -euo pipefail
          node --check oras.js
          node --check core/state.js
          node --check core/progress.js
          node --check core/router.js
          node --check core/index-modal.js
          node --check core/reader.js
          node --check core/solo-scene.js
          node --check core/ana-scenes.js
          node --check core/audio.js
          node --check core/ceniciento.js
          node --check core/mirror.js
          node --check core/expansion.js
          node --check core/transitions.js
          node --check content/manifest.js
          node --check content/life-sources.js
          node --check content/life-scenes.js
          node --check content/mirror-scenes.js
          node --check scripts/oras-audit.mjs
          node scripts/oras-audit.mjs
          test -s solo-scene.css
          test -s ana-scenes.css
          test -s ceniciento-scene.css
          test -s mirror-scene.css
          test -s index-legacy.html
          test -s estrella/umbral.jpg
          test -s ojos/ojos-ana.svg
          test -s sonrisa/labios-ana.jpg
          test -s elegia-breve/ana-klaudya-fotografia.jpg
          test -s interludio/mundo-flores.png
          test -s interludio/mundo-flores-yin-yang.png
          test -s interludio/cebolla-pan.png
          test -s epilogo/cotan-imperative.webp
          test -s assets/oras-el-espejo-centro-de-datos.m4a
          test "$(wc -c < assets/oras-el-espejo-centro-de-datos.m4a)" -gt 800000
          for n in 01 02 03 04 05 06 07 08 09; do test -s "ceniciento/frames-stable/$n.webp"; done
      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local ORAS server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/oras-http.log 2>&1 &
          echo $! > /tmp/oras-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Browser audit desktop and mobile
        shell: bash
        run: node scripts/oras-browser-audit.mjs
      - name: Upload browser audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oras-browser-audit-${{ github.sha }}
          path: browser-audit/
          if-no-files-found: ignore
