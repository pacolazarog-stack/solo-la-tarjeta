name: Fix ANA inline start once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir COMENZAR directamente en ANA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elegia-breve/index.html')
          s=p.read_text(encoding='utf-8')
          old="""      entryButton.addEventListener('click',()=>{\n        if(entryButton.disabled)return;\n        window.dispatchEvent(new CustomEvent('oras:reading-start'));\n        entryButton.disabled=true;\n        body.classList.add('journey-started','sound-ready');\n        entry.classList.add('is-open');\n        if(prologuePlayed){beginPrelude(false);setJourney('elegia');}\n        else {prologueNameReady=false;openPoem('estrella',true);}\n      });"""
          new="""      entryButton.addEventListener('click',()=>{\n        if(entryButton.disabled)return;\n        window.dispatchEvent(new CustomEvent('oras:reading-start'));\n        entryButton.disabled=true;\n        body.classList.add('journey-started','sound-ready');\n        entry.classList.add('is-open');\n        prologuePlayed=true;\n        prologueNameReady=false;\n        beginPrelude(false);\n        setJourney('elegia');\n      });"""
          if old not in s:
              raise SystemExit('No se encontró el manejador antiguo de COMENZAR')
          s=s.replace(old,new,1)
          s=s.replace('oras-reading-window-r2.js?v=20261018-ana-start-elegia-1','oras-reading-window-r2.js?v=20261018-ana-inline-start-1',1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/fix-ana-inline-start-once.yml
      - name: Publicar corrección
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elegia-breve/index.html .github/workflows/fix-ana-inline-start-once.yml
          git commit -m "ANA: COMENZAR entra directamente en la elegía"
          git push
