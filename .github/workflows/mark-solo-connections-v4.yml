name: Clarify Solo la Tarjeta narrative connections v4
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/mark-solo-connections-v4.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make narrative links perceptible and bump cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js = Path('narrative-universe.js')
          s = js.read_text(encoding='utf-8')
          s = s.replace("const VERSION='20261010-3';", "const VERSION='20261010-4';")
          s = s.replace(
              '.ou-active-text{cursor:pointer;text-decoration-line:underline;text-decoration-style:dotted;text-decoration-thickness:.055em;text-underline-offset:.19em;text-decoration-color:currentColor;transition:opacity .45s ease,text-shadow .45s ease}',
              '.ou-active-text{cursor:pointer;font-weight:600;text-decoration-line:underline;text-decoration-style:dotted;text-decoration-thickness:.105em;text-underline-offset:.22em;text-decoration-color:rgba(112,72,38,.78);transition:opacity .45s ease,text-shadow .45s ease,color .45s ease}.ou-active-text:hover,.ou-active-text:focus-visible{color:#6f4d31;opacity:1;text-shadow:0 0 12px rgba(112,72,38,.18);outline:none}'
          )
          s = s.replace(
              '.ou-eiffel{display:inline-grid;place-items:center;width:22px;height:31px;margin-left:.58em;padding:0;border:0;background:transparent;color:inherit;opacity:.38;vertical-align:-.58em;cursor:pointer;transition:opacity .6s ease,transform .6s ease}.ou-eiffel:hover,.ou-eiffel:focus-visible{opacity:.82;transform:translateY(-1px);outline:none}',
              '.ou-eiffel{display:inline-grid;place-items:center;width:27px;height:37px;margin-left:.62em;padding:0;border:0;background:transparent;color:inherit;opacity:.64;vertical-align:-.62em;cursor:pointer;filter:drop-shadow(0 1px 3px rgba(0,0,0,.14));transition:opacity .6s ease,transform .6s ease}.ou-eiffel:hover,.ou-eiffel:focus-visible{opacity:1;transform:translateY(-2px) scale(1.04);outline:none}'
          )
          js.write_text(s, encoding='utf-8')

          pages = [
              Path('index.html'), Path('elegia-breve/index.html'), Path('ojos/index.html'),
              Path('sonrisa/index.html'), Path('epilogo/index.html'), Path('estrella/index.html'),
              Path('ceniciento/index.html')
          ]
          for p in pages:
              if not p.exists():
                  continue
              t = p.read_text(encoding='utf-8')
              t = re.sub(r'narrative-universe\.js\?v=20261010-[0-9A-Za-z-]+', 'narrative-universe.js?v=20261010-4', t)
              p.write_text(t, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/mark-solo-connections-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Clarify Solo la Tarjeta narrative connections"
          git push
