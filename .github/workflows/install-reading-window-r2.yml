name: Install ORAS reading window R2

on:
  push:
    paths:
      - '.github/workflows/install-reading-window-r2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject current reading window
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          version='20261012-reading-window-r2'
          targets=[
            Path('index.html'),
            Path('elegia-breve/index.html'),
            Path('estrella/index.html'),
            Path('ojos/index.html'),
            Path('sonrisa/index.html'),
            Path('cabello/index.html'),
            Path('piel/index.html'),
            Path('interludio/index.html'),
            Path('epilogo/index.html'),
            Path('ceniciento/index.html'),
          ]
          tag=f'<script data-oras-reading-window="r2" src="/solo-la-tarjeta/oras-reading-window-r2.js?v={version}"></script>'
          installed=[]
          for p in targets:
            if not p.exists():
              continue
            s=p.read_text(encoding='utf-8')
            s=re.sub(r'\n?<script data-oras-reading-window="r2"[^>]*></script>', '', s)
            matches=list(re.finditer(r'<script[^>]+src="[^\"]*narrative-universe\.js\?v=[^\"]+"[^>]*></script>',s))
            if not matches:
              continue
            m=matches[-1]
            s=s[:m.end()]+'\n'+tag+s[m.end():]
            p.write_text(s,encoding='utf-8')
            installed.append(p.as_posix())
          if 'elegia-breve/index.html' not in installed:
            raise RuntimeError('La ventana R2 debe quedar instalada en ANA KLAUDYA')
          print('Instalada en:', ', '.join(installed))
          PY

      - name: Commit installed reading window
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html elegia-breve/index.html estrella/index.html ojos/index.html sonrisa/index.html epilogo/index.html ceniciento/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ORAS: activa ventana completa de lecturas'
          git pull --rebase origin main
          git push origin HEAD:main
