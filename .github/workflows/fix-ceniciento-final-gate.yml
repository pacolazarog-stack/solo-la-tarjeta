name: Fix Ceniciento final mirror gate
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Ceniciento gate
        shell: bash
        run: |
          set -euo pipefail
          echo ''.replace('\n','') | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check ceniciento/el-espejo-nav.js
          grep -q "Compuerta dura" ceniciento/el-espejo-nav.js
          grep -q "ceniciento-hard-gate-1" ceniciento/index.html
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "CENICIENTO: seguir obligatorio antes de EL ESPEJO"
          git push
