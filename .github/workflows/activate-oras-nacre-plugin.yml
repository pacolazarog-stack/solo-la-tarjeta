name: Activate ORAS nacre plugin
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-oras-nacre-plugin.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire nacre roulette plugin into master index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('oras-master-index-r1.js')
          s=p.read_text(encoding='utf-8')
          marker='/* ORAS_NACRE_PLUGIN_LOADER_R1 */'
          loader="""/* ORAS_NACRE_PLUGIN_LOADER_R1 */
const nacreRouletteScript=document.createElement('script');
nacreRouletteScript.src=`${ROOT}/oras-nacre-roulette-r1.js?v=20261015-nacre-roulette-1`;
nacreRouletteScript.defer=true;
document.head.appendChild(nacreRouletteScript);"""
          if marker not in s:
              needle="if(qs.get('indice')==='1')openIndex();"
              if needle not in s:
                  raise RuntimeError('No se encontro el punto de insercion')
              s=s.replace(needle,loader+'\n'+needle,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check oras-master-index-r1.js
          grep -Fq 'ORAS_NACRE_PLUGIN_LOADER_R1' oras-master-index-r1.js
          grep -Fq 'oras-nacre-roulette-r1.js?v=20261015-nacre-roulette-1' oras-master-index-r1.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oras-master-index-r1.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ORAS: activa la ruleta circular de nacar"
          git push
