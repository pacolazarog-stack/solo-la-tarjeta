name: Install hidden narrative universe
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject narrative universe loader
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages = {
              Path('index.html'): 'narrative-universe.js?v=20261010-1',
              Path('elegia-breve/index.html'): '../narrative-universe.js?v=20261010-1',
              Path('ojos/index.html'): '../narrative-universe.js?v=20261010-1',
              Path('sonrisa/index.html'): '../narrative-universe.js?v=20261010-1',
              Path('epilogo/index.html'): '../narrative-universe.js?v=20261010-1',
              Path('estrella/index.html'): '../narrative-universe.js?v=20261010-1',
              Path('ceniciento/index.html'): '../narrative-universe.js?v=20261010-1',
          }
          marker = 'data-oras-universe="v1"'
          for path, src in pages.items():
              if not path.exists():
                  raise RuntimeError(f'Missing page: {path}')
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              tag = f'<script {marker} src="{src}"></script>\n'
              pos = text.lower().rfind('</body>')
              if pos < 0:
                  raise RuntimeError(f'Missing </body> in {path}')
              text = text[:pos] + tag + text[pos:]
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html elegia-breve/index.html ojos/index.html sonrisa/index.html epilogo/index.html estrella/index.html ceniciento/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install hidden narrative universe"
          git push
