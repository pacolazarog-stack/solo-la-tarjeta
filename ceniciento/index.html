<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100e0d">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>CENICIENTO · cuento narrado</title>
<style>
:root{--gray:0;--prog:0;--warm:.72;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100e0d}
body{font-family:Iowan Old Style,Palatino Linotype,Book Antiqua,Palatino,Georgia,"Times New Roman",serif;color:#f7f1e8;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:-5%;z-index:0;overflow:hidden;background:#100e0d}.bg video{width:100%;height:100%;object-fit:cover;transform:scale(1.07);filter:grayscale(var(--gray)) saturate(calc(1 - .72*var(--gray))) brightness(calc(.44 - .07*var(--gray))) contrast(calc(1 + .18*var(--gray)));transition:filter 1.3s ease}.bg:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 28%,rgba(0,0,0,.08),rgba(0,0,0,.48) 64%,rgba(0,0,0,.78)),linear-gradient(to bottom,rgba(17,12,9,.22),rgba(7,7,8,.54));box-shadow:inset 0 0 14vw rgba(0,0,0,.62)}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.035;background-image:radial-gradient(circle,rgba(255,255,255,.55) 0 .4px,transparent .55px);background-size:8px 8px;mix-blend-mode:soft-light}
.portrait{position:fixed;z-index:3;left:50%;top:4.5svh;transform:translateX(-50%);width:min(62vw,470px);aspect-ratio:3/4;border-radius:25px;overflow:hidden;background:#211914;box-shadow:0 24px 95px rgba(0,0,0,.55),0 0 0 1px rgba(255,238,210,.15)}.portrait video{width:100%;height:100%;object-fit:cover;filter:saturate(1.02) contrast(1.025) brightness(.98)}.portrait:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(255,210,145,.06),transparent 45%,rgba(0,0,0,.08));box-shadow:inset 0 0 55px rgba(0,0,0,.13)}
.brand{position:fixed;z-index:8;left:max(15px,env(safe-area-inset-left));top:max(15px,env(safe-area-inset-top));font:500 .65rem/1.2 Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,246,232,.64)}
.controls{position:fixed;z-index:9;right:max(13px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:7px}.controls button{border:1px solid rgba(255,255,255,.23);background:rgba(15,13,12,.46);color:rgba(255,255,255,.82);border-radius:999px;padding:.62em .92em;font:500 .62rem/1 Arial,sans-serif;letter-spacing:.11em;text-transform:uppercase;backdrop-filter:blur(8px)}
.karaoke{position:fixed;z-index:7;left:50%;bottom:7.2svh;transform:translateX(-50%);width:min(calc(100% - 30px),850px);text-align:center;text-shadow:0 3px 18px rgba(0,0,0,.88);pointer-events:none}.line{transition:opacity .55s ease,transform .55s ease,filter .55s ease;min-height:1.5em}.prev,.next{font-size:clamp(.82rem,1.8vw,1.02rem);line-height:1.35;color:rgba(245,239,231,.37);filter:blur(.1px)}.prev{margin-bottom:.72rem;transform:translateY(2px)}.next{margin-top:.78rem;transform:translateY(-2px)}.current{font-size:clamp(1.34rem,3.35vw,2.15rem);line-height:1.22;font-weight:500;color:#fffaf1;letter-spacing:.005em;max-width:32ch;margin:auto}.current.dramatic{font-size:clamp(1.7rem,4.4vw,2.8rem);line-height:1.12;letter-spacing:.015em}.current.final-line{font-size:clamp(1.85rem,4.8vw,3rem)}
.progress{position:fixed;z-index:9;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}.progress i{display:block;width:calc(var(--prog)*100%);height:100%;background:rgba(244,235,222,.72);transition:width .45s linear}.status{position:fixed;z-index:8;left:50%;bottom:2.1svh;transform:translateX(-50%);font:500 .58rem/1 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.4);white-space:nowrap}
.entry{position:fixed;z-index:30;inset:0;display:grid;place-items:center;background:rgba(12,9,8,.52);backdrop-filter:blur(8px);transition:opacity 1.2s ease,visibility 1.2s ease}.entry.open{opacity:0;visibility:hidden;pointer-events:none}.card{text-align:center;padding:30px;color:#f8efe3;text-shadow:0 3px 24px rgba(0,0,0,.65)}.card h1{font-size:clamp(2.7rem,9vw,5.4rem);font-weight:500;letter-spacing:.09em;margin:0}.card p{font:500 .66rem/1.5 Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,244,230,.65);margin:1rem 0 1.7rem}.card button{border:1px solid rgba(255,243,224,.47);background:rgba(36,27,21,.42);color:#fff4e7;border-radius:999px;padding:1em 2.1em;font:600 .7rem/1 Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase}.card button:disabled{opacity:.38}.hint{margin-top:1rem!important;font-size:.55rem!important;letter-spacing:.1em!important;text-transform:none!important;opacity:.62}
@media(max-width:640px){.portrait{top:6.8svh;width:min(82vw,405px);border-radius:21px}.karaoke{bottom:8.4svh;width:calc(100% - 22px)}.current{font-size:clamp(1.28rem,5.6vw,1.7rem);max-width:28ch}.current.dramatic{font-size:clamp(1.55rem,7vw,2.15rem)}.prev,.next{font-size:.78rem}.brand{font-size:.55rem}.controls button{font-size:.55rem;padding:.58em .75em}}
@media(prefers-reduced-motion:reduce){.line,.bg video,.progress i,.entry{transition-duration:.01ms}}
</style>
</head>
<body>
<div class="bg"><video id="bgv" muted playsinline preload="auto"></video></div><div class="grain"></div>
<div class="portrait"><video id="agev" muted playsinline preload="auto"></video></div>
<div class="brand">Ceniciento · flag · 2026</div>
<div class="controls"><button id="pause" type="button">Pausa</button><button id="restart" type="button">Inicio</button></div>
<div class="karaoke" aria-live="polite"><div id="prev" class="line prev"></div><div id="current" class="line current"></div><div id="next" class="line next"></div></div>
<div id="status" class="status">cargando cuento</div><div class="progress"><i></i></div>
<div id="entry" class="entry"><div class="card"><h1>CENICIENTO</h1><p>cuento narrado · flag · 2026</p><button id="enter" disabled>Entrar</button><p class="hint">voz · imagen · texto sincronizados</p></div></div>
<audio id="narrator" preload="metadata"></audio>
<script>
(()=>{
const $=id=>document.getElementById(id), root=document.documentElement;
const bgv=$('bgv'),agev=$('agev'),entry=$('entry'),enter=$('enter'),pauseBtn=$('pause'),restartBtn=$('restart'),audio=$('narrator'),status=$('status');
const prev=$('prev'),cur=$('current'),next=$('next');
const seqFiles=[1,2,3,4,5,6].map(n=>`seq/v1-0${n}.txt?v=9`);
const aiAudio=[
 'https://www.aidocmaker.com/g0/audio?name=b9b09ddf66e3486cbe8efe65b94e633a',
 'https://www.aidocmaker.com/g0/audio?name=a43768bba8884eb18f8ba1ebb161aa73',
 'https://www.aidocmaker.com/g0/audio?name=ce8c457cb4ea40e38c25028405c2b5f9'
];
let phrases=[],ranges=[],weights=[],storyReady=false,seqReady=false,started=false,paused=false,mode='ai',block=0,currentIndex=0,lastAge=0,lastGray=0,videoUrl=null,raf=0,speechToken=0,ctx=null,score=null;
const clamp=x=>Math.max(0,Math.min(1,x));
function check(){enter.disabled=!(storyReady&&seqReady);if(!enter.disabled)status.textContent='listo para narrar'}
function cleanText(raw){return raw.replace(/^#\s*CENICIENTO\s*/i,'').trim()}
function splitPhrases(raw){const pars=cleanText(raw).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean), out=[];for(const p of pars){if(p.length<=185){out.push(p);continue}const s=p.match(/[^.!?…]+(?:[.!?…]+|$)/g)?.map(x=>x.trim()).filter(Boolean)||[p];out.push(...s)}return out}
const ix=(needle,last=false)=>{const arr=[];phrases.forEach((p,i)=>{if(p.includes(needle))arr.push(i)});return arr.length?(last?arr[arr.length-1]:arr[0]):-1};
function setupRanges(){let b1=ix('El peso cálido de las vocales'), b2=ix('Siguió andando');if(b1<0)b1=Math.floor(phrases.length*.38);if(b2<0)b2=Math.floor(phrases.length*.72);ranges=[[0,b1],[b1+1,b2],[b2+1,phrases.length-1]];weights=ranges.map(([a,b])=>{let total=0,cum=[];for(let i=a;i<=b;i++){const t=phrases[i], words=t.split(/\s+/).length;let w=Math.max(.8,words*.34);if(/[.!?…]$/.test(t))w+=.3;if(dramatic(t))w+=.7;total+=w;cum.push(total)}return {a,b,total,cum}})}
function dramatic(t){return /Todavía no|No al muchacho|^A él\.$|^—?Ceniciento\.?$|Sesenta y dos años|al hombre que era|Las nueve y treinta y ocho|Y por último el calor/i.test(t)}
function renderLine(i){i=Math.max(0,Math.min(phrases.length-1,i));currentIndex=i;prev.textContent=phrases[i-1]||'';cur.textContent=phrases[i]||'';next.textContent=phrases[i+1]||'';cur.className='line current'+(dramatic(phrases[i])?' dramatic':'')+(i===phrases.length-1?' final-line':'');root.style.setProperty('--prog',((i+1)/phrases.length).toFixed(5));visual(i);scoreScene(i)}
function stageFor(i){const A=[[ix('Paco miró el reloj'),0],[ix('Un abrazo breve'),1],[ix('Pidieron vino'),2],[ix('Brasil apareció así'),3],[ix('Las nueve y treinta y ocho'),4],[ix('—Ceniciento'),5],[ix('—Todavía no'),6],[ix('Cuando finalmente salieron'),7],[ix('Dos calles más abajo'),8],[ix('No al muchacho',true),9]].filter(x=>x[0]>=0);for(let k=0;k<A.length-1;k++){const [a,s]=A[k],[b,t]=A[k+1];if(i>=a&&i<=b)return s+(t-s)*(i-a)/Math.max(1,b-a)}return i<A[0][0]?0:9}
function visual(i){const age=clamp(stageFor(i)/9);lastAge=Math.max(lastAge,age);if(agev.duration&&isFinite(agev.duration)){const target=.04+lastAge*Math.max(.01,agev.duration-.1);if(Math.abs(agev.currentTime-target)>.06)agev.currentTime=target}const gs=ix('Cuando finalmente salieron'), ge=phrases.length-1;let g=gs>=0?clamp((i-gs)/Math.max(1,ge-gs)):0;lastGray=Math.max(lastGray,g);root.style.setProperty('--gray',lastGray.toFixed(4))}
async function loadSequence(){const parts=await Promise.all(seqFiles.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error('secuencia');return (await r.text()).trim()}));const b64=parts.join('').replace(/\s+/g,''),bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);videoUrl=URL.createObjectURL(new Blob([u],{type:'video/mp4'}));bgv.src=videoUrl;agev.src=videoUrl;await Promise.all([new Promise((ok,ko)=>{bgv.onloadedmetadata=ok;bgv.onerror=ko}),new Promise((ok,ko)=>{agev.onloadedmetadata=ok;agev.onerror=ko})]);bgv.currentTime=.04;agev.currentTime=.04;seqReady=true;check()}
async function loadStory(){const r=await fetch('texto.md?v=9',{cache:'no-store'});if(!r.ok)throw new Error('texto');phrases=splitPhrases(await r.text());setupRanges();renderLine(0);storyReady=true;check()}
function weightIndex(b,p){const W=weights[b],target=p*W.total;let k=W.cum.findIndex(x=>x>=target);if(k<0)k=W.cum.length-1;return W.a+k}
function stopAudio(){cancelAnimationFrame(raf);audio.pause();audio.removeAttribute('src');audio.load()}
function syncAudio(){if(mode!=='ai'||paused)return;const d=audio.duration;if(d&&isFinite(d)){renderLine(weightIndex(block,clamp(audio.currentTime/d)))}raf=requestAnimationFrame(syncAudio)}
function playAI(b){mode='ai';block=b;status.textContent=`narrador · parte ${b+1}/3`;audio.src=aiAudio[b];audio.load();let settled=false;const fallback=()=>{if(settled||mode!=='ai')return;settled=true;stopAudio();mode='device';status.textContent='voz del dispositivo';speakFrom(ranges[b][0])};const timer=setTimeout(fallback,4800);audio.onplaying=()=>{settled=true;clearTimeout(timer);syncAudio()};audio.onerror=fallback;audio.onended=()=>{cancelAnimationFrame(raf);if(block<2)setTimeout(()=>playAI(block+1),430);else finish()};audio.play().catch(fallback)}
function chooseVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));return vs.find(v=>/Alvaro|Álvaro|Jorge|Pablo|Raul|Raúl|Diego|Antonio|Miguel|Carlos|Enrique|Fernando/i.test(v.name))||vs.find(v=>/es-ES/i.test(v.lang))||vs[0]||null}
function speakFrom(i){if(paused||i>=phrases.length){if(i>=phrases.length)finish();return}mode='device';speechToken++;const token=speechToken,t=phrases[i];renderLine(i);const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=dramatic(t)?.78:.88;u.pitch=.9;const v=chooseVoice();if(v)u.voice=v;u.onend=()=>{if(token!==speechToken||paused)return;setTimeout(()=>speakFrom(i+1),dramatic(t)?520:120)};u.onerror=()=>{if(token===speechToken&&!paused)setTimeout(()=>speakFrom(i+1),120)};speechSynthesis.speak(u)}
function makeScore(){try{ctx=new (window.AudioContext||window.webkitAudioContext)();const master=ctx.createGain();master.gain.value=.014;master.connect(ctx.destination);const freqs=[110,164.81,220],osc=[];freqs.forEach((f,j)=>{const o=ctx.createOscillator(),g=ctx.createGain(),flt=ctx.createBiquadFilter();o.type=j===1?'triangle':'sine';o.frequency.value=f;g.gain.value=j===1?.18:.24;flt.type='lowpass';flt.frequency.value=520;o.connect(g).connect(flt).connect(master);o.start();osc.push(o)});score={master,osc,last:-1}}catch(e){score=null}}
function scoreScene(i){if(!score||!ctx)return;const s=stageFor(i),scene=Math.floor(s);if(scene!==score.last){score.last=scene;const roots=[110,110,98,110,98,87.31,98,82.41,73.42,65.41],r=roots[Math.min(9,scene)];[1,1.5,2].forEach((m,j)=>score.osc[j].frequency.setTargetAtTime(r*m,ctx.currentTime,.8))}let vol=.014;if(dramatic(phrases[i]))vol=.021;if(/Todavía no|No al muchacho|^A él\.$/.test(phrases[i]))vol=.006;score.master.gain.setTargetAtTime(vol,ctx.currentTime,.25)}
function finish(){renderLine(phrases.length-1);status.textContent='fin';if(score)score.master.gain.setTargetAtTime(.005,ctx.currentTime,1.4)}
function start(){if(started)return;started=true;entry.classList.add('open');makeScore();if(ctx?.state==='suspended')ctx.resume();setTimeout(()=>playAI(0),650)}
function reset(){speechToken++;speechSynthesis.cancel();stopAudio();paused=false;pauseBtn.textContent='Pausa';block=0;currentIndex=0;lastAge=0;lastGray=0;root.style.setProperty('--gray','0');renderLine(0);if(ctx?.state==='suspended')ctx.resume();setTimeout(()=>playAI(0),300)}
function togglePause(){if(!started)return;paused=!paused;pauseBtn.textContent=paused?'Seguir':'Pausa';if(paused){if(mode==='ai')audio.pause();else speechSynthesis.pause();ctx?.suspend()}else{ctx?.resume();if(mode==='ai'){audio.play().then(syncAudio).catch(()=>{mode='device';speakFrom(currentIndex)})}else speechSynthesis.resume()}}
enter.addEventListener('click',start);pauseBtn.addEventListener('click',togglePause);restartBtn.addEventListener('click',reset);speechSynthesis.onvoiceschanged=()=>{};
Promise.all([loadStory(),loadSequence()]).catch(e=>{status.textContent='error al cargar';console.error(e)});
})();
</script>
</body></html>
