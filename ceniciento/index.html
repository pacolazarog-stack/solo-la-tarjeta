42,"text":"Nada protegía ya la escena."},{"start":580.123,"text":"No había lámparas ámbar."},{"start":581.762,"text":"Ni cristales dorados. Ni música."},{"start":584.564,"text":"Solo una calle de Granada, el aire frío y dos personas que habían alargado una conversación más de lo previsto."},{"start":592.041,"text":"Ella dio un paso."},{"start":593.541,"text":"Lo abrazó."},{"start":595.242,"text":"Paco sintió primero el perfume."},{"start":597.543,"text":"Después el cabello junto a la mejilla."},{"start":600.155,"text":"Luego los brazos. Y por último el calor."},{"start":604.156,"text":"El contraste con la noche fue tan preciso que durante unos segundos tuvo la impresión de que todo el frío de la ciudad se había detenido alrededor de aquel punto."},{"start":614.16,"text":"Cerró los ojos."},{"start":615.52,"text":"No supo cuánto duró."},{"start":617.081,"text":"Quizá poco."},{"start":618.341,"text":"Quizá todo lo necesario."},{"start":620.842,"text":"Cuando se separaron, ella permaneció cerca una fracción de segundo."},{"start":624.343,"text":"—Buenas noches, Ceniciento."},{"start":627.284,"text":"Paco sonrió."},{"start":628.005,"text":"—Buenas noches."},{"start":630.682,"text":"La vio alejarse."},{"start":632.023,"text":"Luego echó a andar en dirección contraria."},{"start":634.704,"text":"No miró el reloj."},{"start":636.565,"text":"Dos calles más abajo, el frío empezó a entrarle por las mangas."},{"start":639.986,"text":"Hundió las manos en los bolsillos."},{"start":642.628,"text":"Aquellas manos todavía eran jóvenes."},{"start":645.669,"text":"Al siguiente paso, la rodilla protestó."},{"start":648.65,"text":"Pequeña. Conocida."},{"start":651.191,"text":"Se detuvo."},{"start":652.212,"text":"Movió la pierna."},{"start":653.372,"text":"La molestia regresó."},{"start":654.953,"text":"Paco sonrió."},{"start":656.434,"text":"—Ya estamos."},{"start":658.135,"text":"Siguió andando."},{"start":659.417,"text":"El aire descendía desde las calles altas y se acumulaba en las "—Hola, Paco."},{"start":746.303,"text":"Y después había pasado toda la tarde frente a él."},{"start":749.604,"text":"El vino."},{"start":750.724,"text":"Brasil."},{"start":751.744,"text":"El acento."},{"start":752.885,"text":"La cuenta."},{"start":754.045,"text":"Todavía no."},{"start":755.745,"text":"Paco miró su reflejo."},{"start":757.786,"text":"Entonces lo entendió."},{"start":760.167,"text":"Ella nunca había visto al joven."},{"start":762.627,"text":"Para ella, en aquella mesa, había estado siempre sentado el hombre de sesenta y dos años. Con su chaqueta algo anticuada. Con sus zapatos cómodos y gastados. Con aquellas manos."},{"start":774.734,"text":"Y cuando había puesto la suya sobre la cuenta para decir: —Todavía no. se lo había dicho a ese hombre."},{"start":781.539,"text":"Cuando había caminado junto a él por la calle, caminaba junto a ese hombre."},{"start":785.501,"text":"Y cuando lo abrazó bajo la luz blanca de la farola, había abrazado a ese hombre."},{"start":791.285,"text":"No al muchacho."},{"start":792.766,"text":"A él."},{"start":794.247,"text":"Paco apoyó una mano en el cristal."},{"start":796.549,"text":"Estaba frío."},{"start":797.93,"text":"Durante unas horas el tiempo le había permitido contemplar al muchacho que había sido."},{"start":803.097,"text":"Ella, en cambio, había seguido viendo a Paco."},{"start":805.899,"text":"Y lo había abrazado."},{"start":808.701,"text":"Paco retiró la mano del cristal."},{"start":810.903,"text":"El aire de Granada volvió a morderle los dedos."},{"start":813.765,"text":"Los guardó en los bolsillos."},{"start":815.686,"text":"La rodilla protestó al comenzar a caminar."},{"start":818.388,"text":"Esta vez no sonrió por resignación."},{"start":821.09,"text":"Sonrió porque el dolor era suyo."},{"start":823.692,"text":"También las manos."},{"start":825.214,"text":"También los años."},{"start":827.215,"text":"Detrás quedaban el café y"},{"start":829.012,"text":"dos copas, una cucharilla cayendo al suelo y una cuenta que durante unos minutos nadie había querido pagar."},{"start":835.656,"text":"Delante no había palacio. Ni carroza. Ni promesa."},{"start":839.679,"text":"Solo una calle fría."},{"start":841.7,"text":"Paco avanzó por ella. Y comprendió finalmente la diferencia."},{"start":845.502,"text":"A Cenicienta el prodigio la había transformado para que alguien pudiera verla."},{"start":851.866,"text":"A Ceniciento, el prodigio le había devuelto por unas horas al hombre que fue para que pudiera descubrir,"},{"start":859.065,"text":"cuando desapareciera, que alguien había estado mirando al hombre que era."}];

 cur.className='line current'+(dramatic(lines[i])?' dramatic':'')+(i===lines.length-1?' final-line':'');
 if(!spoken)visualByIndex(i);
}
function stageFor(i){return clamp(i/Math.max(1,phrases.length-1))}
function setAgeProgress(progress){
 if(ageFrames.length!==AGE_STATES)return;
 const position=clamp(progress)*(AGE_STATES-1),state=Math.min(AGE_STATES-2,Math.floor(position)),blend=position-state;
 if(state!==currentAgeState){currentAgeState=state;ageA.src=bgA.src=ageFrames[state];ageB.src=bgB.src=ageFrames[state+1]}
 ageA.classList.remove('active');ageB.classList.remove('active');
 ageA.style.opacity=bgA.style.opacity='1';ageB.style.opacity=bgB.style.opacity=blend.toFixed(5);
}
function setGrayProgress(g){lastGray=Math.max(lastGray,clamp(g));root.style.setProperty('--gray',lastGray.toFixed(4))}
function visualByIndex(i){if(activeMode!=='listen')setAgeProgress(stageFor(i));const gs=ix('Cuando finalmente salieron'),ge=phrases.length-1;setGrayProgress(gs>=0?(i-gs)/Math.max(1,ge-gs):0)}
async function loadSequence(){
 await Promise.all(AGE_IMAGES.map(src=>new Promise((resolve,reject)=>{
  const image=new Image();image.onload=resolve;image.onerror=()=>reject(Error('imagen no disponible'));image.src=src;
 })));
 ageFrames=AGE_IMAGES;currentAgeState=-1;seqReady=true;
 if(activeMode==='read')readScroll();else if(activeMode==='listen')renderAudioPosition();else setAgeProgress(0);check();
}
function buildListeningTimeline(){
 listenOrder=LISTEN_CUES.map((_,i)=>i);
 const scale=narrationTotal/EXPECTED_DURATION;
 listenStarts=LISTEN_CUES.map(c=>c.start*scale);
}
function phraseForTime(t){if(!listenStarts.length)return 0;let lo=0,hi=listenStarts.length-1;while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(listenStarts[mid]<=t)lo=mid;else hi=mid-1}return listenOrder[lo]??0}
async function loadStory(){const r=await fetch('texto.md?v=15',{cache:'no-store'});if(!r.ok)throw Error('texto');rawText=await r.text();phrases=splitPhrases(rawText);buildReader(rawText);buildListeningTimeline();currentIndex=-1;renderLine(0);storyReady=true;check()}
function loadNarration(){return new Promise((resolve,reject)=>{audio.preload='metadata';audio.src=MASTER_AUDIO;const timer=setTimeout(()=>reject(Error('audio')),12000);audio.onloadedmetadata=()=>{clearTimeout(timer);if(audio.duration>0&&isFinite(audio.duration)){narrationTotal=audio.duration;audioReady=true;if(storyReady)buildListeningTimeline();check();resolve()}else reject(Error('audio'))};audio.onerror=()=>{clearTimeout(timer);audioReady=false;status.textContent='audio completo no disponible';reject(Error('audio'))};audio.load()})}
function stopAudio(){cancelAnimationFrame(raf);audio.pause()}
function renderAudioPosition(){if(activeMode!=='listen')return;const t=audio.currentTime,d=audio.duration||narrationTotal,p=clamp(t/d);renderLine(phraseForTime(t));root.style.setProperty('--prog',p.toFixed(5));setAgeProgress(p);voiceSeek.value=String(Math.round(p*1000));voiceTime.textContent=formatTime(t)+' / '+formatTime(d);const grayStart=(listenStarts[LISTEN_CUES.findIndex(c=>c.text.includes('Cuando finalmente salieron'))]??d*.55);setGrayProgress((t-grayStart)/(d-grayStart))}
function syncAudio(){cancelAnimationFrame(raf);if(activeMode!=='listen'||paused)return;renderAudioPosition();raf=requestAnimationFrame(syncAudio)}
function playMaster(fromStart=false){if(!audioReady){status.textContent='audio completo no disponible';return}if(fromStart)audio.currentTime=0;paused=false;pauseBtn.textContent='Pausa';status.textContent='narración completa · '+formatTime(audio.duration||narrationTotal);audio.onended=finish;audio.play().then(syncAudio).catch(()=>{paused=true;pauseBtn.textContent='Seguir';status.textContent='pulsa Seguir para escuchar'})}
function resetVisuals(){lastGray=0;currentAgeState=-1;setAgeProgress(0);root.style.setProperty('--gray','0');root.style.setProperty('--prog','0');voiceSeek.value='0';voiceTime.textContent='0:00 / '+formatTime(audio.duration||narrationTotal)}
const clarityLevel=$('clarityLevel'),clarityValue=$('clarityValue'),clarityHold=$('clarityHold'),clarityStatus=$('clarityStatus'),revealContinue=$('revealContinue');
const CLARITY_SECONDS=20;
let clarityFrame=0,clarity=0,clarityRunning=false;
function setClarity(value){
 clarity=clamp(value);root.style.setProperty('--clarity',clarity.toFixed(4));
 clarityLevel.value=String(Math.round(clarity*100));clarityValue.textContent=clarityLevel.value+' %';
}
function holdClarity(){
 cancelAnimationFrame(clarityFrame);clarityFrame=0;clarityRunning=false;clarityHold.textContent='Aclarar lentamente';
 clarityStatus.textContent=clarity>=1?'La imagen está clara. Continúa cuando quieras.':'Nitidez fijada. Continúa cuando quieras.';
}
function clarifySlowly(){
 holdClarity();const initial=clarity,start=performance.now();
 const duration=CLARITY_SECONDS*1000*(1-initial);
 clarityRunning=true;clarityHold.textContent='Fijar nitidez';clarityStatus.textContent='La imagen se aclara lentamente…';
 const tick=now=>{
  if(!clarityRunning)return;
  const progress=duration>0?clamp((now-start)/duration):1;
  const eased=progress*progress*(3-2*progress);setClarity(initial+(1-initial)*eased);
  if(progress>=1){setClarity(1);holdClarity();return;}
  clarityFrame=requestAnimationFrame(tick);
 };
 clarityFrame=requestAnimationFrame(tick);
}
function prepareVersion(mode){
 startMusic();stopAudio();activeMode=mode;paused=true;
 body.className=(mode==='listen'?'listen-mode':'read-mode')+' revealing';modeSwitch.hidden=false;entry.classList.add('open');
 resetVisuals();scrollTo(0,0);currentIndex=-1;renderLine(0);
 revealContinue.textContent=mode==='listen'?'Escuchar el cuento':'Leer el cuento';
 status.textContent='transición con música';holdClarity();setClarity(0);clarifySlowly();
}
function startListen(){if(!(storyReady&&audioReady)){status.textContent='cargando narración completa';return;}prepareVersion('listen')}
function startRead(){if(storyReady)prepareVersion('read')}
clarityLevel.addEventListener('input',()=>{setClarity(Number(clarityLevel.value)/100);holdClarity()});
clarityHold.addEventListener('click',()=>{if(clarityRunning)holdClarity();else clarifySlowly()});
revealContinue.onclick=()=>{
 if(!activeMode || !body.classList.contains('revealing'))return;
 holdClarity();body.classList.remove('revealing');
 if(activeMode==='listen')playMaster(true);
 else{status.textContent='lectura sin voz';readScroll();}
};
function readScroll(){if(activeMode!=='read'||body.classList.contains('revealing'))return;const max=Math.max(1,document.documentElement.scrollHeight-innerHeight),p=clamp(scrollY/max);root.style.setProperty('--prog',p.toFixed(4));setAgeProgress(p);const night=.55;setGrayProgress((p-night)/(1-night))}
function finish(){cancelAnimationFrame(raf);setAgeProgress(1);renderLine(LISTEN_CUES.length-1);root.style.setProperty('--prog','1');voiceSeek.value='1000';voiceTime.textContent=formatTime(audio.duration||narrationTotal)+' / '+formatTime(audio.duration||narrationTotal);status.textContent='fin';paused=true;pauseBtn.textContent='Repetir'}
function restartListen(){stopAudio();resetVisuals();currentIndex=-1;renderLine(0);playMaster(true)}
voiceSeek.oninput=()=>{if(activeMode!=='listen'||!audioReady)return;audio.currentTime=(audio.duration||narrationTotal)*Number(voiceSeek.value)/1000;lastGray=0;renderAudioPosition()};
listenBtn.onclick=startListen;readBtn.onclick=startRead;
pauseBtn.onclick=()=>{if(activeMode!=='listen')return;if(paused){if(audio.ended||audio.currentTime>=(audio.duration||narrationTotal)-.2){restartListen();return}paused=false;pauseBtn.textContent='Pausa';audio.play().then(syncAudio).catch(()=>{paused=true;pauseBtn.textContent='Seguir'})}else{paused=true;pauseBtn.textContent='Seguir';cancelAnimationFrame(raf);audio.pause()}};
restartBtn.onclick=()=>{if(activeMode==='listen')restartListen()};
modeSwitch.onclick=()=>{holdClarity();setClarity(0);stopAudio();entry.classList.remove('open');body.className='';activeMode=null;modeSwitch.hidden=true;resetVisuals();scrollTo(0,0)};
addEventListener('scroll',readScroll,{passive:true});
for(const event of ['timeupdate','seeking','seeked','loadedmetadata'])audio.addEventListener(event,renderAudioPosition);
addEventListener('beforeunload',()=>{holdClarity();stopAudio()});
Promise.allSettled([loadStory(),loadSequence(),loadNarration()]).then(rs=>{check();if(rs[0].status==='rejected'){status.textContent='error al cargar el texto';document.querySelector('.hint').textContent='No se ha podido cargar el cuento. Recarga la página.'}else if(rs[2].status==='rejected'&&!audioReady&&!activeMode){status.textContent='texto listo · audio no disponible';document.querySelector('.hint').textContent='La lectura está disponible. Recarga la página para volver a cargar el audio.'}});
})();
</script>
