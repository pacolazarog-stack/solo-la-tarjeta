<style>

<body>

<script>
(()=>{
const $=id=>document.getElementById(id),root=document.documentElement,body=document.body;

function updateMusic(){const level=Math.max(0,Math.min(.8,Number(musicLevel.value)/100));musicValue.textContent=Math.round(level*100)+' %';if(!inheritedMusic){music.volume=level;music.muted=!musicEnabled.checked}}
function startMusic(){if(inheritedMusic){sendMusic('start');return}updateMusic();if(musicEnabled.checked&&music.paused)music.play().then(()=>musicStart.hidden=true).catch(()=>musicStart.hidden=false)}
musicLevel.oninput=()=>{updateMusic();if(inheritedMusic)sendMusic('level')};musicEnabled.onchange=()=>{updateMusic();if(inheritedMusic)sendMusic('enabled');else startMusic()};musicStart.onclick=startMusic;
if(inheritedMusic){addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.channel!=='ceniciento-music-v1'||e.data.type!=='state')return;musicLevel.value=String(Math.round(Math.max(0,Math.min(.8,Number(e.data.level)||0))*100));musicEnabled.checked=!!e.data.enabled;updateMusic();musicStart.hidden=!musicEnabled.checked||!!e.data.playing});sendMusic('ready')}else{music.src='../elegia-breve/ana-klaudya.m4a';updateMusic()}
back.onclick=()=>{voice.pause();if(inheritedMusic)sendMusic('close');else history.back()};
const CUES=[
{t:0,text:''},{t:2.692,text:'Las siete y doce.',n:1},{t:10.914,text:'No estaban las pequeñas manchas.',n:2},{t:23.4,text:'La piel parecía más firme.',n:3},{t:34,text:''},{t:62.194,text:'No puede ser.',n:4},{t:76,text:''},{t:93.996,text:'Aquello era absurdo.\nY maravilloso.',n:5},{t:105,text:''},{t:116.91,text:'El tiempo había rectificado.',n:6},{t:124.032,text:'Eso formaba parte de la gracia.\nY del miedo.',n:7},{t:130,text:''},
{t:136.416,text:'Hola, Paco.',n:8},{t:150,text:''},{t:163.061,text:'Treinta y tantos.',n:9},{t:166.043,text:'Era difícil calcular la edad de uno mismo.',n:10},{t:174.335,text:'A un tipo.',n:11},{t:176.796,text:'Mucho.',n:12},{t:184,text:''},{t:265.082,text:'El muchacho seguía allí.',n:13},{t:272.967,text:'Estoy comprobando una cosa.',n:14},{t:276.169,text:'Todavía sí.',n:15},{t:281,text:''},{t:315.807,text:'Brasil.',n:16},{t:324,text:''},{t:370.578,text:'Como si hubiera un botón.',n:17},{t:382.262,text:'Menos mal que no funcionaba.',n:18},{t:386.764,text:'Habría sido una pena.',n:19},{t:395.008,text:'Eso ha sido bonito.',n:20},{t:398.2,text:''},
{t:399.71,text:'Las nueve y treinta y ocho.',n:21},{t:411.5,text:'Todo acabaría.',n:22},{t:421,text:''},{t:432.972,text:'Antes de convertirme en calabaza.',n:23},{t:441.549,text:'Ceniciento.',n:24,kind:'hero'},{t:455.918,text:'Todavía no.',n:25},{t:461,text:''},{t:506.24,text:'La noche no admitía trucos.',n:26},{t:514,text:''},{t:565.595,text:'Empezaba a desear que aquello no terminara.',n:27},{t:574,text:''},{t:624.343,text:'Buenas noches, Ceniciento.',n:28},{t:631,text:''},{t:656.434,text:'Ya estamos.',n:29},{t:660,text:''},
{t:685.786,text:'El joven estaba desapareciendo.',n:30},{t:696,text:''},{t:711.588,text:'El hechizo se extinguía.',n:31},{t:724,text:''},{t:760.167,text:'Ella nunca había visto al joven.',n:32},{t:769,text:'Había estado siempre sentado\nel hombre de sesenta y dos años.',n:33},{t:781.539,text:'Cuando había caminado junto a él.',n:34},{t:785.501,text:'Había abrazado a ese hombre.',n:35},{t:791.285,text:'No al muchacho.',n:36},{t:792.766,text:'A él.',n:37,kind:'hero'},{t:801,text:''},{t:851.866,text:'El hombre que fue.',n:38},{t:856.5,text:'El hombre que era.',n:39},{t:859.065,text:'alguien había estado mirando\nal hombre que era',n:40,kind:'final'}];
let frames=[],mode=null,raf=0,paused=true,current=-1,clarity=0,clarityRAF=0,readyText=false,readyVoice=false,readyFrames=false;
const clamp=x=>Math.max(0,Math.min(1,x)),fmt=t=>{const n=Math.max(0,Math.floor(t||0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};
function check(){read.disabled=!readyText;listen.disabled=!(readyText&&readyVoice&&readyFrames);if(!mode&&readyText)status.textContent=listen.disabled?'texto listo · cargando voz e imágenes':'listo'}
async function loadFrames(){const arr=await Promise.all(Array.from({length:10},async(_,i)=>{const u=`frames-v2/${String(i+1).padStart(2,'0')}.b64?v=20261010-partitura`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(u);return 'data:image/webp;base64,'+(await r.text()).trim()}));frames=arr;setAge(0);readyFrames=true;check()}
async function loadText(){const r=await fetch('texto.md?v=16',{cache:'no-store'});if(!r.ok)throw Error('texto');let raw=await r.text();raw=raw.replace(/^#\s*CENICIENTO\s*/i,'').trim();readerText.innerHTML='';raw.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean).forEach(p=>{const el=document.createElement('p');el.textContent=p;readerText.appendChild(el)});readyText=true;check()}
voice.src=MASTER;voice.onloadedmetadata=()=>{readyVoice=true;time.textContent='0:00 / '+fmt(voice.duration||EXPECTED);check()};voice.onerror=()=>{status.textContent='audio no disponible'};voice.load();
function setAge(p){if(frames.length<2)return;const pos=clamp(p)*(frames.length-1),i=Math.min(frames.length-2,Math.floor(pos)),mix=pos-i;const a=frames[i],b=frames[i+1];if(ageA.src!==a){ageA.src=a;bgA.src=a}if(ageB.src!==b){ageB.src=b;bgB.src=b}ageA.style.opacity=bgA.style.opacity='1';ageB.style.opacity=bgB.style.opacity=String(mix);root.style.setProperty('--gray',String(clamp((p-.55)/.45)))}
function cueAt(t){let lo=0,hi=CUES.length-1;while(lo<hi){const m=Math.ceil((lo+hi)/2);if(CUES[m].t<=t)lo=m;else hi=m-1}return lo}
function renderCue(i){if(i===current)return;current=i;const c=CUES[i];screen.textContent=c.text||'';screen.className='screen'+(!c.text?' blank':'')+(c.kind==='hero'?' hero':'')+(c.kind==='final'?' final':'');screen.dataset.screen=c.n||''}
function render(){if(mode!=='voice')return;const d=voice.duration||EXPECTED,t=voice.currentTime,p=clamp(t/d);renderCue(cueAt(t));root.style.setProperty('--prog',p.toFixed(5));setAge(p);seek.value=String(Math.round(p*1000));time.textContent=fmt(t)+' / '+fmt(d)}
function loop(){cancelAnimationFrame(raf);if(mode!=='voice'||paused)return;render();raf=requestAnimationFrame(loop)}
function reset(){current=-1;renderCue(0);root.style.setProperty('--prog','0');setAge(0);seek.value='0';time.textContent='0:00 / '+fmt(voice.duration||EXPECTED)}
function stop(){cancelAnimationFrame(raf);voice.pause();paused=true}
function startClarity(){cancelAnimationFrame(clarityRAF);clarity=0;root.style.setProperty('--clarity','0');cont.disabled=true;clarityStatus.textContent='La imagen se aclara lentamente…';const start=performance.now(),dur=10000;const tick=now=>{const p=clamp((now-start)/dur),e=p*p*(3-2*p);clarity=e;root.style.setProperty('--clarity',e.toFixed(4));if(p<1)clarityRAF=requestAnimationFrame(tick);else{clarity=1;cont.disabled=false;clarityStatus.textContent='La imagen está clara. Continúa cuando quieras.'}};clarityRAF=requestAnimationFrame(tick)}
function prepare(next){startMusic();stop();mode=next;body.className=(next==='voice'?'voice':'read')+' revealing';entry.classList.add('open');switchBtn.hidden=false;reset();scrollTo(0,0);startClarity();cont.textContent=next==='voice'?'Escuchar el cuento':'Leer el cuento';status.textContent='transición con música'}
listen.onclick=()=>prepare('voice');read.onclick=()=>prepare('read');
cont.onclick=()=>{if(clarity<1)return;body.classList.remove('revealing');if(mode==='voice'){voice.currentTime=0;paused=false;pause.textContent='Pausa';status.textContent='narración completa';voice.play().then(loop).catch(()=>{paused=true;pause.textContent='Seguir'})}else status.textContent='lectura sin voz'};
pause.onclick=()=>{if(mode!=='voice'||body.classList.contains('revealing'))return;if(paused){if(voice.ended||voice.currentTime>=(voice.duration||EXPECTED)-.2)voice.currentTime=0;paused=false;pause.textContent='Pausa';voice.play().then(loop)}else{paused=true;pause.textContent='Seguir';cancelAnimationFrame(raf);voice.pause()}};

voice.ontimeupdate=render;voice.onseeked=render;voice.onended=()=>{cancelAnimationFrame(raf);paused=true;pause.textContent='Repetir';renderCue(CUES.length-1);root.style.setProperty('--prog','1');setAge(1);seek.value='1000';time.textContent=fmt(voice.duration||EXPECTED)+' / '+fmt(voice.duration||EXPECTED);status.textContent='fin'};
Promise.allSettled([loadText(),loadFrames()]).then(check);
})();
