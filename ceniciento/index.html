<style>
:root{--gray:0;--age:0;--paper:rgba(249,246,238,.92);--ink:#231e1a;color-scheme:light}*{box-sizing:border-box}html{background:#17130f;scroll-behavior:smooth;overflow-x:hidden}body{margin:0;min-height:100%;overflow-x:hidden;background:#17130f;color:var(--ink);font-family:Iowan Old Style,Palatino Linotype,Book Antiqua,Palatino,Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}body.locked{overflow:hidden;touch-action:none}#sourcePhoto{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-10px;top:-10px}.bg{position:fixed;inset:-7%;z-index:0;background:#17130f center 32%/cover no-repeat;transform:scale(1.05);filter:grayscale(var(--gray)) saturate(calc(1 - .68*var(--gray))) brightness(calc(.62 - .09*var(--gray))) contrast(calc(1 + .12*var(--gray)));transition:filter .16s linear}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(12,10,8,.16),rgba(12,10,8,.52) 55%,rgba(10,10,10,.82));box-shadow:inset 0 0 180px rgba(0,0,0,.46)}.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.045;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.42) 0 .55px,transparent .75px),radial-gradient(circle at 73% 64%,rgba(0,0,0,.38) 0 .55px,transparent .75px);background-size:9px 9px,13px 13px;mix-blend-mode:soft-light}.portrait{position:fixed;left:50%;top:6svh;z-index:8;transform:translateX(-50%);width:min(72vw,500px);aspect-ratio:1122/1402;border-radius:28px;overflow:hidden;background:#211914;box-shadow:0 28px 90px rgba(0,0,0,.44),0 0 0 1px rgba(255,244,222,.17)}.portrait canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .14s linear}.portrait canvas:first-child{opacity:1}.portrait:after{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(to bottom,rgba(255,209,143,.09),transparent 44%,rgba(0,0,0,.07));mix-blend-mode:screen}.entry{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(17,13,10,.50);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);transition:opacity 1.1s ease,visibility 1.1s ease}.entry.open{opacity:0;visibility:hidden;pointer-events:none}.entry-card{text-align:center;color:#f5ecdc;text-shadow:0 2px 18px rgba(0,0,0,.5);padding:26px}.entry h1{margin:0;font-size:clamp(2.4rem,8vw,5rem);font-weight:500;letter-spacing:.08em}.entry .flag{margin:.75rem 0 1.8rem;font:400 .69rem/1 Arial,sans-serif;letter-spacing:.34em;opacity:.62}.entry button{appearance:none;border:1px solid rgba(255,239,214,.44);border-radius:999px;padding:.88em 1.8em;background:rgba(30,23,17,.56);color:#f5ecdc;font:500 .75rem/1 Arial,sans-serif;letter-spacing:.21em;text-transform:uppercase}.entry button:disabled{opacity:.45}.age-line{position:fixed;right:max(10px,env(safe-area-inset-right));top:50%;z-index:15;transform:translateY(-50%);width:1px;height:30svh;background:rgba(255,255,255,.18)}.age-line:after{content:"";position:absolute;bottom:0;left:0;width:1px;height:calc(var(--age)*100%);background:linear-gradient(to top,#f1f1f1,#a7a7a7);box-shadow:0 0 10px rgba(255,255,255,.25)}main{position:relative;z-index:12;width:min(calc(100% - 34px),720px);margin:0 auto;padding:72svh 0 22svh}.title-card{text-align:center;color:#f3eadb;text-shadow:0 3px 20px rgba(0,0,0,.52);margin:0 0 18svh}.title-card h2{margin:0;font-size:clamp(2rem,5vw,3.4rem);font-weight:500;letter-spacing:.055em}.title-card p{margin:.8rem 0 0;font:400 .68rem/1 Arial,sans-serif;letter-spacing:.29em;opacity:.62}.story{width:min(100%,47ch);margin:0 auto}.beat{margin:0 0 13svh;padding:1.02em 1.08em 1.1em;border-radius:17px;background:var(--paper);box-shadow:0 12px 40px rgba(0,0,0,.14);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);opacity:.10;transform:translateY(14px);transition:opacity .8s ease,transform .8s ease}.beat.show{opacity:1;transform:none}.beat p{margin:.72em 0;font-size:clamp(1.08rem,2.45vw,1.39rem);line-height:1.62}.beat p:first-child{margin-top:0}.beat p:last-child{margin-bottom:0}.beat.key{margin-top:18svh;margin-bottom:18svh;text-align:center;font-size:1.06em;background:rgba(250,247,241,.96)}.beat.cold{background:rgba(245,245,243,.93)}.beat.final{margin-bottom:40svh;text-align:center;background:rgba(242,242,240,.95)}.sig{text-align:center;color:rgba(255,255,255,.62);font:400 .68rem/1 Arial,sans-serif;letter-spacing:.23em;margin-top:-18svh}.cue{position:fixed;left:50%;bottom:5svh;z-index:18;width:9px;height:9px;border-right:1px solid rgba(255,255,255,.68);border-bottom:1px solid rgba(255,255,255,.68);transform:translateX(-50%) rotate(45deg);opacity:0;transition:opacity .5s;animation:cue 2.2s ease-in-out infinite}body.ready:not(.scrolled) .cue{opacity:.72}@keyframes cue{50%{translate:0 7px}}@media(max-width:640px){.portrait{top:5svh;width:min(82vw,430px);border-radius:22px}main{padding-top:64svh;width:min(calc(100% - 24px),720px)}.story{width:min(100%,34ch)}.beat{margin-bottom:11svh;padding:.9em .92em}.beat p{font-size:clamp(1.06rem,4.9vw,1.31rem);line-height:1.59}.age-line{height:24svh;right:7px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.beat,.entry,.portrait canvas{transition-duration:.01ms}.cue{animation:none}}

<body class="locked">
<iframe id="sourcePhoto" src="../ceniciento-original/" aria-hidden="true"></iframe>
<div class="bg" id="bg" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div><div class="portrait" id="portrait" aria-label="Imagen central de Ceniciento"></div><div class="age-line" aria-hidden="true"></div>
<div class="entry" id="entry"><div class="entry-card"><h1>CENICIENTO</h1><p class="flag">flag</p><button id="enter" type="button" disabled>Entrar</button></div></div><div class="cue" aria-hidden="true"></div>
<main><div class="title-card"><h2>CENICIENTO</h2><p>flag · 2026</p></div><article class="story" id="story"></article><div class="sig">flag · 2026</div></main>
<script>
(()=>{const root=document.documentElement,body=document.body,entry=document.getElementById('entry'),enter=document.getElementById('enter'),source=document.getElementById('sourcePhoto'),bg=document.getElementById('bg'),portrait=document.getElementById('portrait'),story=document.getElementById('story');let frames=[],ready=false,maxAge=0,maxGray=0,ageStart=null,ageEnd=null,grayStart=null,grayEnd=null,photoReady=false,textReady=false;const clamp=v=>Math.max(0,Math.min(1,v)),smooth=t=>t*t*(3-2*t);function check(){enter.disabled=!(photoReady&&textReady)}function pointInPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}function buildStory(raw){raw=raw.trim().replace(/^#\s*CENICIENTO\s*/,'').trim();const paras=raw.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);let group=[];const flush=()=>{if(!group.length)return;const s=document.createElement('section');s.className='beat';const joined=group.join(' ');if(joined.includes('—Todavía no.')||joined.includes('No al muchacho.')||joined.includes('A él.'))s.classList.add('key');if(joined.includes('Cuando finalmente salieron')||joined.includes('Fuera, Granada')||joined.includes('El aire era frío'))s.classList.add('cold');if(joined.includes('A Cenicienta el prodigio'))s.classList.add('final');group.forEach(t=>{const p=document.createElement('p');p.textContent=t;s.appendChild(p)});story.appendChild(s);group=[]};paras.forEach(p=>{group.push(p);const hard=p==='—Todavía no.'||p==='A él.'||p==='No al muchacho.'||p.startsWith('Cuando finalmente salieron')||p.startsWith('A Cenicienta el prodigio');if(group.length>=4||hard)flush()});flush();const all=[...story.querySelectorAll('p')];ageStart=all.find(p=>p.textContent==='Las nueve y treinta y ocho.')||all[Math.floor(all.length*.45)];const nm=all.filter(p=>p.textContent==='No al muchacho.');ageEnd=nm[nm.length-1]||all[Math.floor(all.length*.88)];grayStart=all.find(p=>p.textContent.startsWith('Cuando finalmente salieron'))||all[Math.floor(all.length*.58)];grayEnd=all[all.length-1];textReady=true;check()}fetch('texto.md?v=3',{cache:'no-store'}).then(r=>r.text()).then(buildStory);
function makeFrame(img,fh,fb,fe){const w=560,h=Math.round(img.naturalHeight*w/img.naturalWidth),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);if(fh||fb||fe){const im=x.getImageData(0,0,w,h),d=im.data,hair=[[0,0],[.374,0],[.446,.039],[.468,.107],[.446,.157],[.410,.196],[.361,.175],[.312,.170],[.263,.180],[.209,.200],[.147,.228],[.076,.248],[0,.243]],beard=[[.187,.253],[.441,.250],[.463,.307],[.450,.374],[.419,.453],[.374,.499],[.299,.499],[.241,.457],[.200,.385],[.178,.314]];for(let py=0;py<h;py++)for(let px=0;px<w;px++){const nx=px/w,ny=py/h,i=(py*w+px)*4,r=d[i],g=d[i+1],b=d[i+2],lum=.2126*r+.7152*g+.0722*b;if(!(lum<140&&r<165&&g<145&&b<132))continue;let a=0;if(pointInPoly(nx,ny,hair))a=Math.max(a,fh);if(pointInPoly(nx,ny,beard))a=Math.max(a,fb);const e1=((nx-.265)/.043)**2+((ny-.235)/.017)**2<1,e2=((nx-.390)/.043)**2+((ny-.236)/.017)**2<1;if(e1||e2)a=Math.max(a,fe);if(!a)continue;const silver=Math.max(178,Math.min(238,178+lum*.43));d[i]=r*(1-a)+silver*a;d[i+1]=g*(1-a)+silver*a;d[i+2]=b*(1-a)+silver*a}x.putImageData(im,0,0)}c.style.opacity='0';portrait.appendChild(c);return c}function preparePhoto(src){const img=new Image();img.onload=()=>{bg.style.backgroundImage=`url("${src}")`;frames=[makeFrame(img,0,0,0),makeFrame(img,.55,.36,.24),makeFrame(img,1,1,1)];frames[0].style.opacity='1';photoReady=true;check();render()};img.src=src}source.addEventListener('load',()=>{try{const im=source.contentDocument.querySelector('.photo img');if(im&&im.src)preparePhoto(im.src)}catch(e){}});
function yOf(el){return el.getBoundingClientRect().top+scrollY}function spanProgress(a,b){if(!a||!b)return 0;const sy=yOf(a)-innerHeight*.62,ey=yOf(b)-innerHeight*.42;return smooth(clamp((scrollY-sy)/Math.max(1,ey-sy)))}function reveal(){const y=innerHeight*.82;document.querySelectorAll('.beat').forEach(b=>{const r=b.getBoundingClientRect();if(r.top<y&&r.bottom>0)b.classList.add('show')})}function render(){reveal();const age=spanProgress(ageStart,ageEnd);maxAge=Math.max(maxAge,age);const gray=spanProgress(grayStart,grayEnd);maxGray=Math.max(maxGray,gray);root.style.setProperty('--age',maxAge.toFixed(4));root.style.setProperty('--gray',maxGray.toFixed(4));if(frames.length){const pos=maxAge*2,i=Math.min(1,Math.floor(pos)),f=pos-i;frames.forEach(c=>c.style.opacity='0');frames[i].style.opacity=String(1-f);frames[i+1].style.opacity=String(f);if(maxAge>=1){frames.forEach(c=>c.style.opacity='0');frames[2].style.opacity='1'}}if(scrollY>5)body.classList.add('scrolled')}enter.addEventListener('click',()=>{entry.classList.add('open');body.classList.remove('locked');body.classList.add('ready');scrollTo(0,0);ready=true;setTimeout(render,80)});addEventListener('scroll',()=>{if(ready)requestAnimationFrame(render)},{passive:true});addEventListener('resize',()=>requestAnimationFrame(render));render()})();
</script>
