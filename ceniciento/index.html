<!doctype html>
<html lang="es">
<head>

<title>CENICIENTO · leer o escuchar</title>
<style>
:root{--gray:0;--prog:0;color-scheme:dark}
*{box-sizing:border-box}

.bg video{width:100%;height:100%;object-fit:cover;transform:scale(1.07);filter:grayscale(var(--gray)) saturate(calc(1 - .72*var(--gray))) brightness(calc(.44 - .07*var(--gray))) contrast(calc(1 + .18*var(--gray)));transition:filter 1.1s ease}
.bg:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 28%,rgba(0,0,0,.08),rgba(0,0,0,.48) 64%,rgba(0,0,0,.80)),linear-gradient(to bottom,rgba(17,12,9,.22),rgba(7,7,8,.56));box-shadow:inset 0 0 14vw rgba(0,0,0,.62)}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.035;background-image:radial-gradient(circle,rgba(255,255,255,.55) 0 .4px,transparent .55px);background-size:8px 8px;mix-blend-mode:soft-light}
.portrait{position:fixed;z-index:3;left:50%;top:4.5svh;transform:translateX(-50%);width:min(62vw,470px);aspect-ratio:3/4;border-radius:25px;overflow:hidden;background:#211914;box-shadow:0 24px 95px rgba(0,0,0,.55),0 0 0 1px rgba(255,238,210,.15);transition:width .45s ease,left .45s ease,right .45s ease,top .45s ease,transform .45s ease,opacity .45s ease}
.portrait .age-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;filter:saturate(1.02) contrast(1.025) brightness(.98);transition:opacity .9s ease}.portrait .age-layer.active{opacity:1}
.portrait:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(255,210,145,.06),transparent 45%,rgba(0,0,0,.08));box-shadow:inset 0 0 55px rgba(0,0,0,.13)}
.brand{position:fixed;z-index:12;left:max(15px,env(safe-area-inset-left));top:max(15px,env(safe-area-inset-top));font:500 .65rem/1.2 Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,246,232,.64)}
.controls{position:fixed;z-index:13;right:max(13px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.controls button{border:1px solid rgba(255,255,255,.23);background:rgba(15,13,12,.52);color:rgba(255,255,255,.84);border-radius:999px;padding:.62em .92em;font:500 .62rem/1 Arial,sans-serif;letter-spacing:.11em;text-transform:uppercase;backdrop-filter:blur(8px)}
.karaoke{position:fixed;z-index:7;left:50%;bottom:7.2svh;transform:translateX(-50%);width:min(calc(100% - 30px),850px);text-align:center;text-shadow:0 3px 18px rgba(0,0,0,.88);pointer-events:none}
.line{transition:opacity .55s ease,transform .55s ease;min-height:1.5em}
.prev,.next{font-size:clamp(.82rem,1.8vw,1.02rem);line-height:1.35;color:rgba(245,239,231,.37)}
.prev{margin-bottom:.72rem}.next{margin-top:.78rem}
.current{font-size:clamp(1.34rem,3.35vw,2.15rem);line-height:1.22;font-weight:500;color:#fffaf1;max-width:32ch;margin:auto}
.current.dramatic{font-size:clamp(1.7rem,4.4vw,2.8rem);line-height:1.12}

.progress{position:fixed;z-index:14;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}

.reader{display:none;position:relative;z-index:6;width:min(calc(100% - 32px),760px);margin:0 auto;padding:18svh 0 24svh}
.reader article{background:rgba(248,245,238,.93);color:#211c18;border-radius:22px;padding:clamp(1.25rem,4vw,2.4rem);box-shadow:0 28px 90px rgba(0,0,0,.35);backdrop-filter:blur(10px)}
.reader h1{text-align:center;font-weight:500;letter-spacing:.08em;font-size:clamp(2.2rem,6vw,3.8rem);margin:.2em 0 .18em}

.read-mode .reader{display:block}

.read-mode .portrait{left:auto;right:4vw;top:7svh;transform:none;width:min(31vw,330px);opacity:.94}
.read-mode .controls #pause,.read-mode .controls #restart{display:none}
.read-mode .progress{position:fixed}
.entry{position:fixed;z-index:30;inset:0;display:grid;place-items:center;background:rgba(12,9,8,.56);backdrop-filter:blur(8px);transition:opacity 1.1s ease,visibility 1.1s ease}
.entry.open{opacity:0;visibility:hidden;pointer-events:none}
.card{text-align:center;padding:30px;color:#f8efe3;text-shadow:0 3px 24px rgba(0,0,0,.65)}
.card h1{font-size:clamp(2.7rem,9vw,5.4rem);font-weight:500;letter-spacing:.09em;margin:0}
.card p{font:500 .66rem/1.5 Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,244,230,.65);margin:1rem 0 1.5rem}
.mode-buttons{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
.card button{border:1px solid rgba(255,243,224,.47);background:rgba(36,27,21,.42);color:#fff4e7;border-radius:999px;padding:1em 1.8em;font:600 .7rem/1 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.card button:disabled{opacity:.38}
.hint{margin-top:1rem!important;font-size:.55rem!important;letter-spacing:.1em!important;text-transform:none!important;opacity:.62}
@media(max-width:760px){
 .portrait{top:6.8svh;width:min(82vw,405px);border-radius:21px}
 .karaoke{bottom:8.4svh;width:calc(100% - 22px)}
 .current{font-size:clamp(1.28rem,5.6vw,1.7rem);max-width:28ch}
 .current.dramatic{font-size:clamp(1.55rem,7vw,2.15rem)}
 .prev,.next{font-size:.78rem}.brand{font-size:.55rem}
 .controls button{font-size:.55rem;padding:.58em .75em}
 .read-mode .portrait{left:50%;right:auto;top:5.5svh;transform:translateX(-50%);width:min(66vw,300px);opacity:.88}
 .reader{padding-top:58svh;width:min(calc(100% - 22px),760px)}
 .reader article{padding:1.15rem 1.05rem 1.7rem;border-radius:18px}
 .reader p{font-size:1.07rem;line-height:1.64}
}
@media(prefers-reduced-motion:reduce){.line,.bg video,.progress i,.entry,.portrait{transition-duration:.01ms}}
</style>
</head>
<body>
<div class="bg"><video id="bgv" muted playsinline preload="auto"></video></div><div class="grain"></div>
<div class="portrait"><img id="ageA" class="age-layer active" alt="" aria-hidden="true"><img id="ageB" class="age-layer" alt="" aria-hidden="true"></div>
<div class="brand">Ceniciento · flag · 2026</div>
<div class="controls">
 <button id="modeSwitch" type="button" hidden>Cambiar modo</button>
 <button id="pause" type="button">Pausa</button>
 <button id="restart" type="button">Inicio</button>
</div>
<div class="karaoke" aria-live="polite"><div id="prev" class="line prev"></div><div id="current" class="line current"></div><div id="next" class="line next"></div></div>
<div id="status" class="status">cargando cuento</div><div class="progress"><i></i></div>
<div class="reader" id="reader"><article><h1>CENICIENTO</h1><p class="by">flag · 2026</p><div id="readerText"></div></article></div>
<div id="entry" class="entry"><div class="card"><h1>CENICIENTO</h1><p>cuento · flag · 2026</p><div class="mode-buttons"><button id="listen" disabled>Escuchar</button><button id="read" disabled>Leer</button></div><p class="hint">puede escucharse con texto sincronizado o leerse en silencio</p></div></div>
<audio id="narrator" preload="metadata"></audio>
<script>
(()=>{
const $=id=>document.getElementById(id),root=document.documentElement,body=document.body;
const bgv=$('bgv'),ageA=$('ageA'),ageB=$('ageB'),entry=$('entry'),listenBtn=$('listen'),readBtn=$('read'),pauseBtn=$('pause'),restartBtn=$('restart'),modeSwitch=$('modeSwitch'),audio=$('narrator'),status=$('status');
const prev=$('prev'),cur=$('current'),next=$('next'),readerText=$('readerText');
const seqFiles=[1,2,3,4,5,6].map(n=>`seq/v1-0${n}.txt?v=15`);
const MASTER_AUDIO='CENICIENTO_completo.m4a?v=15';
const EXPECTED_DURATION=1204.72;
const AGE_ANCHORS=[0,2,3,5,6,7,9],AGE_STATES=AGE_ANCHORS.length;
const TIME_ANCHORS=[
 ['Paco miró el reloj antes de sentarse',3.991],
 ['Las siete y doce',8.052],
 ['No estaban las pequeñas manchas',18.816],
 ['La mandíbula conservaba una firmeza olvidada',65.443],
 ['Paco volvió a contemplar sus manos',138.230],
 ['Ahora el tiempo había rectificado',179.213],
 ['Cuando ella entró',202.893],
 ['Después ella dejó el bolso',230.910],
 ['Ella levantó los ojos',275.348],
 ['Durante algunos minutos hablaron',299.872],
 ['El café fue llenándose lentamente',337.478],
 ['Paco contó una historia sobre una estación',368.902],
 ['Ella escuchó hasta el final',404.010],
 ['Ella removió el café',429.115],
 ['Menos mal que no funcionaba',485.276],
 ['Las nueve y treinta y ocho',516.496],
 ['Tengo que irme antes de convertirme en calabaza',572.944],
 ['El camarero dejó la cuenta',601.815],
 ['Todavía no',614.760],
 ['Cuando finalmente salieron',642.641],
 ['Paco sintió de pronto que la noche no admitía trucos',686.293],
 ['Paco llevó la mano hacia su chaqueta',714.547],
 ['Paco notaba las piernas ligeras',749.407],
 ['Paco sintió una alegría infantil',776.616],
 ['Llegaron al lugar donde debían separarse',788.559],
 ['Solo una calle de Granada',816.264],
 ['La luz blanca del interior permanecía encendida',834.434],
 ['El joven estaba desapareciendo',843.123],
 ['Paco contempló la transformación entera',875.144],
 ['Sesenta y dos años',882.370],
 ['El hechizo se extinguía con una eficacia administrativa',892.878],
 ['Entonces recordó el abrazo',929.834],
 ['No al muchacho',933.097],
 ['A él',935.739],
 ['Ella nunca había visto al joven',994.689],
 ['Para ella, en aquella mesa',999.454],
 ['No al muchacho',1053.363,true],
 ['A él',1056.424,true],
 ['Paco apoyó una mano en el cristal',1060.046],
 ['Durante unas horas el tiempo',1068.970],
 ['Paco retiró la mano del cristal',1089.983],
 ['Esta vez no sonrió por resignación',1109.932],
 ['Detrás quedaban el café',1125.677],
 ['Delante no había palacio',1145.132],
 ['Paco avanzó por ella',1159.022],

];
let rawText='',phrases=[],storyReady=false,seqReady=false,audioReady=false,paused=false,currentIndex=0,lastGray=0,videoUrl=null,raf=0,activeMode=null,currentAgeState=0,activeAgeLayer=0,ageFrames=[],narrationTotal=EXPECTED_DURATION;
let listenOrder=[],listenStarts=[];
const clamp=x=>Math.max(0,Math.min(1,x));
function check(){const visualReady=storyReady&&seqReady;readBtn.disabled=!visualReady;listenBtn.disabled=!(visualReady&&audioReady);if(visualReady&&audioReady)status.textContent='listo · narración completa'}
function cleanText(raw){return raw.replace(/^#\s*CENICIENTO\s*/i,'').trim()}
function splitPhrases(raw){const pars=cleanText(raw).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean),out=[];for(const p of pars){if(p.length<=185){out.push(p);continue}out.push(...(p.match(/[^.!?…]+(?:[.!?…]+|$)/g)?.map(x=>x.trim()).filter(Boolean)||[p]))}return out}
const matches=needle=>{const arr=[];phrases.forEach((p,i)=>{if(p.includes(needle))arr.push(i)});return arr};
const ix=(needle,last=false)=>{const a=matches(needle);return a.length?(last?a[a.length-1]:a[0]):-1};
function dramatic(t){return /Todavía no|No al muchacho|^A él\.$|^—?Ceniciento\.?$|Sesenta y dos años|al hombre que era|Las nueve y treinta y ocho|Y por último el calor/i.test(t)}
function phraseWeight(t){let w=Math.max(.65,t.split(/\s+/).length*.34);if(/[,;:]$/.test(t))w+=.12;if(/[.!?…]$/.test(t))w+=.32;if(dramatic(t))w+=.48;return w}
function buildReader(raw){readerText.innerHTML='';for(const p of cleanText(raw).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean)){const el=document.createElement('p');el.textContent=p;if(dramatic(p))el.classList.add('dramatic');if(p.includes('A Cenicienta el prodigio')||p.includes('al hombre que era'))el.classList.add('final');readerText.appendChild(el)}}
function renderLine(i){i=Math.max(0,Math.min(phrases.length-1,i));if(i===currentIndex&&cur.textContent)return;currentIndex=i;let pi=i-1,ni=i+1;if(activeMode==='listen'&&listenOrder.length){const lp=listenOrder.indexOf(i);if(lp>=0){pi=lp>0?listenOrder[lp-1]:-1;ni=lp<listenOrder.length-1?listenOrder[lp+1]:-1}}prev.textContent=pi>=0?(phrases[pi]||''):'';cur.textContent=phrases[i]||'';next.textContent=ni>=0?(phrases[ni]||''):'';cur.className='line current'+(dramatic(phrases[i])?' dramatic':'')+(i===phrases.length-1?' final-line':'');visualByIndex(i)}
function stageFor(i){return clamp(i/Math.max(1,phrases.length-1))}
function showAgeState(state,instant=false){state=Math.max(0,Math.min(AGE_STATES-1,state));if(!ageFrames.length)return;if(state===currentAgeState&&!instant)return;currentAgeState=state;const incoming=activeAgeLayer===0?ageB:ageA,outgoing=activeAgeLayer===0?ageA:ageB;incoming.src=ageFrames[state];if(instant){outgoing.classList.remove('active');incoming.classList.add('active')}else requestAnimationFrame(()=>{incoming.classList.add('active');outgoing.classList.remove('active')});activeAgeLayer=activeAgeLayer===0?1:0}
function setAgeProgress(progress){const p=clamp(progress),state=p>=1?AGE_STATES-1:Math.min(AGE_STATES-1,Math.floor(p*AGE_STATES));showAgeState(state)}
function setGrayProgress(g){lastGray=Math.max(lastGray,clamp(g));root.style.setProperty('--gray',lastGray.toFixed(4))}
function visualByIndex(i){if(activeMode!=='listen')setAgeProgress(stageFor(i));const gs=ix('Cuando finalmente salieron'),ge=phrases.length-1;setGrayProgress(gs>=0?(i-gs)/Math.max(1,ge-gs):0)}
async function loadSequence(){const parts=await Promise.all(seqFiles.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw Error('seq');return(await r.text()).trim()}));const b64=parts.join('').replace(/\s+/g,''),bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);videoUrl=URL.createObjectURL(new Blob([u],{type:'video/mp4'}));bgv.src=videoUrl;const cap=document.createElement('video');cap.muted=true;cap.playsInline=true;cap.preload='auto';cap.src=videoUrl;await Promise.all([new Promise((ok,ko)=>{bgv.onloadedmetadata=ok;bgv.onerror=ko}),new Promise((ok,ko)=>{cap.onloadedmetadata=ok;cap.onerror=ko})]);bgv.currentTime=.04;const canvas=document.createElement('canvas');canvas.width=cap.videoWidth||360;canvas.height=cap.videoHeight||480;const cx=canvas.getContext('2d');const seek=t=>new Promise((ok,ko)=>{const done=()=>{const grab=()=>{cx.drawImage(cap,0,0,canvas.width,canvas.height);ok(canvas.toDataURL('image/webp',.9))};if(cap.requestVideoFrameCallback)cap.requestVideoFrameCallback(grab);else setTimeout(grab,45)};cap.addEventListener('seeked',done,{once:true});cap.onerror=ko;cap.currentTime=Math.min(Math.max(.04,t+.04),Math.max(.04,cap.duration-.04))});ageFrames=[];for(const anchor of AGE_ANCHORS)ageFrames.push(await seek(anchor));ageA.src=ageFrames[0];ageB.src=ageFrames[0];ageA.classList.add('active');ageB.classList.remove('active');activeAgeLayer=0;currentAgeState=0;seqReady=true;check()}
function buildListeningTimeline(){
 const cuts=[['Ella asintió','Ella removió el café'],['Ella dio un paso','La luz blanca del interior permanecía encendida']].map(([a,b])=>[ix(a),ix(b)]);
 const omitted=i=>cuts.some(([a,b])=>a>=0&&b>a&&i>=a&&i<b);
 listenOrder=phrases.map((_,i)=>i).filter(i=>!omitted(i));
 const pos=new Map(listenOrder.map((idx,k)=>[idx,k]));
 const anchors=[];let occurrence={};
 for(const [needle,time,wantLast] of TIME_ANCHORS){const found=matches(needle);if(!found.length)continue;let idx;if(wantLast)idx=found[found.length-1];else{const n=occurrence[needle]||0;idx=found[Math.min(n,found.length-1)];occurrence[needle]=n+1}if(pos.has(idx))anchors.push({p:pos.get(idx),time})}
 anchors.push({p:0,time:Math.min(3.75,anchors[0]?.time||3.75)});anchors.push({p:listenOrder.length,time:narrationTotal});
 anchors.sort((a,b)=>a.p-b.p||a.time-b.time);
 const uniq=[];for(const a of anchors){if(!uniq.length||a.p!==uniq[uniq.length-1].p)uniq.push(a);else uniq[uniq.length-1]=a}
 listenStarts=new Array(listenOrder.length).fill(0);
 for(let a=0;a<uniq.length-1;a++){
   const A=uniq[a],B=uniq[a+1];if(B.p<=A.p)continue;
   const ids=listenOrder.slice(A.p,B.p),ws=ids.map(i=>phraseWeight(phrases[i])),total=ws.reduce((x,y)=>x+y,0)||1;let acc=0;
   for(let k=0;k<ids.length;k++){listenStarts[A.p+k]=A.time+(B.time-A.time)*(acc/total);acc+=ws[k]}
 }
 if(listenStarts.length)listenStarts[listenStarts.length-1]=Math.min(listenStarts[listenStarts.length-1],narrationTotal-.1);
}
function phraseForTime(t){if(!listenStarts.length)return 0;let lo=0,hi=listenStarts.length-1;while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(listenStarts[mid]<=t)lo=mid;else hi=mid-1}return listenOrder[lo]??0}
async function loadStory(){const r=await fetch('texto.md?v=15',{cache:'no-store'});if(!r.ok)throw Error('texto');rawText=await r.text();phrases=splitPhrases(rawText);buildReader(rawText);buildListeningTimeline();currentIndex=-1;renderLine(0);storyReady=true;check()}
function loadNarration(){return new Promise((resolve,reject)=>{audio.preload='metadata';audio.src=MASTER_AUDIO;const timer=setTimeout(()=>reject(Error('audio')),12000);audio.onloadedmetadata=()=>{clearTimeout(timer);if(audio.duration>0&&isFinite(audio.duration)){narrationTotal=audio.duration;audioReady=true;if(storyReady)buildListeningTimeline();check();resolve()}else reject(Error('audio'))};audio.onerror=()=>{clearTimeout(timer);audioReady=false;status.textContent='audio completo no disponible';reject(Error('audio'))};audio.load()})}
function stopAudio(){cancelAnimationFrame(raf);audio.pause()}
function syncAudio(){if(activeMode!=='listen'||paused)return;const t=audio.currentTime,d=audio.duration||narrationTotal;renderLine(phraseForTime(t));root.style.setProperty('--prog',clamp(t/d).toFixed(5));const ageStart=516.496,ageEnd=933.917;setAgeProgress((t-ageStart)/(ageEnd-ageStart));const grayStart=642.641;setGrayProgress((t-grayStart)/(d-grayStart));raf=requestAnimationFrame(syncAudio)}
function playMaster(fromStart=false){if(!audioReady){status.textContent='audio completo no disponible';return}if(fromStart)audio.currentTime=0;paused=false;pauseBtn.textContent='Pausa';status.textContent='narración completa · 20:05';audio.onended=finish;audio.play().then(syncAudio).catch(()=>{paused=true;pauseBtn.textContent='Seguir';status.textContent='pulsa Seguir para escuchar'})}
function resetVisuals(){lastGray=0;currentAgeState=0;if(seqReady)showAgeState(0,true);root.style.setProperty('--gray','0');root.style.setProperty('--prog','0')}
function startListen(){if(!(storyReady&&seqReady&&audioReady)){status.textContent='cargando narración completa';return}activeMode='listen';body.className='listen-mode';modeSwitch.hidden=false;entry.classList.add('open');resetVisuals();currentIndex=-1;renderLine(0);playMaster(true)}
function startRead(){if(!(storyReady&&seqReady))return;activeMode='read';stopAudio();body.className='read-mode';modeSwitch.hidden=false;entry.classList.add('open');resetVisuals();scrollTo(0,0);status.textContent='lectura silenciosa';readScroll()}
function readScroll(){if(activeMode!=='read')return;const max=Math.max(1,document.documentElement.scrollHeight-innerHeight),p=clamp(scrollY/max);root.style.setProperty('--prog',p.toFixed(4));setAgeProgress(p);const night=.55;setGrayProgress((p-night)/(1-night))}
function finish(){cancelAnimationFrame(raf);renderLine(phrases.length-1);root.style.setProperty('--prog','1');status.textContent='fin';paused=true;pauseBtn.textContent='Repetir'}
function restartListen(){stopAudio();resetVisuals();currentIndex=-1;renderLine(0);playMaster(true)}
listenBtn.onclick=startListen;readBtn.onclick=startRead;
pauseBtn.onclick=()=>{if(activeMode!=='listen')return;if(paused){if(audio.ended||audio.currentTime>=(audio.duration||narrationTotal)-.2){restartListen();return}paused=false;pauseBtn.textContent='Pausa';audio.play().then(syncAudio).catch(()=>{paused=true;pauseBtn.textContent='Seguir'})}else{paused=true;pauseBtn.textContent='Seguir';cancelAnimationFrame(raf);audio.pause()}};
restartBtn.onclick=()=>{if(activeMode==='listen')restartListen()};
